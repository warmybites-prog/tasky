async function fetchProjects(){
  if(!currentWorkspaceId) return;
  const { data, error } = await sb
    .from('projects')
    .select('id, workspace_id, name, description, status, position, created_by, created_at, updated_at')
    .eq('workspace_id', currentWorkspaceId)
    .eq('status', 'active')
    .order('position', { ascending: true })
    .order('created_at', { ascending: true });
  if(error){ console.error('تعذّر تحميل المشاريع', error); projects = []; activeProjectId = null; return; }
  projects = data || [];
  if(!projects.some(p => p.id === activeProjectId)) activeProjectId = projects[0]?.id || null;
}

async function fetchTasks(){
  if(!currentWorkspaceId) return;
  const [tasksRes, assigneesRes, subtasksRes, subtaskAssigneesRes, commentsRes] = await Promise.all([
    sb.from('tasks').select('*').eq('workspace_id', currentWorkspaceId).order('created_at', { ascending:true }),
    sb.from('task_assignees').select('task_id, workspace_id, user_id, is_lead, created_at').eq('workspace_id', currentWorkspaceId),
    sb.from('subtasks').select('id, workspace_id, task_id, title, is_completed, position, due_date, created_by, created_at, updated_at').eq('workspace_id', currentWorkspaceId).order('position', {ascending:true}).order('created_at',{ascending:true}),
    sb.from('subtask_assignees').select('subtask_id, workspace_id, user_id, created_at').eq('workspace_id', currentWorkspaceId),
    sb.from('task_comments').select('id, task_id').eq('workspace_id', currentWorkspaceId)
  ]);
  if(tasksRes.error){ console.error('تعذّر تحميل المهام', tasksRes.error); return; }
  if(assigneesRes.error) console.warn('V22 task_assignees unavailable; run V22 migration', assigneesRes.error);
  if(subtasksRes.error) console.warn('V22 subtasks unavailable; run V22 migration', subtasksRes.error);
  if(subtaskAssigneesRes.error) console.warn('V22 subtask_assignees unavailable; run V22 migration', subtaskAssigneesRes.error);
  if(commentsRes.error) console.warn('V22 task_comments unavailable; run V22 migration', commentsRes.error);

  taskAssigneeRows = assigneesRes.data || [];
  subtaskRows = subtasksRes.data || [];
  subtaskAssigneeRows = subtaskAssigneesRes.data || [];
  const commentCounts = (commentsRes.data || []).reduce((acc,row)=>{ acc[row.task_id]=(acc[row.task_id]||0)+1; return acc; },{});
  const today = new Date().toISOString().slice(0,10);

  tasks = (tasksRes.data || []).map(row => {
    let assignmentRows = taskAssigneeRows.filter(a=>a.task_id===row.id);
    let assignees = assignmentRows.map(a=>taskMemberById(a.user_id)).filter(Boolean);
    let leadRow = assignmentRows.find(a=>a.is_lead) || assignmentRows[0] || null;
    if(!assignees.length && row.assignee_id){
      const legacy = taskMemberById(row.assignee_id);
      if(legacy){ assignees=[legacy]; leadRow={user_id:legacy.userId,is_lead:true}; }
    }
    const children = subtaskRows.filter(s=>s.task_id===row.id).map(s=>({
      ...s,
      assignees: subtaskAssigneeRows.filter(a=>a.subtask_id===s.id).map(a=>taskMemberById(a.user_id)).filter(Boolean)
    }));
    const doneCount = children.filter(s=>s.is_completed).length;
    const totalCount = children.length;
    const first = assignees[0] || null;
    const dueDate = row.due_date || null;
    return {
      id: row.id,
      projectId: row.project_id,
      eventId: row.event_id || null,
      cost: Number(row.cost||0),
      col: row.col,
      tag: row.tag || 'operations',
      ar: row.title_ar,
      en: row.title_en || row.title_ar,
      description: row.description || '',
      priority: row.priority || 'medium',
      startDate: row.start_date || null,
      dueDate,
      due_ar: row.due_ar || dueDate || null,
      due_en: row.due_en || dueDate || null,
      overdue: !!(dueDate && dueDate < today && row.col !== 'done'),
      completedAt: row.completed_at || null,
      assigneeId: leadRow?.user_id || row.assignee_id || null,
      leadAssigneeId: leadRow?.user_id || null,
      assignees,
      assignee: first?.initials || row.assignee_initials || '؟',
      assigneeName: first?.fullName || row.assignee_initials || (lang==='ar' ? 'غير مسندة' : 'Unassigned'),
      assigneeColor: first?.color || row.assignee_color || 'var(--blue)',
      comments: commentCounts[row.id] ?? row.comments_count ?? 0,
      subtaskItems: children,
      subtasks: totalCount ? [doneCount,totalCount] : null,
      createdAt: row.created_at,
      updatedAt: row.updated_at
    };
  });
}

async function createWorkspaceForNewUser(userId, companyName, email){
  const slug = companyName.trim().toLowerCase().replace(/\s+/g,'-') + '-' + Date.now().toString(36);
  const { data: ws, error: wsError } = await sb.from('workspaces').insert({ name: companyName, slug, plan_id: 'free' }).select().single();
  if(wsError){ console.error(wsError); return; }
  await sb.from('workspace_members').insert({ workspace_id: ws.id, user_id: userId, role: 'admin', status: 'active', joined_at: new Date().toISOString(), invited_email: email });
  const { error: projectError } = await sb.rpc('tasky_create_project', {
    p_workspace_id: ws.id,
    p_name: 'المهام العامة',
    p_description: null,
    p_position: 0
  });
  if(projectError) console.warn('تعذّر إنشاء المشروع الافتراضي', projectError);
}
async function claimPendingInvite(userId, email){
  // V5: secure SECURITY DEFINER RPC verifies auth.uid() + authenticated email server-side.
  // userId/email parameters are kept only so older call sites do not need special handling.
  const { data, error } = await sb.rpc('accept_my_pending_invites');
  if(error){
    console.warn('تعذّر قبول الدعوة تلقائيًا', error);
    return false;
  }
  return Number(data || 0) > 0;
}

function inviteLinkMarkerPresent(){
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const search = new URLSearchParams(window.location.search);
  return hash.get('type') === 'invite' || search.get('type') === 'invite';
}

async function getAuthoritativeInviteState(session){
  const { data: { user }, error } = await sb.auth.getUser();
  const resolvedUser = (!error && user) ? user : session?.user || null;
  const meta = resolvedUser?.user_metadata || {};
  return {
    user: resolvedUser,
    invited: meta.tasky_invited === true || inviteLinkMarkerPresent(),
    workspaceId: meta.tasky_workspace_id || null
  };
}

function showInviteSetup(show){
  const overlay = document.getElementById('inviteSetupScreen');
  if(overlay) overlay.style.display = show ? 'flex' : 'none';
}

async function hasActiveMembershipForInvite(user){
  if(!user) return false;
  const workspaceId = user.user_metadata?.tasky_workspace_id || null;
  let q = sb
    .from('workspace_members')
    .select('id')
    .eq('user_id', user.id)
    .eq('status', 'active');
  if(workspaceId) q = q.eq('workspace_id', workspaceId);
  const { data, error } = await q.limit(1).maybeSingle();
  return !error && !!data;
}

async function finishInviteSetup(){
  const password = document.getElementById('inviteNewPassword').value;
  const confirmPassword = document.getElementById('inviteConfirmPassword').value;
  const errBox = document.getElementById('inviteSetupError');
  const btn = document.getElementById('inviteSetupBtn');
  errBox.style.display = 'none';

  if(password.length < 8){
    errBox.textContent = 'كلمة المرور لازم تكون 8 أحرف على الأقل.';
    errBox.style.display = 'block';
    return;
  }
  if(password !== confirmPassword){
    errBox.textContent = 'كلمتا المرور غير متطابقتين.';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جاري التفعيل...';

  // Step 1: set the password while the account is still marked as invited.
  const { error: passwordError } = await sb.auth.updateUser({ password });
  if(passwordError){
    errBox.textContent = passwordError.message || 'تعذّر حفظ كلمة المرور.';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'تفعيل الحساب والدخول';
    return;
  }

  // Step 2: only after a password exists, activate the pending workspace membership.
  const claimed = await claimPendingInvite();
  const { data: { user: verifiedUser } } = await sb.auth.getUser();
  const alreadyActive = await hasActiveMembershipForInvite(verifiedUser);

  if(!claimed && !alreadyActive){
    errBox.textContent = 'تم حفظ كلمة المرور، لكن تعذّر تفعيل عضوية الفريق. أعد فتح رابط الدعوة أو تواصل مع مدير مساحة العمل.';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'إعادة محاولة التفعيل';
    return;
  }

  // Step 3: clear the invite flag only after membership activation succeeds.
  const currentMeta = verifiedUser?.user_metadata || {};
  const { error: metadataError } = await sb.auth.updateUser({
    data: {
      ...currentMeta,
      tasky_invited: false,
      tasky_invite_completed_at: new Date().toISOString()
    }
  });

  if(metadataError){
    console.warn('تم التفعيل لكن تعذّر تحديث علامة الدعوة', metadataError);
  }

  // Remove invite tokens/type markers from the address bar after Supabase has persisted the session.
  try{
    window.history.replaceState({}, document.title, window.location.pathname);
  }catch(_){}

  document.getElementById('inviteNewPassword').value = '';
  document.getElementById('inviteConfirmPassword').value = '';
  showInviteSetup(false);
  btn.disabled = false;
  btn.textContent = 'تفعيل الحساب والدخول';
  await checkSession();
}

async function handleAuthSubmit(){
  const email = document.getElementById('authEmail').value.trim().toLowerCase();
  const password = document.getElementById('authPassword').value;
  const errBox = document.getElementById('authError');
  errBox.style.display = 'none';
  if(!email || !password){ errBox.textContent = 'عبّي البريد وكلمة المرور'; errBox.style.display='block'; return; }
  if(authMode === 'signup'){
    const fullName = document.getElementById('authFullName').value.trim();
    const company = document.getElementById('authCompany').value.trim();
    if(!fullName){ errBox.textContent = 'اكتب اسمك الكامل'; errBox.style.display='block'; return; }
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
    if(error){ errBox.textContent = error.message; errBox.style.display='block'; return; }
    if(data.user){
      const claimed = await claimPendingInvite(data.user.id, email);
      if(!claimed){
        if(!company){ errBox.textContent = 'اكتب اسم شركتك أو فريقك (ما فيه دعوة معلّقة لهذا البريد)'; errBox.style.display='block'; return; }
        await createWorkspaceForNewUser(data.user.id, company, email);
      }
    }
    alert('تم إنشاء الحساب! تحقق من بريدك لو طلب منك تفعيل الحساب.');
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ errBox.textContent = error.message; errBox.style.display='block'; return; }
  }
  checkSession();
}
async function signOutUser(){
  await sb.auth.signOut();
  currentWorkspaceId = null;
  currentUserId = null;
  currentUserEmail = null;
  currentUserRole = null;
  projects = [];
  activeProjectId = null;
  tasks = [];
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  const fullNameInput = document.getElementById('authFullName');
  if(fullNameInput) fullNameInput.value = '';
  checkSession();
}

async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  const appEl = document.querySelector('.app');
  const authScreen = document.getElementById('authScreen');

  if(!session || !session.user){
    currentUserId = null;
    currentUserEmail = null;
    currentWorkspaceId = null;
    currentWorkspaceName = null;
    currentUserRole = null;
    authScreen.style.display = 'flex';
    appEl.style.display = 'none';
    showInviteSetup(false);
    renderRoleToggle();
    renderNav();
    return;
  }

  // Do not expose the application until invite setup and membership resolution are complete.
  authScreen.style.display = 'none';
  appEl.style.display = 'none';

  const inviteState = await getAuthoritativeInviteState(session);
  if(inviteState.invited){
    showInviteSetup(true);
    return;
  }

  showInviteSetup(false);
  const loaded = await loadWorkspaceAndData(inviteState.user);
  if(loaded){
    appEl.style.display = 'flex';
    return;
  }

  // A valid Auth session without an active Tasky membership must never fall back to admin UI.
  await sb.auth.signOut();
  authScreen.style.display = 'flex';
  appEl.style.display = 'none';
  const errBox = document.getElementById('authError');
  if(errBox){
    errBox.textContent = 'هذا الحساب لا يملك عضوية نشطة في مساحة عمل تاسكي.';
    errBox.style.display = 'block';
  }
}

let teamMembers = []; // تُعبّى فعليًا من قاعدة البيانات + profiles
const MEMBER_COLORS = ['var(--blue)','var(--teal)','var(--violet)','var(--blue-light)','var(--amber)','var(--green)'];

function initialsFromName(name, email){
  const clean = (name || '').trim();
  if(clean){
    const parts = clean.split(/\s+/).filter(Boolean);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length-1].charAt(0)).toUpperCase();
  }
  return (email || '؟؟').slice(0,2).toUpperCase();
}

async function fetchTeamMembers(){
  if(!currentWorkspaceId) return;
  const { data, error } = await sb
    .from('workspace_members')
    .select('id, user_id, role, status, invited_name, invited_email, invited_by, invited_at, joined_at')
    .eq('workspace_id', currentWorkspaceId)
    .order('invited_at', { ascending: true });
  if(error){ console.error('تعذّر تحميل أعضاء الفريق', error); return; }

  const memberships = data || [];
  const userIds = [...new Set(
    memberships.flatMap(r => [r.user_id, r.invited_by]).filter(Boolean)
  )];
  let profilesById = {};

  if(userIds.length){
    const { data: profileRows, error: profileError } = await sb
      .from('profiles')
      .select('id, full_name, job_title, avatar_url')
      .in('id', userIds);
    if(profileError) console.error('تعذّر تحميل ملفات أعضاء الفريق', profileError);
    profilesById = Object.fromEntries((profileRows || []).map(p => [p.id, p]));
  }

  teamMembers = memberships.map((row, i) => {
    const email = row.invited_email || '—';
    const profile = row.user_id ? profilesById[row.user_id] : null;
    const fullName = profile?.full_name || row.invited_name || email;
    const inviter = row.invited_by ? profilesById[row.invited_by] : null;
    return {
      id: row.id,
      userId: row.user_id || null,
      email,
      fullName,
      invitedName: row.invited_name || null,
      invitedBy: row.invited_by || null,
      invitedByName: inviter?.full_name || null,
      invitedAt: row.invited_at || null,
      joinedAt: row.joined_at || null,
      jobTitle: profile?.job_title || null,
      avatarUrl: profile?.avatar_url || null,
      role: row.role,
      status: row.status,
      color: MEMBER_COLORS[i % MEMBER_COLORS.length],
      initials: initialsFromName(fullName, email)
    };
  });
}

function applyCurrentUserProfile(){
  const me = teamMembers.find(m => m.userId === currentUserId);
  if(!me) return;
  const nameEl = document.getElementById('userName');
  const roleEl = document.getElementById('userRole');
  const avatarEl = document.querySelector('.sidebar-bottom .avatar');
  if(nameEl) nameEl.textContent = me.fullName || me.email;
  if(roleEl) roleEl.textContent = me.jobTitle || (me.role === 'admin' ? t('role_admin') : t('role_member'));
  if(avatarEl){
    avatarEl.style.background = me.color;
    avatarEl.innerHTML = me.avatarUrl ? `<img src="${escapeHtml(me.avatarUrl)}" alt="">` : escapeHtml(me.initials);
  }
}

function assignableMembers(){
  return teamMembers.filter(m => m.status === 'active' && m.userId);
}
function projectMembershipFor(projectId,userId=currentUserId){
  return projectMemberships.find(pm=>pm.project_id===projectId && pm.user_id===userId) || null;
}
function workspaceMemberByUserId(userId){
  return teamMembers.find(m=>m.userId===userId) || null;
}
function projectRoleFor(projectId,userId=currentUserId){
  const wm=workspaceMemberByUserId(userId);
  if((userId===currentUserId && currentUserRole==='admin') || wm?.role==='admin') return 'admin';
  return projectMembershipFor(projectId,userId)?.role || null;
}
function projectRoleLabel(role){
  const ar={admin:'مدير مساحة العمل',manager:'مدير المشروع',editor:'محرر',viewer:'مشاهد'};
  const en={admin:'Workspace admin',manager:'Project manager',editor:'Editor',viewer:'Viewer'};
  return (lang==='ar'?ar:en)[role] || (lang==='ar'?'بدون وصول':'No access');
}
function canManageProjectClient(projectId){ return ['admin','manager'].includes(projectRoleFor(projectId)); }
function canCreateTaskInProject(projectId){ return ['admin','manager','editor'].includes(projectRoleFor(projectId)); }
function canEditTaskClient(task){ return !!task && canCreateTaskInProject(task.projectId); }
function canDeleteTaskClient(task){ return !!task && ['admin','manager'].includes(projectRoleFor(task.projectId)); }
function canCreateAnyTask(){ return projects.some(p=>canCreateTaskInProject(p.id)); }
function projectAssignableMembers(projectId){
  return assignableMembers().filter(m=>projectRoleFor(projectId,m.userId));
}
function projectMemberCount(projectId){
  const ids=new Set(projectMemberships.filter(pm=>pm.project_id===projectId).map(pm=>pm.user_id));
  teamMembers.filter(m=>m.status==='active' && m.role==='admin' && m.userId).forEach(m=>ids.add(m.userId));
  return ids.size;
}

  });
}

function avatarHtml(initials,color,size){
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${size*0.42}px;background:${color}">${initials}</div>`;

function memberAvatarHtml(member,size=26){
  if(!member) return avatarHtml('؟','var(--blue)',size);
  const title = escapeHtml(member.fullName || member.email || '');
  if(member.avatarUrl){
    return `<div class="avatar has-photo" title="${title}" style="width:${size}px;height:${size}px;overflow:hidden;background:transparent"><img src="${escapeHtml(member.avatarUrl)}" alt="" style="width:100%;height:100%;object-fit:contain;background:transparent"></div>`;
  }
  return `<div class="avatar" title="${title}" style="width:${size}px;height:${size}px;font-size:${size*0.38}px;background:${member.color}">${escapeHtml(member.initials || '؟')}</div>`;
}
function assigneeStackHtml(assignees=[], size=26, max=3){
  const list = (assignees || []).filter(Boolean);
  if(!list.length) return `<div class="avatar" title="${lang==='ar'?'غير مسندة':'Unassigned'}" style="width:${size}px;height:${size}px;font-size:${size*.42}px;background:var(--paper);color:var(--muted);border:1px dashed var(--border)">—</div>`;
  const shown = list.slice(0,max).map(m=>memberAvatarHtml(m,size)).join('');
  const extra = list.length-max;
  return `<div class="task-avatar-stack">${shown}${extra>0?`<div class="avatar-more" style="width:${size}px;height:${size}px">+${extra}</div>`:''}</div>`;
}

function formatBytes(bytes){
  const n=Number(bytes||0); if(!n) return '—';
  if(n<1024) return `${n} B`; if(n<1048576) return `${(n/1024).toFixed(1)} KB`; return `${(n/1048576).toFixed(1)} MB`;
}
function formatDateTime(value){
  if(!value) return '';
  try { return new Intl.DateTimeFormat(lang==='ar'?'ar-SA':'en-US',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)); } catch { return String(value); }
}

function fmtMoney(n){ return t('currency')(n.toLocaleString('en-US')); }
function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}
function workspaceInitials(name){
  const clean = String(name || '').replace(/مساحة عمل\s*[—-]?\s*/g,'').trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  if(!parts.length) return 'W';
  return (parts[0]?.[0] || '') + (parts[1]?.[0] || '');
}

function previewWorkspaceLogoFile(input){
  const file = input?.files?.[0];
  const preview = document.getElementById('workspaceLogoPreview');
  if(!file || !preview) return;
  if(file.size > 5 * 1024 * 1024){
    alert(lang==='ar'?'حجم ملف الشعار يجب ألا يتجاوز 5MB':'Logo file must be 5MB or smaller');
    input.value=''; return;
  }
  const reader = new FileReader();
  reader.onload = () => { preview.innerHTML = `<img src="${reader.result}" alt="">`; };
  reader.readAsDataURL(file);
}
async function fileToOptimizedLogoDataUrl(file){
  if(!file) throw new Error('No file selected');
  if(file.size > 5 * 1024 * 1024) throw new Error(lang==='ar'?'حجم الملف أكبر من 5MB':'File is larger than 5MB');
  const sourceDataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error(lang==='ar'?'تعذّرت قراءة ملف الشعار':'Could not read the logo file'));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
  const img = await new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error(lang==='ar'?'صيغة الصورة غير مدعومة':'Unsupported image format'));
    image.src = sourceDataUrl;
  });
  const maxSide = 512;
  const ratio = Math.min(1, maxSide / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
  const w = Math.max(1, Math.round((img.naturalWidth || img.width) * ratio));
  const h = Math.max(1, Math.round((img.naturalHeight || img.height) * ratio));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { alpha:true });
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);
  // WebP preserves transparency and keeps the DB payload compact.
  let out = canvas.toDataURL('image/webp', 0.90);
  // Very old browsers may silently return PNG when WebP is unavailable; either is fine.
  if(!out || !out.startsWith('data:image/')) out = sourceDataUrl;
  if(out.length > 950000){
    // One more compact pass for unusually detailed logos.
    out = canvas.toDataURL('image/webp', 0.78);
  }
  if(out.length > 1200000) throw new Error(lang==='ar'?'الشعار ما زال كبيرًا بعد التحسين؛ جرّب صورة أبسط':'Logo is still too large after optimization');
  return out;
}

async function saveWorkspaceLogo(e){
  e.preventDefault();
  if(!currentWorkspaceId || currentUserRole !== 'admin' || !isPaidPlan()) return;
  const input = document.getElementById('workspaceLogoFile');
  const file = input?.files?.[0];
  if(!file){ alert(lang==='ar'?'اختر ملف الشعار أولًا':'Choose a logo file first'); return; }

  const submit = e.submitter;
  if(submit){ submit.disabled=true; submit.textContent = lang==='ar'?'جارٍ الحفظ...':'Saving...'; }
  try{
    const logoDataUrl = await fileToOptimizedLogoDataUrl(file);
    const { error: saveError } = await sb.rpc('set_workspace_logo', {
      p_workspace_id: currentWorkspaceId,
      p_logo_url: logoDataUrl
    });
    if(saveError) throw saveError;

    currentWorkspaceLogoUrl = logoDataUrl;
    renderWorkspaceBrand();
    closeAddModal();
  }catch(err){
    console.error('workspace logo save failed', err);
    const detail = err?.message || err?.error_description || err?.error || String(err);
    alert((lang==='ar'?'تعذّر حفظ الشعار: ':'Could not save logo: ') + detail);
    if(submit){ submit.disabled=false; submit.textContent = lang==='ar'?'حفظ الشعار':'Save logo'; }
  }
}

async function removeWorkspaceLogo(){
  if(!currentWorkspaceId || currentUserRole !== 'admin' || !isPaidPlan()) return;
  const { error: saveError } = await sb.rpc('set_workspace_logo', {
    p_workspace_id: currentWorkspaceId,

  });

    console.error(saveError);

}

/* ================= PROJECT SWITCHING ================= */
function setActiveProject(id){
  if(!projects.some(p => p.id === id)) return;
  activeProjectId = id;
  activeNav = 'tasks';
  document.getElementById('taskArea').classList.remove('hidden');
  document.getElementById('moduleArea').classList.add('hidden');
  document.getElementById('tasksOnly').classList.remove('hidden');
  document.getElementById('breadcrumbLabel').textContent = currentProject()?.name || t('nav_tasks');
  renderNav();
  renderAll();
}

/* ================= NAV / VIEW SWITCHING ================= */
function setActiveNav(id){
  const item = NAV_ITEMS.find(n=>n.id===id);
  if(item && item.adminOnly && currentUserRole !== 'admin'){ setActiveNav('tasks'); return; }
  if(item && item.group && !item.adminOnly && !item.always && !planAllows(currentPlan, id)){ openUpgradeModal(id); return; }
  activeNav = id;
  renderNav();
  const isTaskish = (id==='tasks' || id==='home');
  document.getElementById('taskArea').classList.toggle('hidden', !isTaskish);
  document.getElementById('moduleArea').classList.toggle('hidden', isTaskish);
  document.getElementById('tasksOnly').classList.toggle('hidden', id!=='tasks');
  document.getElementById('breadcrumbLabel').textContent = id==='tasks' ? (currentProject()?.name || t('nav_tasks')) : t((NAV_ITEMS.find(n=>n.id===id)||{}).key || 'nav_home');
  if(!isTaskish) renderModule();
  renderAll();
}
function setActiveView(id){
  activeView = id;
  renderViewTabs();
  ['board','list','calendar','timeline'].forEach(v => document.getElementById(v+'View').classList.toggle('hidden', v!==id));
  renderAll();
}

/* ================= MODULE ROUTER ================= */
function renderModule(){
  const area = document.getElementById('moduleArea');
  if(activeNav==='inventory') area.innerHTML = inventoryTemplate();
  else if(activeNav==='content') area.innerHTML = contentTemplate();
  else if(activeNav==='events') area.innerHTML = eventsTemplate();
  else if(activeNav==='budgets') area.innerHTML = budgetsTemplate();
  else if(activeNav==='campaigns'){ area.innerHTML = campaignsTemplate(); renderCampaignChart(); }
  else if(activeNav==='requests') area.innerHTML = requestsTemplate();
  else if(activeNav==='comms') area.innerHTML = commsTemplate();
  else if(activeNav==='vendors') area.innerHTML = vendorsTemplate();
  else if(activeNav==='media') area.innerHTML = mediaTemplate();
  else if(activeNav==='assets') area.innerHTML = assetsTemplate();
  else if(activeNav==='reports') area.innerHTML = reportsTemplate();
  else if(activeNav==='analytics') area.innerHTML = analyticsTemplate();
  else if(activeNav==='integrations') area.innerHTML = integrationsTemplate();
  else if(activeNav==='settings') area.innerHTML = settingsTemplate();
  else if(activeNav==='team') area.innerHTML = teamTemplate();
  else if(activeNav==='billing') area.innerHTML = billingTemplate();
}

/* ================= INVENTORY MODULE ================= */

            <span style="color:var(--muted);font-size:11.5px">${escapeHtml(unit)}</span>

        </td>
        <td><span class="status-pill" style="background:${low?'var(--danger-tint)':'var(--green-tint)'};color:${low?'var(--danger)':'var(--green)'}">${low?t('invLowPill'):t('invAvailable')}</span><div style="font-size:10.8px;color:var(--muted);margin-top:4px">${lang==='ar'?'الحد الأدنى':'Min'}: ${formatInventoryNumber(i.min)}</div></td>

        </div></td>

    const item=inventoryItemById(m.item_id); const positive=Number(m.delta)>0;
    return `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="min-width:0"><b style="font-size:12.5px">${escapeHtml(item?L(item,''):(lang==='ar'?'صنف محذوف':'Deleted item'))}</b><div style="font-size:11px;color:var(--muted)">${escapeHtml(m.note||inventoryMemberName(m.created_by))}</div></div>

      <table>
        <thead><tr><th>${t('invColItem')}</th><th>${t('invColCat')}</th><th>${t('invColQty')}</th><th>${t('invColStatus')}</th><th>${t('invColValue')}</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:34px">${inventory.length?(t('invNoResults')):(lang==='ar'?'لا توجد أصناف بعد. أضف أول صنف للمخزون.':'No inventory items yet. Add your first item.')}</td></tr>`}</tbody>
      </table>
    </div>
    <div class="section-card" style="padding:16px 18px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><h3 style="font-size:14px">${lang==='ar'?'آخر حركات المخزون':'Recent stock movements'}</h3><span style="font-size:11px;color:var(--muted)">${lang==='ar'?'محفوظة في سجل دائم':'Permanent audit trail'}</span></div>

}
function formatInventoryNumber(n){ return Number.isInteger(Number(n))?String(Number(n)):Number(n).toLocaleString(lang==='ar'?'ar-SA':'en-US',{maximumFractionDigits:2}); }
function formatInventoryDate(iso){ if(!iso) return ''; try{return new Intl.DateTimeFormat(lang==='ar'?'ar-SA':'en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(iso));}catch{return '';} }

async function deleteInventoryItem(id){ const item=inventoryItemById(id); if(!item)return; const ok=await taskyConfirm(lang==='ar'?`حذف «${L(item,'')}» وكل سجل حركاته؟`:`Delete “${L(item,'')}” and its movement history?`,{title:lang==='ar'?'حذف الصنف':'Delete item',tone:'danger',confirmText:lang==='ar'?'حذف':'Delete'}); if(!ok)return; const {error}=await sb.rpc('delete_inventory_item',{p_item_id:id}); if(error){showTaskyDialog({title:lang==='ar'?'تعذّر الحذف':'Could not delete item',message:error.message,tone:'error'});return;} await fetchInventory(); renderModule(); taskyToast(lang==='ar'?'تم حذف الصنف':'Item deleted',{tone:'success'}); }

/* ================= EVENTS MODULE ================= */
function eventLinkedTasks(eventId){ return tasks.filter(task=>task.eventId===eventId); }
function eventTaskCosts(eventId){ return eventLinkedTasks(eventId).reduce((sum,t)=>sum+Number(t.cost||0),0); }
function eventRemainingBudget(ev){ return Number(ev?.budget||0)-eventTaskCosts(ev?.id); }
function eventTaskStatusLabel(task){ const c=COLUMNS.find(x=>x.id===task.col); return c?t(c.key):(task.col||''); }
function eventBudgetPct(ev){ const b=Number(ev?.budget||0), c=eventTaskCosts(ev?.id); return b>0?Math.min(100,Math.round(c/b*100)):(c>0?100:0); }
function eventInvitations(eventId){ return eventInvitationRows.filter(x=>String(x.eventId)===String(eventId)); }
function eventGuestSeats(eventId,statuses=null){
  const rows=eventInvitations(eventId).filter(x=>!statuses || statuses.includes(x.status));
  return rows.reduce((sum,x)=>sum+Number(x.partySize||1),0);
}
function eventCheckedInSeats(eventId){ return eventInvitations(eventId).filter(x=>x.checkedInAt).reduce((sum,x)=>sum+Number(x.partySize||1),0); }
function eventGuestStats(eventId){
  return {
    invited:eventGuestSeats(eventId,['invited']),
    confirmed:eventGuestSeats(eventId,['confirmed']),
    maybe:eventGuestSeats(eventId,['maybe']),
    declined:eventGuestSeats(eventId,['declined','cancelled']),
    checkedIn:eventCheckedInSeats(eventId),
    total:eventGuestSeats(eventId)
  };
}
function canManageEventClient(ev){ return !!ev && (currentUserRole==='admin' || ev.createdBy===currentUserId || (ev.participantIds||[]).includes(currentUserId)); }
function eventInvitationStatusLabel(status){
  const ar={invited:'بانتظار الرد',confirmed:'مؤكدة',maybe:'ربما',declined:'معتذر',cancelled:'ملغاة'};
  const en={invited:'Awaiting reply',confirmed:'Confirmed',maybe:'Maybe',declined:'Declined',cancelled:'Cancelled'};
  return (lang==='ar'?ar:en)[status]||status;

async function submitEventTask(e,eventId){

  const description=document.getElementById('eventTaskDescription').value.trim()||null;
  const projectId=document.getElementById('eventTaskProject').value;
  const col=document.getElementById('eventTaskStatus').value||'todo';
  const priority=document.getElementById('eventTaskPriority').value;
  const tag=document.getElementById('eventTaskTag').value||'events';
  const startDate=document.getElementById('eventTaskStart').value||null;
  const dueDate=document.getElementById('eventTaskDue').value||null;
  const cost=Math.max(0,Number(document.getElementById('eventTaskCost').value||0));
  let assigneeIds=[...document.querySelectorAll('[data-assignee-box="eventTaskAssignee"]:checked')].map(x=>x.value);
  const leadId=document.getElementById('eventTaskLead').value||null;
  if(leadId && !assigneeIds.includes(leadId)) assigneeIds.unshift(leadId);
  const lead=taskMemberById(leadId || assigneeIds[0]);
  const {data:rpcData,error}=await sb.rpc('tasky_create_event_task',{
    p_event_id:eventId,
    p_project_id:projectId,
    p_title:title,
    p_description:description,
    p_col:col,
    p_tag:tag,
    p_priority:priority,
    p_start_date:startDate,
    p_due_date:dueDate,
    p_cost:cost,
    p_assignee_ids:assigneeIds,
    p_lead_user_id:leadId||null,
    p_assignee_initials:lead?.initials||null,

  });

      title:lang==='ar'?'تعذّر إنشاء مهمة الفعالية':'Could not create event task',

  closeEventTaskModal(); await fetchTasks(); openEventModal(eventId); renderAll(); taskyToast(lang==='ar'?'تمت إضافة مهمة الفعالية بكامل التفاصيل':'Event task added with details',{tone:'success'});

function budgetStatusLabel(status){
  const map=lang==='ar'?{draft:'مسودة',active:'نشطة',closed:'مغلقة'}:{draft:'Draft',active:'Active',closed:'Closed'};
  return map[status]||status;
}
function budgetKindLabel(kind){
  const map=lang==='ar'?{expense:'مصروف',income:'إيراد / استرداد',adjustment:'تسوية'}:{expense:'Expense',income:'Income / refund',adjustment:'Adjustment'};
  return map[kind]||kind;
}
function budgetEntryStatusLabel(status){
  const map=lang==='ar'?{pending:'بانتظار الاعتماد',approved:'معتمد',rejected:'مرفوض'}:{pending:'Pending approval',approved:'Approved',rejected:'Rejected'};
  return map[status]||status;
}
function budgetById(id){return budgets.find(b=>b.id===id)||null;}
function budgetEntriesFor(id){return budgetEntries.filter(e=>e.budgetId===id);}
function budgetApprovedNet(id){
  return budgetEntriesFor(id).filter(e=>e.status==='approved').reduce((sum,e)=>{
    if(e.kind==='income') return sum-Number(e.amount||0);
    return sum+Number(e.amount||0);
  },0);
}
function budgetPendingAmount(id){return budgetEntriesFor(id).filter(e=>e.status==='pending'&&e.kind!=='income').reduce((s,e)=>s+Number(e.amount||0),0);}
function budgetManagerName(b){return taskMemberById(b.ownerUserId)?.fullName || (lang==='ar'?'غير محدد':'Not assigned');}
function canManageBudgetClient(b){return !!b && (currentUserRole==='admin'||b.ownerUserId===currentUserId);}
function budgetPeriodLabel(b){
  if(!b.periodStart&&!b.periodEnd)return lang==='ar'?'بدون فترة محددة':'No fixed period';
  const f=d=>d?new Date(d+'T12:00:00').toLocaleDateString(lang==='ar'?'ar-SA':'en-US',{year:'numeric',month:'short',day:'numeric'}):'—';
  return `${f(b.periodStart)} — ${f(b.periodEnd)}`;
}
function budgetsTemplate(){
  const totalAllocated=budgets.reduce((s,b)=>s+Number(b.allocated||0),0);
  const totalUsed=budgets.reduce((s,b)=>s+Math.max(0,budgetApprovedNet(b.id)),0);
  const totalPending=budgets.reduce((s,b)=>s+budgetPendingAmount(b.id),0);
  const overCount=budgets.filter(b=>budgetApprovedNet(b.id)>Number(b.allocated||0)).length;

async function fetchBudgets(){
  if(!currentWorkspaceId){budgets=[];budgetEntries=[];return;}
  const [bq,eq]=await Promise.all([
    sb.from('workspace_budgets').select('id,workspace_id,name_ar,name_en,category,period_start,period_end,allocated_amount,status,owner_user_id,notes,created_by,created_at,updated_at').eq('workspace_id',currentWorkspaceId).order('created_at',{ascending:true}),
    sb.from('budget_entries').select('id,workspace_id,budget_id,kind,amount,status,occurred_on,description,vendor_name,reference_no,event_id,task_id,requested_by,approved_by,approved_at,rejection_reason,created_at,updated_at').eq('workspace_id',currentWorkspaceId).order('created_at',{ascending:false})
  ]);
  if(bq.error){console.warn('V30 budgets unavailable; run V30 migration',bq.error);budgets=[];} else budgets=(bq.data||[]).map((r,i)=>({id:r.id,workspaceId:r.workspace_id,ar:r.name_ar,en:r.name_en||r.name_ar,category:r.category||'',periodStart:r.period_start,periodEnd:r.period_end,allocated:Number(r.allocated_amount||0),status:r.status,ownerUserId:r.owner_user_id,notes:r.notes||'',createdBy:r.created_by,createdAt:r.created_at,color:['var(--blue)','var(--teal)','var(--green)','var(--violet)'][i%4],spent:0}));
  if(eq.error){console.warn('V30 budget entries unavailable',eq.error);budgetEntries=[];} else budgetEntries=(eq.data||[]).map(r=>({id:r.id,workspaceId:r.workspace_id,budgetId:r.budget_id,kind:r.kind,amount:Number(r.amount||0),status:r.status,occurredOn:r.occurred_on,description:r.description,vendorName:r.vendor_name,referenceNo:r.reference_no,eventId:r.event_id,taskId:r.task_id,requestedBy:r.requested_by,approvedBy:r.approved_by,approvedAt:r.approved_at,rejectionReason:r.rejection_reason,createdAt:r.created_at,updatedAt:r.updated_at}));
  budgets.forEach(b=>b.spent=Math.max(0,budgetApprovedNet(b.id)));
}

function rfqInviteState(rfq,rv,q){

}

function buildVendorQuotePortalUrl(token){const u=new URL(window.location.href);u.search='';u.hash='';u.searchParams.set('quote',token);return u.toString();}
async function getRfqVendorInvite(rfqId,vendorId){const {data,error}=await sb.rpc('tasky_get_or_create_rfq_invitation',{p_rfq_id:rfqId,p_vendor_id:vendorId});if(error)throw error;return data;}
async function taskyEdgeFunctionErrorDetails(err){
  let message=String(err?.message||err||'Unknown error');
  let stage='';
  try{
    const response=err?.context;
    if(response&&typeof response.clone==='function'){
      const cloned=response.clone();
      const type=cloned.headers?.get?.('content-type')||'';
      if(type.includes('application/json')){
        const body=await cloned.json();
        if(body?.error)message=String(body.error);
        if(body?.stage)stage=String(body.stage);
        if(body?.providerStatus)message+=` (HTTP ${body.providerStatus})`;
        if(body?.code)message+=` [${body.code}]`;
      }else{
        const text=await cloned.text();
        if(text?.trim())message=text.trim();
      }
    }
  }catch(_){/* keep original SDK error */}
  return {message,stage};
}
async function sendRfqInviteEmail(rfqId,vendorId,opts={}){
  const v=vendorById(vendorId);if(!v?.contactEmail){if(!opts.silent)taskyToast(lang==='ar'?'لا يوجد بريد إلكتروني مسجل للمورد':'Vendor email is missing',{tone:'warning'});return false;}
  try{
    const {data,error}=await sb.functions.invoke('send-rfq-invite',{body:{rfqId,vendorId}});
    if(error)throw error;if(data?.error)throw Object.assign(new Error(data.error),{taskyStage:data.stage||''});
    if(!opts.silent){taskyToast(lang==='ar'?`تم إرسال الدعوة إلى ${v.contactEmail}`:`Invitation sent to ${v.contactEmail}`,{tone:'success'});await fetchProcurementData();if(currentProcurementId===rfqId)openRfqDetail(rfqId);}return true;
  }catch(err){
    const detail=await taskyEdgeFunctionErrorDetails(err);
    if(!opts.silent){
      const stageHint=detail.stage?`\n\n${lang==='ar'?'مرحلة الخطأ':'Error stage'}: ${detail.stage}`:'';
      showTaskyDialog({title:lang==='ar'?'تعذّر إرسال البريد':'Could not send email',message:detail.message+stageHint,tone:'error'});
    }
    console.error('Tasky RFQ email error',detail,err);
    return false;
  }
}
async function sendAllRfqInvites(rfqId){
  const rfq=rfqById(rfqId);if(!rfq||!canManageRfqClient(rfq))return;const rows=rfqVendorRows(rfqId).filter(rv=>!['responded','declined'].includes(rv.status));const emailRows=rows.filter(rv=>vendorById(rv.vendorId)?.contactEmail);
  if(!emailRows.length){taskyToast(lang==='ar'?'لا توجد عناوين بريد صالحة للموردين':'No invited vendors have email addresses',{tone:'warning'});return;}
  if(!(await taskyConfirm(lang==='ar'?`إرسال طلب عرض السعر إلى ${emailRows.length} مورد عبر البريد؟`:`Send this RFQ to ${emailRows.length} vendor(s) by email?`,{title:lang==='ar'?'إرسال للموردين':'Send to vendors',confirmText:lang==='ar'?'إرسال':'Send'})))return;
  let ok=0,fail=0;for(const rv of emailRows){if(await sendRfqInviteEmail(rfqId,rv.vendorId,{silent:true}))ok++;else fail++;await new Promise(r=>setTimeout(r,650));}
  await fetchProcurementData();openRfqDetail(rfqId);taskyToast(lang==='ar'?`تم إرسال ${ok} دعوة${fail?`، وتعذّر ${fail}`:''}`:`${ok} invitation(s) sent${fail?`; ${fail} failed`:''}`,{tone:fail?'warning':'success'});
}
async function copyRfqVendorInviteLink(rfqId,vendorId){
  try{const invite=await getRfqVendorInvite(rfqId,vendorId);const url=buildVendorQuotePortalUrl(invite.token);await navigator.clipboard.writeText(url);taskyToast(lang==='ar'?'تم نسخ رابط تقديم العرض':'Supplier quote link copied',{tone:'success'});}catch(err){showTaskyDialog({title:lang==='ar'?'تعذّر إنشاء الرابط':'Could not create link',message:String(err?.message||err),tone:'error'});}
}
function normalizeRfqWhatsAppPhone(value){let d=String(value||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===10&&d.startsWith('05'))d='966'+d.slice(1);return d;}
async function shareRfqVendorWhatsApp(rfqId,vendorId){
  const v=vendorById(vendorId);const raw=normalizeRfqWhatsAppPhone(v?.contactPhone);if(!raw){taskyToast(lang==='ar'?'لا يوجد رقم جوال للمورد':'Vendor phone number is missing',{tone:'warning'});return;}
  const popup=window.open('about:blank','_blank');try{const invite=await getRfqVendorInvite(rfqId,vendorId);const url=buildVendorQuotePortalUrl(invite.token);const msg=lang==='ar'?`طلب عرض سعر ${invite.rfq_number} من ${invite.workspace_name}\n${invite.title}${invite.response_deadline?`\nآخر موعد: ${invite.response_deadline}`:''}\n\nتقديم العرض: ${url}`:`Request for Quotation ${invite.rfq_number} from ${invite.workspace_name}\n${invite.title}${invite.response_deadline?`\nDeadline: ${invite.response_deadline}`:''}\n\nSubmit quote: ${url}`;const wa=`https://wa.me/${raw}?text=${encodeURIComponent(msg)}`;await sb.rpc('tasky_mark_rfq_invite_shared',{p_rfq_id:rfqId,p_vendor_id:vendorId,p_channel:'whatsapp',p_message_id:null});if(popup)popup.location.href=wa;else window.location.href=wa;await fetchProcurementData();if(currentProcurementId===rfqId)openRfqDetail(rfqId);}catch(err){if(popup)popup.close();showTaskyDialog({title:lang==='ar'?'تعذّر فتح واتساب':'Could not open WhatsApp',message:String(err?.message||err),tone:'error'});}
}
async function openVendorQuoteAttachment(quoteId){const q=vendorQuotes.find(x=>x.id===quoteId);if(!q?.attachmentPath)return;const {data,error}=await sb.storage.from('rfq-quotes').createSignedUrl(q.attachmentPath,90);if(error||!data?.signedUrl){showTaskyDialog({title:lang==='ar'?'تعذّر فتح المرفق':'Could not open attachment',message:error?.message||'',tone:'error'});return;}window.open(data.signedUrl,'_blank','noopener');}

lass="proc-empty">${lang==='ar'?'لا يوجد موردون بعد. أضف المورد الأول للبدء.':'No vendors yet. Add your first vendor to get started.'}</div>`}`;

)}"></div><div class="field"><label>${lang==='ar'?'السجل التجاري':'CR number'}</label><input id="v31Cr" value="${escapeHtml(v?.crNumber||'')}"></div><div class="field"><label>${lang==='ar'?'الرقم الضريبي':'VAT number'}</label><input id="v31Vat" value="${escapeHtml(v?.vatNumber||'')}"></div><div class="field"><label>${lang==='ar'?'شروط الدفع':'Payment terms'}</label><input id="v31Terms" value="${escapeHtml(v?.paymentTerms||'')}"></div><div class="field full"><label>${lang==='ar'?'ملاحظات':'Notes'}</label><textarea id="v31Notes" style="width:100%;min-height:80px;border:1px solid var(--border);border-radius:10px;background:var(--paper);padding:10px;font:inherit">${escapeHtml(v?.notes||'')}</textarea></div></div><button class="submit-btn" type="submit">${lang==='ar'?'حفظ المورد':'Save vendor'}</button></form>`);

async function submitVendorV31(e,id){
  e.preventDefault(); const args={p_workspace_id:currentWorkspaceId,p_vendor_id:id||null,p_name_ar:document.getElementById('v31NameAr').value.trim(),p_name_en:document.getElementById('v31NameEn').value.trim(),p_category:document.getElementById('v31Category').value.trim(),p_status:document.getElementById('v31Status').value,p_city:document.getElementById('v31City').value.trim(),p_address:document.getElementById('v31Address').value.trim(),p_contact_name:document.getElementById('v31ContactName').value.trim(),p_contact_email:document.getElementById('v31ContactEmail').value.trim(),p_contact_phone:document.getElementById('v31ContactPhone').value.trim(),p_cr_number:document.getElementById('v31Cr').value.trim(),p_vat_number:document.getElementById('v31Vat').value.trim(),p_payment_terms:document.getElementById('v31Terms').value.trim(),p_rating:document.getElementById('v31Rating').value?Number(document.getElementById('v31Rating').value):null,p_notes:document.getElementById('v31Notes').value.trim()};
  const {error}=await sb.rpc('tasky_save_vendor',args); if(error){showTaskyDialog({title:lang==='ar'?'تعذّر حفظ المورد':'Could not save vendor',message:error.message,tone:'error'});return;} await fetchProcurementData(); closeProcurementModal(); renderModule(); taskyToast(lang==='ar'?'تم حفظ المورد':'Vendor saved',{tone:'success'});
}

function renderPOLines(){
  const box=document.getElementById('poLines'); if(!box)return; const invOpts=inventory.map(i=>`<option value="${i.id}">${escapeHtml(L(i,''))}${i.sku?' · '+escapeHtml(i.sku):''}</option>`).join('');
  box.innerHTML=procurementDraftLines.map((line,idx)=>`<div class="po-line" data-po-line="${idx}"><div class="field desc"><label>${lang==='ar'?'الوصف':'Description'}</label><input value="${escapeHtml(line.description)}" oninput="updatePOLine(${idx},'description',this.value)" required></div><div class="field inventory"><label>${lang==='ar'?'ربط بالمخزون':'Inventory link'}</label><select onchange="updatePOLine(${idx},'inventoryItemId',this.value)"><option value="">—</option>${invOpts.replace(`value="${line.inventoryItemId}"`,`value="${line.inventoryItemId}" selected`)}</select></div><div class="field"><label>${lang==='ar'?'الكمية':'Qty'}</label><input type="number" min="0.01" step="0.01" value="${line.quantity}" oninput="updatePOLine(${idx},'quantity',this.value)"></div><div class="field"><label>${lang==='ar'?'سعر الوحدة':'Unit price'}</label><input type="number" min="0" step="0.01" value="${line.unitPrice}" oninput="updatePOLine(${idx},'unitPrice',this.value)"></div><div class="po-line-total" id="poLineTotal${idx}">${fmtMoney(Number(line.quantity||0)*Number(line.unitPrice||0))}</div><button type="button" class="po-line-remove" onclick="removePOLine(${idx})" title="${lang==='ar'?'حذف':'Remove'}"><svg style="width:15px;height:15px"><use href="#i-x"/></svg></button></div>`).join(''); updatePOGrandTotal();
}
function updatePOLine(idx,key,value){if(!procurementDraftLines[idx])return; procurementDraftLines[idx][key]=(key==='quantity'||key==='unitPrice')?Number(value||0):value; const totalEl=document.getElementById('poLineTotal'+idx); if(totalEl) totalEl.textContent=fmtMoney(Number(procurementDraftLines[idx].quantity||0)*Number(procurementDraftLines[idx].unitPrice||0)); updatePOGrandTotal();}

function purchaseOrderFinancials(po,lines){
  const lineSubtotal=(lines||[]).reduce((sum,x)=>sum+Number(x.quantity||0)*Number(x.unitPrice||0),0);
  const sourceRfq=po?.rfqId?rfqById(po.rfqId):null;
  const sourceQuote=sourceRfq?.awardedQuoteId?vendorQuotes.find(q=>q.id===sourceRfq.awardedQuoteId):null;
  if(sourceQuote){
    const subtotal=Number(sourceQuote.subtotalAmount||lineSubtotal||0);
    const discount=Math.max(0,Number(sourceQuote.discountAmount||0));
    const shipping=Math.max(0,Number(sourceQuote.shippingAmount||0));
    const taxPercent=Math.max(0,Number(sourceQuote.taxPercent||0));
    const tax=Math.max(0,Number(sourceQuote.taxAmount||0));
    return {subtotal,discount,shipping,taxPercent,tax,total:Number(po.totalAmount||sourceQuote.totalAmount||0),sourceQuote};
  }
  return {subtotal:lineSubtotal,discount:0,shipping:0,taxPercent:0,tax:0,total:Number(po?.totalAmount||lineSubtotal||0),sourceQuote:null};
}
function allocatedNetUnitPrice(unitPrice,total,subtotal){
  const u=Number(unitPrice||0),t=Number(total||0),s=Number(subtotal||0);
  if(s<=0)return u;
  return u*(t/s);
}

ss="field"><label>${lang==='ar'?'ملاحظات العرض':'Quote notes'}</label><textarea id="quoteNotes" style="width:100%;min-height:78px;border:1px solid var(--border);border-radius:10px;background:var(--paper);padding:10px;font:inherit">${escapeHtml(existing?.notes||'')}</textarea></div><button class="submit-btn" type="submit">${existing?(lang==='ar'?'تحديث العرض':'Update quote'):(lang==='ar'?'حفظ العرض':'Save quote')}</button></form>`);updateQuoteDraftTotal();

/* ================= V33.5 SUPPLIER INVOICES + NET PRICE MATCH CLARITY ================= */
function supplierInvoiceById(id){return supplierInvoices.find(x=>x.id===id)||null;}
function supplierInvoiceLines(id){return supplierInvoiceItems.filter(x=>x.supplierInvoiceId===id);}
function purchaseOrderInvoices(id){return supplierInvoices.filter(x=>x.purchaseOrderId===id).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));}
function supplierInvoiceStatusLabel(status){
  const ar={pending:'بانتظار الاعتماد',approved:'معتمدة',rejected:'مرفوضة',paid:'مدفوعة'};
  const en={pending:'Pending approval',approved:'Approved',rejected:'Rejected',paid:'Paid'};
  return (lang==='ar'?ar:en)[status]||status;
}
function supplierInvoiceMatchLabel(status){
  return status==='matched'?(lang==='ar'?'مطابقة':'Matched'):(lang==='ar'?'تحتاج مراجعة':'Exception');
}
function canManageSupplierInvoiceClient(inv){const po=inv?purchaseOrderById(inv.purchaseOrderId):null;return !!po&&canManagePurchaseOrderClient(po);}
function supplierInvoiceAlreadyQty(poItemId){
  return supplierInvoiceItems.filter(line=>line.purchaseOrderItemId===poItemId).reduce((sum,line)=>{
    const inv=supplierInvoiceById(line.supplierInvoiceId);return sum+(inv&&inv.status!=='rejected'?line.quantity:0);
  },0);
}
function supplierInvoiceOutstandingAmount(poId){
  const po=purchaseOrderById(poId);if(!po)return 0;
  const used=purchaseOrderInvoices(poId).filter(i=>i.status!=='rejected').reduce((s,i)=>s+i.totalAmount,0);
  return Math.max(0,po.totalAmount-used);
}
function supplierInvoicePoDraftTerms(po,lines){
  const fin=purchaseOrderFinancials(po,lines||purchaseOrderLines(po?.id));
  const prior=purchaseOrderInvoices(po?.id).filter(i=>i.status!=='rejected');
  const priorDiscount=prior.reduce((s,i)=>s+Number(i.discountAmount||0),0);
  const priorShipping=prior.reduce((s,i)=>s+Number(i.shippingAmount||0),0);
  const remainingDiscount=Math.max(0,Number(fin.discount||0)-priorDiscount);
  const remainingShipping=Math.max(0,Number(fin.shipping||0)-priorShipping);
  const remainingBase=(lines||[]).reduce((sum,x)=>{
    const already=supplierInvoiceAlreadyQty(x.id),remaining=Math.max(0,Number(x.quantity||0)-already);
    return sum+remaining*Number(x.unitPrice||0);
  },0);
  const selectedBase=(lines||[]).reduce((sum,x)=>{
    const already=supplierInvoiceAlreadyQty(x.id),remaining=Math.max(0,Number(x.quantity||0)-already),receivedAvailable=Math.max(0,Number(x.receivedQuantity||0)-already),qty=receivedAvailable>0?Math.min(receivedAvailable,remaining):remaining;
    return sum+qty*Number(x.unitPrice||0);
  },0);
  const ratio=remainingBase>0?Math.min(1,Math.max(0,selectedBase/remainingBase)):1;
  return {discount:Math.round(remainingDiscount*ratio*100)/100,shipping:Math.round(remainingShipping*ratio*100)/100,taxPercent:Number(fin.taxPercent||0),fin};
}
function supplierInvoiceLocalizedMatchNote(note){
  if(!note)return '';
  if(lang!=='ar')return note;
  return String(note)
    .replaceAll('Invoice unit price differs from purchase order.','سعر وحدة الفاتورة يختلف عن سعر أمر الشراء.')
    .replaceAll('Invoice quantity is not fully covered by recorded receipts.','كمية الفاتورة غير مغطاة بالكامل بالكميات المستلمة.')
    .replaceAll('Cumulative invoice value exceeds purchase order value.','القيمة التراكمية للفواتير تتجاوز القيمة النهائية لأمر الشراء.')
    .trim();
}

function supplierInvoicePaymentsFor(id){return supplierInvoicePayments.filter(p=>p.supplierInvoiceId===id).sort((a,b)=>String(b.paidAt).localeCompare(String(a.paidAt)));}
function supplierInvoicePaidAmount(invOrId){const id=typeof invOrId==='string'?invOrId:invOrId?.id;return Math.round(supplierInvoicePaymentsFor(id).reduce((sum,p)=>sum+Number(p.amount||0),0)*100)/100;}
function supplierInvoiceBalance(invOrId){const inv=typeof invOrId==='string'?supplierInvoiceById(invOrId):invOrId;if(!inv)return 0;return Math.max(0,Math.round((Number(inv.totalAmount||0)-supplierInvoicePaidAmount(inv.id))*100)/100);}
function supplierInvoiceEffectiveStatus(inv){if(!inv)return '';const bal=supplierInvoiceBalance(inv);const paid=supplierInvoicePaidAmount(inv.id);if(inv.status==='paid'||bal<=0.005)return 'paid';if(inv.status==='approved'&&paid>0.005)return 'partially_paid';return inv.status;}
const supplierInvoiceStatusLabelV335=supplierInvoiceStatusLabel;

function supplierInvoiceAgingV34(inv){
  const bal=supplierInvoiceBalance(inv);if(bal<=0.005||!['approved','paid'].includes(inv.status))return null;
  const today=new Date();today.setHours(0,0,0,0);let days=0;
  if(inv.dueDate){const d=new Date(inv.dueDate+'T00:00:00');days=Math.floor((today-d)/86400000);}
  let bucket='current';if(days>90)bucket='90plus';else if(days>60)bucket='61_90';else if(days>30)bucket='31_60';else if(days>0)bucket='1_30';
  return {invoice:inv,balance:bal,daysOverdue:Math.max(0,days),bucket};
}
function accountsPayableAgingV34(){
  const rows=supplierInvoices.map(supplierInvoiceAgingV34).filter(Boolean);
  const sum=b=>rows.filter(x=>x.bucket===b).reduce((s,x)=>s+x.balance,0);
  return {rows,total:rows.reduce((s,x)=>s+x.balance,0),overdue:rows.filter(x=>x.daysOverdue>0).reduce((s,x)=>s+x.balance,0),current:sum('current'),d1_30:sum('1_30'),d31_60:sum('31_60'),d61_90:sum('61_90'),d90plus:sum('90plus')};
}

openSupplierInvoicePaymentModal=function(id){const inv=supplierInvoiceById(id);if(!inv)return;const paid=supplierInvoicePaidAmount(id),balance=supplierInvoiceBalance(inv);if(balance<=0.005){taskyToast(lang==='ar'?'الفاتورة مدفوعة بالكامل':'Invoice is fully paid',{tone:'success'});return;}openProcurementModal(`<div class="modal-head"><div><h3>${lang==='ar'?'تسجيل دفعة على الفاتورة':'Record invoice payment'}</h3><div style="font-size:11px;color:var(--muted);margin-top:3px">${escapeHtml(inv.vendorInvoiceNumber)} · ${lang==='ar'?'المتبقي':'Balance'} ${fmtMoney(balance)}</div></div><button class="modal-close" onclick="openSupplierInvoiceDetail('${id}')"><svg style="width:18px;height:18px"><use href="#i-x"/></svg></button></div><form onsubmit="submitSupplierInvoicePayment(event,'${id}')"><div class="proc-form-grid"><div class="field"><label>${lang==='ar'?'مبلغ الدفعة':'Payment amount'}</label><input id="siPaymentAmount" type="number" min="0.01" max="${balance}" step="0.01" value="${balance.toFixed(2)}" required><div style="font-size:9.5px;color:var(--muted);margin-top:3px">${lang==='ar'?'مدفوع سابقًا':'Previously paid'} ${fmtMoney(paid)}</div></div><div class="field"><label>${lang==='ar'?'تاريخ الدفع':'Payment date'}</label><input id="siPaidDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>${lang==='ar'?'مرجع الدفع / التحويل':'Payment reference'}</label><input id="siPaymentRef" placeholder="TRX-... / Bank transfer"></div><div class="field"><label>${lang==='ar'?'ملاحظة الدفعة (اختياري)':'Payment note (optional)'}</label><input id="siPaymentNote"></div><div class="field full"><label>${lang==='ar'?'إيصال الدفع':'Payment receipt'}</label><div style="border:1px dashed var(--border);border-radius:11px;padding:12px;background:var(--paper)"><input id="siPaymentReceipt" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" required><div style="font-size:10px;color:var(--muted);margin-top:7px;line-height:1.6">$ submitSupplierInvoicePayment=async function(e,id){
  e.preventDefault();const inv=supplierInvoiceById(id);if(!inv)return;const balance=supplierInvoiceBalance(inv),amount=Number(document.getElementById('siPaymentAmount')?.value||0),btn=e.submitter,date=document.getElementById('siPaidDate').value,ref=document.getElementById('siPaymentRef').value.trim()||null,note=document.getElementById('siPaymentNote')?.value.trim()||null,file=document.getElementById('siPaymentReceipt')?.files?.[0]||null;

async function viewSupplierInvoicePaymentV34(paymentId){const p=supplierInvoicePayments.find(x=>x.id===paymentId);if(!p?.receiptPath)return;const {data,error}=await sb.storage.from('supplier-payment-receipts').createSignedUrl(p.receiptPath,120);if(error||!data?.signedUrl){showTaskyDialog({title:lang==='ar'?'تعذّر فتح الإيصال':'Could not open receipt',message:error?.message||'',tone:'error'});return;}window.open(data.signedUrl,'_blank','noopener');}

function mapSupplierPaymentScheduleV35(r){return {id:r.id,workspaceId:r.workspace_id,supplierInvoiceId:r.supplier_invoice_id,amount:Number(r.amount||0),plannedDate:r.planned_date,status:r.status||'planned',notes:r.notes||'',createdBy:r.created_by,paidPaymentId:r.paid_payment_id||null,paidAt:r.paid_at||null,cancelledBy:r.cancelled_by||null,cancelledAt:r.cancelled_at||null,createdAt:r.created_at,updatedAt:r.updated_at};}
async function fetchSupplierPaymentSchedulesV35(){
  if(!currentWorkspaceId){supplierPaymentSchedules=[];return;}
  const {data,error}=await sb.from('supplier_payment_schedules').select('id,workspace_id,supplier_invoice_id,amount,planned_date,status,notes,created_by,paid_payment_id,paid_at,cancelled_by,cancelled_at,created_at,updated_at').eq('workspace_id',currentWorkspaceId).order('planned_date',{ascending:true});
  if(error){console.warn('V35 payment schedules unavailable; run V35 migration',error);supplierPaymentSchedules=[];return;}
  supplierPaymentSchedules=(data||[]).map(mapSupplierPaymentScheduleV35);
  if(sb?.channel && supplierPaymentScheduleRealtimeWorkspace!==currentWorkspaceId){
    if(supplierPaymentScheduleRealtimeChannel){try{sb.removeChannel(supplierPaymentScheduleRealtimeChannel);}catch{}}
    supplierPaymentScheduleRealtimeWorkspace=currentWorkspaceId;
    supplierPaymentScheduleRealtimeChannel=sb.channel(`tasky-v35-payments-${currentWorkspaceId}`).on('postgres_changes',{event:'*',schema:'public',table:'supplier_payment_schedules',filter:`workspace_id=eq.${currentWorkspaceId}`},scheduleProcurementRefresh).subscribe();
  }
}
const fetchProcurementDataV34=fetchProcurementData;
fetchProcurementData=async function(){await fetchProcurementDataV34();await fetchSupplierPaymentSchedulesV35();};

function supplierPaymentPlansForV35(invoiceId,status=null){return supplierPaymentSchedules.filter(x=>x.supplierInvoiceId===invoiceId&&(!status||x.status===status)).sort((a,b)=>String(a.plannedDate).localeCompare(String(b.plannedDate)));}
function supplierInvoiceScheduledAmountV35(invoiceId){return supplierPaymentPlansForV35(invoiceId,'planned').reduce((s,x)=>s+Number(x.amount||0),0);}
function supplierInvoiceUnscheduledBalanceV35(inv){return Math.max(0,supplierInvoiceBalance(inv)-supplierInvoiceScheduledAmountV35(inv.id));}
function paymentPlanStatusLabelV35(s){const ar={planned:'مجدولة',paid:'تم دفعها',cancelled:'ملغاة'},en={planned:'Planned',paid:'Paid',cancelled:'Cancelled'};return (lang==='ar'?ar:en)[s]||s;}
function daysFromTodayV35(date){if(!date)return 0;const a=new Date();a.setHours(0,0,0,0);const b=new Date(date+'T00:00:00');return Math.round((b-a)/86400000);}
function cashForecastV35(){
  const active=supplierPaymentSchedules.filter(x=>x.status==='planned').map(x=>({plan:x,inv:supplierInvoiceById(x.supplierInvoiceId)})).filter(x=>x.inv&&supplierInvoiceBalance(x.inv)>0.005);
  let overdue=0,next7=0,next30=0,later=0;
  active.forEach(x=>{const d=daysFromTodayV35(x.plan.plannedDate),a=Number(x.plan.amount||0);if(d<0)overdue+=a;else if(d<=7)next7+=a;else if(d<=30)next30+=a;else later+=a;});
  const unscheduled=supplierInvoices.filter(i=>!['pending','rejected'].includes(i.status)).reduce((sum,i)=>sum+supplierInvoiceUnscheduledBalanceV35(i),0);
  return {active,overdue,next7,next30,later,unscheduled,totalPlanned:active.reduce((s,x)=>s+x.plan.amount,0)};
}

  return `<div class="section-card" style="margin-top:12px"><div class="proc-section-title" style="margin-top:0"><div><h3>${lang==='ar'?'خطة المدفوعات والتدفق النقدي':'Payment plan & cash forecast'}</h3><div style="font-size:10.5px;color:var(--muted);margin-top:3px">${lang==='ar'?'جدولة دفعات الموردين قبل تنفيذها ومعرفة الالتزامات القادمة':'Schedule supplier payments before execution and see upcoming cash commitments'}</div></div><b>${fmtMoney(f.totalPlanned)}</b></div><div class="payment-forecast-grid"><div class="payment-forecast-card"><span>${lang==='ar'?'مدفوعات مجدولة متأخرة':'Overdue planned'}</span><b style="color:${f.overdue?'var(--danger)':'inherit'}">${fmtMoney(f.overdue)}</b></div><div class="payment-forecast-card"><span>${lang==='ar'?'خلال 7 أيام':'Next 7 days'}</span><b>${fmtMoney(f.next7)}</b></div><div class="payment-forecast-card"><span>${lang==='ar'?'من 8 إلى 30 يوم':'8–30 days'}</span><b>${fmtMoney(f.next30)}</b></div><div class="payment-forecast-card"><span>${lang==='ar'?'رصيد غير مجدول':'Unscheduled balance'}</span><b>${fmtMoney(f.unscheduled)}</b></div></div>${rows?`<div style="overflow:auto"><table><thead><tr><th>${lang==='ar'?'الفاتورة':'Invoice'}</th><th>${lang==='ar'?'تاريخ الدفع المخطط':'Planned date'}</th><th>${lang==='ar'?'المتبقي':'Timing'}</th><th>${lang==='ar'?'المبلغ':'Amount'}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="proc-empty">${lang==='ar'?'لا توجد دفعات مجدولة حاليًا':'No payments scheduled currently'}</div>`}</div>`;
}

async function submitSupplierPaymentScheduleV35(e,invoiceId){

function exportDataset(key){
  const dataset = REPORT_DATASETS.find(d=>d.key===key);
  const rows = dataset.get();
  if(!rows.length){ alert('—'); return; }
  const headers = Object.keys(rows[0]);
  const csvLines = [headers.join(',')].concat(rows.map(r => headers.map(h => {
    let v = r[h]; if(v===null||v===undefined) v='';
    v = String(v).replace(/"/g,'""');
    return /[",\n]/.test(v) ? `"${v}"` : v;
  }).join(',')));
  const csv = "\uFEFF" + csvLines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `tasky-${key}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= ANALYTICS & KPIs MODULE ================= */
function buildSparkline(values, w, h, color){
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max - min) || 1;
  const step = w / (values.length - 1);
  const pts = values.map((v,i) => `${(i*step).toFixed(1)},${(h - ((v-min)/range)*h*0.85 - h*0.05).toFixed(1)}`);
  const linePath = 'M' + pts.join(' L');
  const areaPath = linePath + ` L${w},${h} L0,${h} Z`;
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
      <defs><linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${areaPath}" fill="url(#sparkFill)" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${values.map((v,i)=>`<circle cx="${(i*step).toFixed(1)}" cy="${(h - ((v-min)/range)*h*0.85 - h*0.05).toFixed(1)}" r="3" fill="${color}"/>`).join('')}
    </svg>`;
}
function buildDonut(){
  let acc = 0;
  const stops = TRAFFIC_SOURCES.map(s => {
    const start = acc, end = acc + s.value;
    acc = end;
    return `${s.color} ${start}% ${end}%`;
  }).join(', ');
  return `background:conic-gradient(${stops});`;
}

async function submitInvite(e){
  e.preventDefault();
  if(currentUserRole !== 'admin') return;
  const name = document.getElementById('inviteName').value.trim();
  const email = document.getElementById('inviteEmail').value.trim().toLowerCase();
  const role = document.getElementById('inviteRole').value;
  if(!name || !email) return;

  const duplicate = teamMembers.some(m => (m.email || '').toLowerCase() === email);
  if(duplicate){
    alert(lang==='ar' ? 'هذا البريد موجود في الفريق أو لديه دعوة معلّقة بالفعل.' : 'This email is already on the team or has a pending invite.');
    return;
  }

  const btn = e.submitter || document.querySelector('#addModalBody .submit-btn');
  if(btn){ btn.disabled = true; btn.textContent = lang==='ar' ? 'جاري إرسال الدعوة...' : 'Sending invite...'; }

  const redirectTo = /^https?:$/.test(window.location.protocol)
    ? `${window.location.origin}${window.location.pathname}`
    : null;

  const { data, error } = await sb.functions.invoke('invite-member', {
    body: {
      workspaceId: currentWorkspaceId,
      name,
      email,
      role,
      redirectTo
    }
  });

  if(error || !data?.ok){
    console.error('تعذّر إرسال الدعوة', error, data);
    const code = data?.error;
    let message = lang==='ar' ? 'تعذّر إرسال الدعوة. راجع إعداد Edge Function وحاول مرة ثانية.' : 'Could not send the invitation. Check the Edge Function and try again.';
    if(code === 'SEAT_LIMIT_REACHED') message = t('seatsLimitReached');
    if(code === 'ALREADY_INVITED_OR_MEMBER') message = lang==='ar' ? 'هذا البريد عضو أو لديه دعوة معلّقة بالفعل.' : 'This email is already a member or has a pending invite.';
    if(code === 'AUTH_INVITE_FAILED' && data?.detail) message = `${message}
${data.detail}`;
    alert(message);
    if(btn){ btn.disabled = false; btn.textContent = t('submitInvite'); }
    return;
  }

  closeAddModal();
  await fetchTeamMembers();
  renderModule();
  alert(lang==='ar'
    ? `تم إرسال الدعوة إلى ${email} ✅`
    : `Invitation sent to ${email} ✅`);
}

async function optimizeAvatarFile(file){
  if(!file) throw new Error(lang==='ar'?'اختر صورة أولًا':'Choose an image first');
  if(file.size>5*1024*1024) throw new Error(lang==='ar'?'حجم الصورة يجب ألا يتجاوز 5MB':'Image must be 5MB or smaller');
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)) throw new Error(lang==='ar'?'صيغة الصورة غير مدعومة':'Unsupported image format');
  const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Read failed'));r.readAsDataURL(file);});
  const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error(lang==='ar'?'تعذّر قراءة الصورة':'Could not read image'));i.src=dataUrl;});
  const side=Math.min(img.naturalWidth,img.naturalHeight); const sx=(img.naturalWidth-side)/2, sy=(img.naturalHeight-side)/2;
  const canvas=document.createElement('canvas'); canvas.width=512; canvas.height=512; const ctx=canvas.getContext('2d',{alpha:true});
  ctx.clearRect(0,0,512,512);
  ctx.drawImage(img,sx,sy,side,side,0,0,512,512);
  let blob;
  if(file.type==='image/png'){
    // Preserve PNG transparency instead of flattening it against the avatar color.
    blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  }else{
    blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',0.86));
    if(!blob) blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.88));
  }
  if(!blob) throw new Error(lang==='ar'?'تعذّر تجهيز الصورة':'Could not process image');
  return blob;
}
function avatarStoragePathFromUrl(url){
  if(!url) return null; const marker='/storage/v1/object/public/user-avatars/'; const idx=url.indexOf(marker); if(idx<0)return null; return decodeURIComponent(url.slice(idx+marker.length).split('?')[0]);
}
async function uploadMyAvatar(input){
  const file=input?.files?.[0]; if(!file)return; const me=currentMember(); const oldUrl=me?.avatarUrl||null;

    const {error:uploadError}=await sb.storage.from('user-avatars').upload(path,blob,{contentType:blob.type,cacheControl:'3600',upsert:false});
    if(uploadError) throw uploadError;
    const {data:publicData}=sb.storage.from('user-avatars').getPublicUrl(path); const url=`${publicData.publicUrl}?v=${Date.now()}`;
    const {error:saveError}=await sb.rpc('set_my_avatar_url',{p_avatar_url:url}); if(saveError) throw saveError;
    const oldPath=avatarStoragePathFromUrl(oldUrl); if(oldPath) sb.storage.from('user-avatars').remove([oldPath]).catch(()=>{});
    await fetchTeamMembers(); applyCurrentUserProfile(); renderTeamAvatarStack(); renderAll(); renderModule(); taskyToast(lang==='ar'?'تم تحديث صورتك الشخصية':'Profile photo updated',{tone:'success'});
  }catch(err){showTaskyDialog({title:lang==='ar'?'تعذّر تحديث الصورة':'Could not update photo',message:err?.message||String(err),tone:'error'});}finally{input.disabled=false;input.value='';}
}

async function applyPlanChange(id){

  if(id===currentPlan){ taskyToast(lang==='ar'?'هذه باقتك الحالية':'This is your current plan',{tone:'info'}); return; }

    lang==='ar'
      ? `سيتم تسجيل طلب تغيير الباقة إلى «${t('plan_'+id+'_name')}». لن تتغير الباقة الفعلية قبل اعتماد الطلب وربط الدفع.`
      : `A request to switch to “${t('plan_'+id+'_name')}” will be recorded. Your active plan will not change until the request is approved and billing is connected.`,
    {title:lang==='ar'?'طلب تغيير الباقة':'Request plan change',tone:'warning',confirmText:lang==='ar'?'إرسال الطلب':'Send request'}
  );
  if(!ok) return;
  const {data,error}=await sb.rpc('request_plan_change',{p_workspace_id:currentWorkspaceId,p_to_plan:id,p_billing_cycle:billingCycle});
  if(error){

  pendingPlanRequest=data || {to_plan:id,billing_cycle:billingCycle,status:'pending'};
  taskyToast(lang==='ar'?'تم تسجيل طلب تغيير الباقة':'Plan change request recorded',{tone:'success'});
  renderModule();
}

function onDrop(e,colId){ e.preventDefault(); e.currentTarget.classList.remove('drag-over'); if(dragId!=null) moveTask(dragId, colId); dragId = null; }
async function moveTask(id,col){
  const old = tasks.find(x=>x.id===id);
  tasks = tasks.map(x => x.id===id ? {...x, col, completedAt: col==='done'?new Date().toISOString():null} : x);
  renderAll();
  const { error } = await sb.from('tasks').update({ col, completed_at: col==='done'?new Date().toISOString():null, updated_at:new Date().toISOString() }).eq('id', id);
  if(error){ console.error('moveTask save failed', error); await fetchTasks(); renderAll(); return; }
  if(old?.col !== col) await logTaskActivity(id,'status_changed',{from:old?.col,to:col});
  if(currentDetailTaskId===id) await refreshTaskDetail(id,false);
}

function formatEventDate(value){
  if(!value) return lang==='ar'?'بدون موعد':'No date';
  try{return new Intl.DateTimeFormat(lang==='ar'?'ar-SA':'en-US',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(value));}catch{return value;}
}
function toDatetimeLocal(value){
  if(!value) return '';
  const d=new Date(value); if(Number.isNaN(d.getTime())) return '';
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function notificationPreview(n){
  if(n?.type==='supplier_invoice_payment_recorded'){const a=Number(n?.metadata?.payment_amount||0),r=Number(n?.metadata?.remaining_amount||0);return lang==='ar'?`دفعة ${a.toLocaleString('en-US')} ر.س · المتبقي ${r.toLocaleString('en-US')} ر.س`:`Payment ${a.toLocaleString('en-US')} SAR · ${r.toLocaleString('en-US')} SAR remaining`;}
  if(n?.type?.startsWith('purchase_order_')||n?.type?.startsWith('supplier_invoice_')||n?.type==='rfq_awarded'||n?.type==='rfq_quote_submitted'||n?.type==='rfq_quote_declined'){ return String(n?.metadata?.rejection_reason||n?.metadata?.reason||'').trim() || ((Number(n?.metadata?.amount||0)||0)?((Number(n?.metadata?.amount||0)).toLocaleString('en-US')+' SAR'):''); }
  if(n?.type?.startsWith('marketing_')) return String(n?.metadata?.reason||n?.metadata?.note||'').trim();
  if(n?.type?.startsWith('budget_entry_')){
    const desc=String(n?.metadata?.description||'').trim();
    const reason=String(n?.metadata?.rejection_reason||'').trim();
    return reason || desc;
  }
  return String(n?.metadata?.comment_preview||'').trim();
}
function renderNotificationDropdown(){
  const dd=document.getElementById('notifDropdown'); if(!dd)return;
  const unread=userNotifications.filter(n=>!n.is_read).length;
  const head=`<div class="notif-dropdown-head"><b>${lang==='ar'?'الإشعارات':'Notifications'}${unread?` · ${unread}`:''}</b>${unread?`<button class="notif-mark-all" onclick="event.stopPropagation();markAllNotificationsRead()">${lang==='ar'?'تحديد الكل كمقروء':'Mark all read'}</button>`:''}</div>`;
  const rows=userNotifications.map(n=>{ const actor=taskMemberById(n.actor_id); const preview=notificationPreview(n); return `<div class="notif-item ${n.is_read?'':'unread'}" onclick="openNotification('${n.id}')"><div class="notif-row">${memberAvatarHtml(actor,30)}<div class="notif-copy"><div class="txt">${escapeHtml(notificationText(n))}</div>${preview?`<div style="font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(preview)}</div>`:''}<div class="time">${escapeHtml(formatDateTime(n.created_at))}</div></div></div></div>`; }).join('');
  dd.innerHTML=head+(rows||`<div class="notif-empty">${lang==='ar'?'لا توجد إشعارات جديدة':'No notifications yet'}</div>`);

async function toggleNotif(){
  const dd=document.getElementById('notifDropdown'); if(!dd)return;
  const opening=dd.classList.contains('hidden');
  if(opening){ await fetchNotifications(); renderNotificationDropdown(); }
  dd.classList.toggle('hidden');

async function openNotification(id){
  const n=userNotifications.find(x=>x.id===id); if(!n)return;
  if(!n.is_read){ await sb.from('notifications').update({is_read:true,read_at:new Date().toISOString()}).eq('id',id).eq('user_id',currentUserId); n.is_read=true; updateNotificationBadge(); }
  document.getElementById('notifDropdown')?.classList.add('hidden');
  if(n?.type==='rfq_awarded'){
    setActiveNav('vendors');
    const poId=n?.metadata?.purchase_order_id; const rfqId=n?.metadata?.rfq_id;
    await fetchProcurementData();
    if(poId&&purchaseOrderById(poId)) setTimeout(()=>openPurchaseOrderDetail(poId),0);
    else if(rfqId&&rfqById(rfqId)) setTimeout(()=>openRfqDetail(rfqId),0);
    return;
  }
  if(n?.type==='rfq_quote_submitted'||n?.type==='rfq_quote_declined'){
    setActiveNav('vendors');
    const rfqId=n?.metadata?.rfq_id;await fetchProcurementData();
    if(rfqId&&rfqById(rfqId)) setTimeout(()=>openRfqDetail(rfqId),0);
    return;
  }
  if(n?.type?.startsWith('supplier_invoice_')){
    setActiveNav('vendors');
    const invoiceId=n?.metadata?.supplier_invoice_id;await fetchProcurementData();
    if(invoiceId&&supplierInvoiceById(invoiceId)) setTimeout(()=>openSupplierInvoiceDetail(invoiceId),0);
    return;
  }
  if(n?.type?.startsWith('purchase_order_')){
    setActiveNav('vendors');
    const poId=n?.metadata?.purchase_order_id;
    if(poId){ if(!purchaseOrderById(poId)) await fetchProcurementData(); if(purchaseOrderById(poId)) setTimeout(()=>openPurchaseOrderDetail(poId),0); }
    return;
  }
  if(n?.type?.startsWith('marketing_request_')){
    setActiveNav('requests'); const rid=n?.metadata?.marketing_request_id; await fetchMarketingData();
    if(rid&&marketingRequestById(rid)) setTimeout(()=>openMarketingRequestDetail(rid),0); return;
  }
  if(n?.type?.startsWith('marketing_content_')){
    setActiveNav('content'); const cid=n?.metadata?.marketing_content_id; await fetchMarketingData();
    if(cid&&marketingContentById(cid)) setTimeout(()=>openMarketingContentDetail(cid),0); return;
  }
  if(n?.type?.startsWith('budget_entry_')){
    setActiveNav('budgets');
    const budgetId=n?.metadata?.budget_id;
    if(budgetId){
      if(!budgetById(budgetId)) await fetchBudgets();
      if(budgetById(budgetId)) setTimeout(()=>openBudgetDetail(budgetId),0);
    }
    return;
  }
  if(n.task_id){ await openDetailModal(n.task_id); }
}
async function markAllNotificationsRead(){
  const unreadIds=userNotifications.filter(n=>!n.is_read).map(n=>n.id); if(!unreadIds.length)return;
  const {error}=await sb.from('notifications').update({is_read:true,read_at:new Date().toISOString()}).eq('workspace_id',currentWorkspaceId).eq('user_id',currentUserId).in('id',unreadIds);
  if(!error){ userNotifications.forEach(n=>n.is_read=true); updateNotificationBadge(); renderNotificationDropdown(); }
}

function openProjectModal(){
  const title = lang==='ar' ? 'مشروع جديد' : 'New Project';
  const nameLabel = lang==='ar' ? 'اسم المشروع' : 'Project name';
  const descLabel = lang==='ar' ? 'الوصف (اختياري)' : 'Description (optional)';
  const namePh = lang==='ar' ? 'مثال: حملة اليوم الوطني' : 'e.g. National Day Campaign';
  const submitLabel = lang==='ar' ? 'إنشاء المشروع' : 'Create project';
  document.getElementById('addModalBody').innerHTML = `
    <div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeAddModal()"><svg style="width:18px;height:18px"><use href="#i-x"/></svg></button></div>
    <form onsubmit="submitAddProject(event)">
      <div class="field"><label>${nameLabel}</label><input id="newProjectName" required placeholder="${namePh}"></div>
      <div class="field"><label>${descLabel}</label><input id="newProjectDescription"></div>
      <button type="submit" class="submit-btn"><svg style="width:15px;height:15px"><use href="#i-plus"/></svg> ${submitLabel}</button>
    </form>`;
  document.getElementById('addModalOverlay').classList.remove('hidden');
}

async function submitAddProject(e){
  e.preventDefault();
  const name = document.getElementById('newProjectName').value.trim();
  const description = document.getElementById('newProjectDescription').value.trim() || null;
  if(!name || !currentWorkspaceId) return;
  const nextPosition = projects.length ? Math.max(...projects.map(p => Number(p.position) || 0)) + 1 : 0;
  const { data, error } = await sb.rpc('tasky_create_project', {
    p_workspace_id: currentWorkspaceId,
    p_name: name,
    p_description: description,
    p_position: nextPosition
  });
  if(error){
    console.error('تعذّر إنشاء المشروع', error);
    const detail = error.message || String(error);
    alert((lang==='ar'?'تعذّر إنشاء المشروع: ':'Could not create project: ') + detail);
    return;
  }
  closeAddModal();
  await fetchProjects();
  await fetchProjectMemberships();
  activeProjectId = data.id;
  setActiveProject(data.id);
  if(canManageProjectClient(data.id)) taskyToast(lang==='ar'?'تم إنشاء المشروع وأصبحت مديره':'Project created; you are its manager',{tone:'success'});
}
