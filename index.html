async function submitAddTask(e){
  e.preventDefault();
  const title = document.getElementById('newTitle').value.trim();
  if(!title) return;
  const projectId = document.getElementById('newProject').value;
  if(!canCreateTaskInProject(projectId)){ alert(lang==='ar'?'لا تملك صلاحية إنشاء مهام في هذا المشروع':'You do not have permission to create tasks in this project'); return; }
  const tag = document.getElementById('newTag').value;
  const priority = document.getElementById('newPriority').value;
  const cost = Number(document.getElementById('newCost')?.value||0);
  const startDate = document.getElementById('newStart').value || null;
  const due = document.getElementById('newDue').value || null;
  const assigneeIds = [...document.querySelectorAll('[data-assignee-box="newAssignee"]:checked')].map(el=>el.value);
  const lead = assigneeIds[0] ? taskMemberById(assigneeIds[0]) : null;
  const payload = {
    workspace_id: currentWorkspaceId, project_id: projectId, col:'todo', tag,
    title_ar:title, title_en:title, description:null, priority, cost, start_date:startDate,
    due_date:due, due_ar:due, due_en:due, overdue:false,
    assignee_id: lead?.userId || null,
    assignee_initials: lead?.initials || null,
    assignee_color: lead?.color || null,
    comments_count:0, subtasks_done:0, subtasks_total:0
  };
  const submit = e.submitter; if(submit){ submit.disabled=true; submit.textContent=lang==='ar'?'جارٍ الإنشاء...':'Creating...'; }
  const { data, error } = await sb.from('tasks').insert(payload).select().single();
  if(error){ console.error(error); alert(lang==='ar'?'تعذّر إنشاء المهمة. تأكد من تشغيل Migration V22.':'Could not create task. Make sure the V22 migration is installed.'); if(submit) submit.disabled=false; return; }
  if(assigneeIds.length){
    const rows = assigneeIds.map((userId,i)=>({task_id:data.id,workspace_id:currentWorkspaceId,user_id:userId,is_lead:i===0,assigned_by:currentUserId}));
    const assigneeSave = await sb.from('task_assignees').insert(rows);
    if(assigneeSave.error) console.error('Could not save task assignees',assigneeSave.error);
  }
  await logTaskActivity(data.id,'task_created',{title});
  closeAddModal();
  await fetchTasks();
  renderAll();
  taskyToast(lang==='ar'?'تم إنشاء المهمة':'Task created',{tone:'success'});
}

function regexEscape(value){ return String(value||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function commentBodyHtml(comment){
  let html=escapeHtml(comment?.body||'');
  const mentions=detailCommentMentions.filter(x=>x.comment_id===comment.id);
  mentions.forEach(row=>{
    const member=taskMemberById(row.user_id);
    const name=member?.fullName;
    if(!name) return;
    const token='@'+escapeHtml(name);
    html=html.replace(new RegExp(regexEscape(token),'g'),`<span class="comment-mention">${token}</span>`);
  });
  return html;
}
function hideCommentMentionMenu(){
  const menu=document.getElementById('commentMentionMenu');
  if(menu) menu.classList.add('hidden');
  activeMentionCandidates=[]; activeMentionRange=null; activeMentionIndex=0;
}
function mentionSearchFromTextarea(textarea){
  const cursor=textarea.selectionStart ?? textarea.value.length;
  const before=textarea.value.slice(0,cursor);
  const at=before.lastIndexOf('@');
  if(at<0) return null;
  const prev=at>0?before.charAt(at-1):'';
  if(prev && !/\s|[([{،,:;.!?؟]/.test(prev)) return null;
  const fragment=before.slice(at+1);
  if(/[\n\r]/.test(fragment) || fragment.length>45) return null;
  return {start:at,end:cursor,needle:fragment.trim().toLocaleLowerCase(lang==='ar'?'ar':'en')};
}
function renderCommentMentionMenu(){
  const menu=document.getElementById('commentMentionMenu');
  if(!menu) return;
  if(!activeMentionCandidates.length){ menu.innerHTML=`<div class="notif-empty">${lang==='ar'?'لا يوجد عضو مطابق':'No matching teammate'}</div>`; menu.classList.remove('hidden'); return; }
  menu.innerHTML=`<div class="mention-menu-label">${lang==='ar'?'أشر إلى أحد أعضاء الفريق':'Mention a teammate'}</div>`+activeMentionCandidates.map((m,i)=>`<button type="button" class="mention-item ${i===activeMentionIndex?'active':''}" onmousedown="event.preventDefault();chooseCommentMention('${m.userId}')">${memberAvatarHtml(m,30)}<span class="mention-item-main"><span class="mention-item-name">${escapeHtml(m.fullName)}</span><span class="mention-item-meta">${escapeHtml(m.jobTitle||m.email||'')}</span></span></button>`).join('');
  menu.classList.remove('hidden');
}
function handleCommentMentionInput(textarea){
  const state=mentionSearchFromTextarea(textarea);
  if(!state){ hideCommentMentionMenu(); return; }
  activeMentionRange=state;
  const mentionTask=tasks.find(t=>t.id===currentDetailTaskId);
  const members=projectAssignableMembers(mentionTask?.projectId).filter(m=>m.userId!==currentUserId);
  const needle=state.needle;
  activeMentionCandidates=members.filter(m=>{
    if(!needle) return true;
    return `${m.fullName||''} ${m.email||''} ${m.jobTitle||''}`.toLocaleLowerCase(lang==='ar'?'ar':'en').includes(needle);
  }).slice(0,7);
  activeMentionIndex=0;
  renderCommentMentionMenu();
}
function handleCommentMentionKeydown(event){
  const menu=document.getElementById('commentMentionMenu');
  if(!menu || menu.classList.contains('hidden')) return;
  if(event.key==='ArrowDown'){ event.preventDefault(); if(activeMentionCandidates.length){activeMentionIndex=(activeMentionIndex+1)%activeMentionCandidates.length;renderCommentMentionMenu();} }
  else if(event.key==='ArrowUp'){ event.preventDefault(); if(activeMentionCandidates.length){activeMentionIndex=(activeMentionIndex-1+activeMentionCandidates.length)%activeMentionCandidates.length;renderCommentMentionMenu();} }
  else if((event.key==='Enter'||event.key==='Tab') && activeMentionCandidates.length){ event.preventDefault(); chooseCommentMention(activeMentionCandidates[activeMentionIndex].userId); }
  else if(event.key==='Escape'){ event.preventDefault(); hideCommentMentionMenu(); }
}
function chooseCommentMention(userId){
  const textarea=document.getElementById('newTaskComment');
  const member=taskMemberById(userId);
  if(!textarea||!member||!activeMentionRange) return;
  const {start,end}=activeMentionRange;
  const insert=`@${member.fullName} `;
  textarea.value=textarea.value.slice(0,start)+insert+textarea.value.slice(end);
  const pos=start+insert.length;
  textarea.focus(); textarea.setSelectionRange(pos,pos);
  pendingCommentMentions.set(userId,member.fullName);
  hideCommentMentionMenu();
}

function closeDetailModal(){ currentDetailTaskId=null; document.getElementById('detailModalOverlay').classList.add('hidden'); }
async function refreshTaskDetail(taskId, reloadExtras=true){
  await fetchTasks(); if(reloadExtras) await fetchTaskDetailExtras(taskId); if(currentDetailTaskId===taskId) renderTaskDetailModal(taskId); renderAll();
}
async function saveTaskField(taskId, field, value, label=''){
  const x=tasks.find(t=>t.id===taskId); if(!x) return;
  if(!canEditTaskClient(x)){ taskyToast(lang==='ar'?'لا تملك صلاحية تعديل هذه المهمة':'You do not have permission to edit this task',{tone:'warning'}); return; }
  const map={title:'title_ar',description:'description',priority:'priority',projectId:'project_id',eventId:'event_id',cost:'cost',startDate:'start_date',dueDate:'due_date',col:'col'};
  const dbField=map[field]; if(!dbField) return;
  let clean=value; if(['description','eventId','startDate','dueDate'].includes(field) && !clean) clean=null; if(field==='cost') clean=Math.max(0,Number(value||0));
  const payload={[dbField]:clean,updated_at:new Date().toISOString()};
  if(field==='title') payload.title_en=value;
  if(field==='dueDate'){payload.due_ar=clean;payload.due_en=clean;}
  if(field==='col') payload.completed_at=clean==='done'?new Date().toISOString():null;
  const {error}=await sb.from('tasks').update(payload).eq('id',taskId).eq('workspace_id',currentWorkspaceId);
  if(error){alert((lang==='ar'?'تعذّر حفظ التغيير: ':'Could not save change: ')+error.message);return;}
  await logTaskActivity(taskId,field==='col'?'status_changed':'field_updated',{field,label,value:clean});
  await refreshTaskDetail(taskId,true);
}
async function toggleTaskAssignee(taskId,userId,checked){
  const x=tasks.find(t=>t.id===taskId); if(!x) return;
  if(!canEditTaskClient(x)) return;
  if(checked){
    const isLead=!x.assignees.length;
    const {error}=await sb.from('task_assignees').insert({task_id:taskId,workspace_id:currentWorkspaceId,user_id:userId,is_lead:isLead,assigned_by:currentUserId});
    if(error){alert((lang==='ar'?'تعذّر إضافة المسؤول: ':'Could not add assignee: ')+error.message);return;}
    if(isLead) await syncLegacyLead(taskId,userId);
    await logTaskActivity(taskId,'assignee_added',{user_id:userId});
  }else{
    const wasLead=x.leadAssigneeId===userId;
    const {error}=await sb.from('task_assignees').delete().eq('task_id',taskId).eq('user_id',userId);
    if(error){alert((lang==='ar'?'تعذّر إزالة المسؤول: ':'Could not remove assignee: ')+error.message);return;}
    await logTaskActivity(taskId,'assignee_removed',{user_id:userId});
    if(wasLead){
      const remaining=x.assignees.filter(m=>m.userId!==userId);
      if(remaining[0]) await setLeadAssignee(taskId,remaining[0].userId,false); else await syncLegacyLead(taskId,null);
    }
  }
  await refreshTaskDetail(taskId,true);
}
async function syncLegacyLead(taskId,userId){
  const m=userId?taskMemberById(userId):null;
  await sb.from('tasks').update({assignee_id:userId||null,assignee_initials:m?.initials||null,assignee_color:m?.color||null,updated_at:new Date().toISOString()}).eq('id',taskId);
}
async function setLeadAssignee(taskId,userId,refresh=true){
  const task=tasks.find(t=>t.id===taskId); if(!canEditTaskClient(task)) return;
  await sb.from('task_assignees').update({is_lead:false}).eq('task_id',taskId).eq('workspace_id',currentWorkspaceId);
  if(userId){
    const {error}=await sb.from('task_assignees').update({is_lead:true}).eq('task_id',taskId).eq('user_id',userId);
    if(error){alert((lang==='ar'?'تعذّر تعيين المسؤول الرئيسي: ':'Could not set lead: ')+error.message);return;}
  }
  await syncLegacyLead(taskId,userId||null);
  if(userId) await logTaskActivity(taskId,'lead_changed',{user_id:userId});
  if(refresh) await refreshTaskDetail(taskId,true);
}
async function addSubtask(taskId){
  if(!canEditTaskClient(tasks.find(t=>t.id===taskId))) return;
  const input=document.getElementById('newSubtaskTitle'); const title=input?.value.trim(); if(!title)return;

  await logTaskActivity(taskId,'subtask_added',{title});

}
async function toggleSubtaskComplete(taskId,subtaskId,checked){

async function toggleSubtaskAssignee(taskId,subtaskId,userId,checked){

async function addTaskComment(taskId){
  const input=document.getElementById('newTaskComment'); const body=input?.value.trim(); if(!body)return;
  const mentionIds=validPendingMentionIds(body);
  const {data:comment,error}=await sb.from('task_comments').insert({workspace_id:currentWorkspaceId,task_id:taskId,author_id:currentUserId,body}).select('id').single();
  if(error){alert((lang==='ar'?'تعذّر إضافة التعليق: ':'Could not add comment: ')+error.message);return;}
  if(mentionIds.length){
    const mentionRes=await sb.rpc('tasky_add_comment_mentions',{p_comment_id:comment.id,p_user_ids:mentionIds});
    if(mentionRes.error){
      console.error('mention notification failed',mentionRes.error);
      taskyToast(lang==='ar'?'تم نشر التعليق، لكن تعذّر إرسال بعض إشعارات الإشارة':'Comment posted, but some mention notifications could not be sent',{tone:'warning'});
    }
  }
  pendingCommentMentions.clear(); hideCommentMentionMenu();
  await logTaskActivity(taskId,'comment_added',{mentions:mentionIds.length}); await refreshTaskDetail(taskId,true);
}
async function uploadTaskAttachment(taskId,input){
  if(!canEditTaskClient(tasks.find(t=>t.id===taskId))) return;
  const file=input?.files?.[0]; if(!file)return; if(file.size>10*1024*1024){alert(lang==='ar'?'الحد الأقصى للمرفق 10MB':'Attachment limit is 10MB');input.value='';return;}
  const safe=(file.name||'file').replace(/[^a-zA-Z0-9._-]+/g,'_'); const path=`${currentWorkspaceId}/${taskId}/${crypto.randomUUID()}_${safe}`;
  const uploaded=await sb.storage.from('task-attachments').upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(uploaded.error){alert((lang==='ar'?'تعذّر رفع المرفق: ':'Could not upload attachment: ')+uploaded.error.message);return;}
  const meta=await sb.from('task_attachments').insert({workspace_id:currentWorkspaceId,task_id:taskId,uploaded_by:currentUserId,file_name:file.name,storage_path:path,mime_type:file.type||null,file_size:file.size});
  if(meta.error){await sb.storage.from('task-attachments').remove([path]);alert(meta.error.message);return;}
  await logTaskActivity(taskId,'attachment_added',{file_name:file.name}); await refreshTaskDetail(taskId,true);
}
async function openTaskAttachment(id){
  const a=detailAttachments.find(x=>x.id===id); if(!a)return; const {data,error}=await sb.storage.from('task-attachments').createSignedUrl(a.storage_path,120); if(error){alert(error.message);return;} window.open(data.signedUrl,'_blank','noopener');
}
async function deleteTaskAttachment(id){
  const a=detailAttachments.find(x=>x.id===id); if(!a)return;
  if(!canEditTaskClient(tasks.find(t=>t.id===a.task_id))) return; const ok=await taskyConfirm(lang==='ar'?`حذف المرفق «${a.file_name}»؟`:`Delete attachment “${a.file_name}”?`,{title:lang==='ar'?'حذف مرفق':'Delete attachment',tone:'danger',confirmText:lang==='ar'?'حذف':'Delete'}); if(!ok)return;
  const rm=await sb.storage.from('task-attachments').remove([a.storage_path]); if(rm.error){alert(rm.error.message);return;} const del=await sb.from('task_attachments').delete().eq('id',id); if(del.error){alert(del.error.message);return;} await logTaskActivity(a.task_id,'attachment_removed',{file_name:a.file_name}); await refreshTaskDetail(a.task_id,true);
}
async function deleteTask(taskId){
  const x=tasks.find(t=>t.id===taskId); if(!canDeleteTaskClient(x)){ taskyToast(lang==='ar'?'حذف المهمة يتطلب مدير مشروع أو مدير مساحة العمل':'Deleting tasks requires Project Manager or Workspace Admin access',{tone:'warning'}); return; } const ok=await taskyConfirm(lang==='ar'?`حذف المهمة «${taskTitle(x)}» وكل المهام الفرعية والتعليقات والمرفقات؟`:`Delete “${taskTitle(x)}” and all subtasks, comments, and attachments?`,{title:lang==='ar'?'حذف المهمة':'Delete task',tone:'danger',confirmText:lang==='ar'?'حذف نهائي':'Delete'}); if(!ok)return;
  const paths=detailAttachments.filter(a=>a.task_id===taskId).map(a=>a.storage_path); if(paths.length) await sb.storage.from('task-attachments').remove(paths);
  const {error}=await sb.from('tasks').delete().eq('id',taskId).eq('workspace_id',currentWorkspaceId); if(error){alert(error.message);return;} closeDetailModal(); await fetchTasks(); renderAll(); taskyToast(lang==='ar'?'تم حذف المهمة':'Task deleted',{tone:'success'});
}

/* ================= TOPBAR TITLE BALANCE ================= */
function updateTopbarTitleBalance(){
  const topbar = document.querySelector('.topbar');
  const label = document.getElementById('breadcrumbLabel');
  if(!topbar || !label) return;

  const text = (label.textContent || '').trim();
  // Arabic/English titles are balanced by visible character count.
  // Long titles get more breadcrumb room; the search box gives up space first.
  topbar.classList.remove('title-long','title-xlong');
  if(text.length >= 22) topbar.classList.add('title-xlong');
  else if(text.length >= 12) topbar.classList.add('title-long');
}

const breadcrumbTitleObserver = new MutationObserver(updateTopbarTitleBalance);
const breadcrumbTitleEl = document.getElementById('breadcrumbLabel');
if(breadcrumbTitleEl){
  breadcrumbTitleObserver.observe(breadcrumbTitleEl, { childList:true, characterData:true, subtree:true });
}



/* ================= RESPONSIVE SIDEBAR ================= */
const SIDEBAR_BREAKPOINT = 820;
function isMobileSidebar(){ return window.innerWidth <= SIDEBAR_BREAKPOINT; }
function syncSidebarAria(){
  const btn = document.getElementById('sidebarToggleBtn');
  const backdrop = document.getElementById('sidebarBackdrop');
  if(!btn) return;
  const open = isMobileSidebar()
    ? document.body.classList.contains('mobile-sidebar-open')
    : !document.body.classList.contains('sidebar-collapsed');
  btn.setAttribute('aria-expanded', String(open));
  btn.setAttribute('aria-label', lang==='ar'
    ? (open ? 'إخفاء القائمة الجانبية' : 'إظهار القائمة الجانبية')
    : (open ? 'Hide sidebar' : 'Show sidebar'));
  if(backdrop) backdrop.setAttribute('aria-hidden', String(!document.body.classList.contains('mobile-sidebar-open')));
}
function toggleSidebar(){
  if(isMobileSidebar()){
    document.body.classList.toggle('mobile-sidebar-open');
  }else{
    document.body.classList.toggle('sidebar-collapsed');
    localStorage.setItem('tasky_sidebar_collapsed', document.body.classList.contains('sidebar-collapsed') ? '1' : '0');
  }
  syncSidebarAria();
}
function closeMobileSidebar(){
  document.body.classList.remove('mobile-sidebar-open');
  syncSidebarAria();
}
function initResponsiveSidebar(){
  if(isMobileSidebar()){
    document.body.classList.remove('sidebar-collapsed');
    document.body.classList.remove('mobile-sidebar-open');
  }else{
    document.body.classList.remove('mobile-sidebar-open');
    document.body.classList.toggle('sidebar-collapsed', localStorage.getItem('tasky_sidebar_collapsed') === '1');
  }
  syncSidebarAria();
}
let sidebarWasMobile = isMobileSidebar();
window.addEventListener('resize', () => {
  const nowMobile = isMobileSidebar();
  if(nowMobile !== sidebarWasMobile){
    sidebarWasMobile = nowMobile;
    initResponsiveSidebar();
  }else{
    syncSidebarAria();
  }
});

/* ================= THEMED DIALOGS ================= */
const taskyDialogState = { resolve:null, lastFocused:null };
function getDialogIconSvg(tone='info'){
  if(tone==='success') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="m7 12 3 3 7-7"></path><circle cx="12" cy="12" r="9"></circle></svg>';
  if(tone==='warning') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5"></path><path d="M12 16h.01"></path><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path></svg>';
  if(tone==='error' || tone==='danger') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path><circle cx="12" cy="12" r="9"></circle></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4"></path><path d="M12 16h.01"></path><circle cx="12" cy="12" r="9"></circle></svg>';
}
function inferDialogTone(message=''){
  const m = String(message || '').toLowerCase();
  if(m.includes('تعذ') || m.includes('خطأ') || m.includes('could not') || m.includes('error') || m.includes('violates') || m.includes('requires') || m.includes('فشل') || m.includes('failed')) return 'error';
  if(m.includes('إلغاء') || m.includes('حذف') || m.includes('remove') || m.includes('delete') || m.includes('حد المقاعد') || m.includes('seats limit') || m.includes('غير متاح') || m.includes('not available')) return 'warning';
  if(m.includes('نجاح') || m.includes('تم ') || m.includes('success') || m.includes('saved') || m.includes('activated') || m.includes('sent') || m.includes('أُرسل') || m.includes('تم إرسال') || m.includes('تم تفعيل')) return 'success';
  return 'info';
}
function getToastIconSvg(tone='success'){
  if(tone==='success') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="m7 12 3 3 7-7"></path><circle cx="12" cy="12" r="9"></circle></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4"></path><path d="M12 16h.01"></path><circle cx="12" cy="12" r="9"></circle></svg>';
}
function taskyToast(message, {tone='success', title, duration=3600}={}){
  const stack = document.getElementById('taskyToastStack');
  if(!stack) return;
  const item = document.createElement('div');
  item.className = 'tasky-toast';
  item.dataset.tone = tone;
  const safeTitle = title || (tone==='success' ? (lang==='ar'?'تم بنجاح':'Done') : (lang==='ar'?'إشعار':'Notice'));
  item.innerHTML = `
    <div class="tasky-toast-icon">${getToastIconSvg(tone)}</div>
    <div><div class="tasky-toast-title"></div><div class="tasky-toast-message"></div></div>
    <button class="tasky-toast-close" type="button" aria-label="${lang==='ar'?'إغلاق':'Close'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m18 6-12 12"></path><path d="m6 6 12 12"></path></svg></button>`;
  item.querySelector('.tasky-toast-title').textContent = safeTitle;
  item.querySelector('.tasky-toast-message').textContent = String(message ?? '');
  const remove = () => {
    if(!item.isConnected) return;
    item.classList.add('leaving');
    setTimeout(()=>item.remove(),180);
  };
  item.querySelector('.tasky-toast-close').onclick = remove;
  stack.prepend(item);
  while(stack.children.length > 4) stack.lastElementChild?.remove();
  if(duration > 0) setTimeout(remove,duration);
}
function closeTaskyDialog(result=false){
  const backdrop = document.getElementById('taskyDialogBackdrop');
  if(!backdrop) return;
  backdrop.classList.remove('show');
  backdrop.setAttribute('aria-hidden', 'true');
  const resolve = taskyDialogState.resolve;
  taskyDialogState.resolve = null;
  if(taskyDialogState.lastFocused && typeof taskyDialogState.lastFocused.focus === 'function'){
    setTimeout(() => taskyDialogState.lastFocused.focus(), 10);
  }
  if(resolve) resolve(result);
}
function showTaskyDialog({ title, message, tone='info', confirmText, cancelText, showCancel=false }={}){
  const backdrop = document.getElementById('taskyDialogBackdrop');
  const dialog = document.getElementById('taskyDialog');
  const titleEl = document.getElementById('taskyDialogTitle');
  const messageEl = document.getElementById('taskyDialogMessage');
  const iconEl = document.getElementById('taskyDialogIcon');
  const cancelBtn = document.getElementById('taskyDialogCancel');
  const confirmBtn = document.getElementById('taskyDialogConfirm');
  if(!backdrop || !dialog) return Promise.resolve(false);
  taskyDialogState.lastFocused = document.activeElement;
  dialog.dataset.tone = tone;
  iconEl.innerHTML = getDialogIconSvg(tone);
  titleEl.textContent = title || (lang==='ar' ? 'تاسكي' : 'Tasky');
  messageEl.textContent = String(message ?? '');
  cancelBtn.textContent = cancelText || (lang==='ar' ? 'إلغاء' : 'Cancel');
  confirmBtn.textContent = confirmText || (lang==='ar' ? 'موافق' : 'OK');
  cancelBtn.style.display = showCancel ? 'inline-flex' : 'none';
  confirmBtn.className = 'tasky-dialog-btn primary';
  if(tone==='warning') confirmBtn.className = 'tasky-dialog-btn warn';
  if(tone==='danger' || tone==='error') confirmBtn.className = 'tasky-dialog-btn danger';
  return new Promise(resolve => {
    taskyDialogState.resolve = resolve;
    backdrop.classList.add('show');
    backdrop.setAttribute('aria-hidden', 'false');
    confirmBtn.onclick = () => closeTaskyDialog(true);
    cancelBtn.onclick = () => closeTaskyDialog(false);
    backdrop.onclick = (e) => { if(e.target === backdrop) closeTaskyDialog(false); };
    requestAnimationFrame(() => (showCancel ? cancelBtn : confirmBtn).focus());
  });
}
window.taskyConfirm = function(message, opts={}){
  return showTaskyDialog({
    title: opts.title || (lang==='ar' ? 'تأكيد الإجراء' : 'Confirm action'),
    message,
    tone: opts.tone || 'warning',
    confirmText: opts.confirmText || (lang==='ar' ? 'تأكيد' : 'Confirm'),
    cancelText: opts.cancelText || (lang==='ar' ? 'إلغاء' : 'Cancel'),
    showCancel: true
  });
};
window.taskyToast = taskyToast;
window.alert = function(message){
  const tone = inferDialogTone(message);
  if(tone==='success' || tone==='info'){
    taskyToast(message, {tone, duration: tone==='success' ? 3400 : 4200});
    return;
  }
  showTaskyDialog({
    title: tone==='error' ? (lang==='ar'?'تعذّر تنفيذ العملية':'Action failed') : (lang==='ar'?'تنبيه':'Notice'),
    message,
    tone,
    confirmText: lang==='ar' ? 'موافق' : 'OK',
    showCancel: false
  });
};
document.addEventListener('keydown', (e) => {
  const backdrop = document.getElementById('taskyDialogBackdrop');
  if(!backdrop || backdrop.getAttribute('aria-hidden') === 'true') return;
  if(e.key === 'Escape') closeTaskyDialog(false);
});

async function restoreMarketingRevision(revisionId){const r=marketingContentRevisions.find(x=>x.id===revisionId);if(!r)return;const ok=await taskyConfirm(lang==='ar'?`استعادة V${r.revisionNo} كمسودة حالية؟ سيتم إلغاء أي اعتماد حالي، ولن تتغير ملفات النسخة الحالية تلقائيًا.`:`Restore V${r.revisionNo} as the current draft? Any current approval will be cleared; current files are not automatically replaced.`,{title:lang==='ar'?'استعادة نسخة سابقة':'Restore previous version',confirmText:lang==='ar'?'استعادة':'Restore'});if(!ok)return;const {error}=await sb.rpc('tasky_restore_marketing_content_revision',{p_revision_id:revisionId});if(error){showTaskyDialog({title:lang==='ar'?'تعذّرت استعادة النسخة':'Could not restore version',message:error.message,tone:'error'});return;}await fetchMarketingData();renderModule();openMarketingContentDetail(r.contentId);taskyToast(lang==='ar'?`تمت استعادة V${r.revisionNo} كمسودة`:`V${r.revisionNo} restored as draft`,{tone:'success'});}

async function fetchMarketingData(){

  const [rq,cq,iq,fq,vq]=await Promise.all([

    sb.from('marketing_campaigns_v2').select('*').eq('workspace_id',currentWorkspaceId).order('created_at',{ascending:false}),
    sb.from('marketing_content_items_v2').select('*').eq('workspace_id',currentWorkspaceId).order('created_at',{ascending:false}),

  if(fq.error){console.warn('V37 marketing content files unavailable; run V37 migration',fq.error);marketingContentFiles=[];} else marketingContentFiles=(fq.data||[]).map(r=>({id:r.id,workspaceId:r.workspace_id,contentId:r.content_id,storagePath:r.storage_path,fileName:r.file_name,mimeType:r.mime_type||'',fileSize:Number(r.file_size||0),fileKind:r.file_kind||marketingFileKind(r.file_name,r.mime_type),uploadedBy:r.uploaded_by,createdAt:r.created_at,deletedAt:r.deleted_at||null}));
  if(vq.error){console.warn('V38 marketing revisions unavailable; run V38 migration',vq.error);marketingContentRevisions=[];} else marketingContentRevisions=(vq.data||[]).map(r=>({id:r.id,workspaceId:r.workspace_id,contentId:r.content_id,revisionNo:Number(r.revision_no||0),titleAr:r.title_ar||'',titleEn:r.title_en||'',contentType:r.content_type||'other',platform:r.platform||'other',copyText:r.copy_text||'',publishAt:r.publish_at||null,externalUrl:r.external_url||'',campaignId:r.campaign_id||null,requestId:r.request_id||null,projectId:r.project_id||null,ownerUserId:r.owner_user_id||null,reviewerUserId:r.reviewer_user_id||null,fileManifest:Array.isArray(r.file_manifest)?r.file_manifest:[],snapshotReason:r.snapshot_reason||'review',decision:r.decision||'snapshot',submittedBy:r.submitted_by||null,submittedAt:r.submitted_at||r.created_at,reviewedBy:r.reviewed_by||null,reviewedAt:r.reviewed_at||null,reviewNote:r.review_note||''}));

function marketingContentActionHtml(c){
  const edit=marketingCanEditContent(c)?`<button class="mkt-mini-btn" onclick="event.stopPropagation();openMarketingContentEditor('${c.id}')">${lang==='ar'?'تعديل':'Edit'}</button>`:'';
  if(['draft','changes_requested'].includes(c.stage) && marketingCanEditContent(c)) return `${edit}<button class="mkt-mini-btn primary" onclick="event.stopPropagation();submitMarketingContentForReview('${c.id}')">${lang==='ar'?'إرسال للمراجعة':'Submit review'}</button>`;
  if(c.stage==='review' && marketingCanReviewContent(c)) return `<button class="mkt-mini-btn primary" onclick="event.stopPropagation();openMarketingReviewModal('${c.id}','approved')">${lang==='ar'?'اعتماد':'Approve'}</button><button class="mkt-mini-btn danger" onclick="event.stopPropagation();openMarketingReviewModal('${c.id}','changes_requested')">${lang==='ar'?'طلب تعديل':'Request changes'}</button>`;
  if(c.stage==='approved' && (marketingCanEditContent({...c,stage:'draft'})||currentUserRole==='admin')) return `<button class="mkt-mini-btn primary" onclick="event.stopPropagation();openMarketingScheduleModal('${c.id}')">${lang==='ar'?'جدولة':'Schedule'}</button><button class="mkt-mini-btn" onclick="event.stopPropagation();markMarketingContentPublished('${c.id}')">${lang==='ar'?'تم النشر':'Mark published'}</button>`;
  if(c.stage==='scheduled' && (String(c.ownerUserId||'')===String(currentUserId)||currentUserRole==='admin')) return `<button class="mkt-mini-btn primary" onclick="event.stopPropagation();markMarketingContentPublished('${c.id}')">${lang==='ar'?'تم النشر':'Mark published'}</button>`;
  return edit;
}

function marketingContentBoardHtml(){ const cols=[{id:'draft',label:lang==='ar'?'مسودة / تعديلات':'Draft / Changes',filter:c=>['draft','changes_requested'].includes(c.stage),dot:'var(--muted)'},{id:'review',label:lang==='ar'?'مراجعة':'Review',filter:c=>c.stage==='review',dot:'var(--amber)'},{id:'approved',label:lang==='ar'?'معتمد':'Approved',filter:c=>c.stage==='approved',dot:'var(--blue)'},{id:'scheduled',label:lang==='ar'?'مجدول':'Scheduled',filter:c=>c.stage==='scheduled',dot:'var(--violet)'},{id:'published',label:lang==='ar'?'منشور':'Published',filter:c=>c.stage==='published',dot:'var(--green)'}];return `<div class="mkt-board">${cols.map(col=>{const items=contentItems.filter(col.filter);return `<div class="mkt-column"><div class="mkt-column-head"><span class="dot" style="background:${col.dot}"></span><b>${col.label}</b><span>${items.length}</span></div><div class="mkt-column-body">${items.map(marketingContentCard).join('')||`<div class="mkt-empty">${lang==='ar'?'لا يوجد محتوى':'No content'}</div>`}</div></div>`}).join('')}</div>`; }
function marketingContentCalendarHtml(){
  const cursor=new Date(marketingCalendarCursor.getFullYear(),marketingCalendarCursor.getMonth(),1);const year=cursor.getFullYear(),month=cursor.getMonth();const firstDay=(cursor.getDay()+6)%7;const days=new Date(year,month+1,0).getDate();const prevDays=new Date(year,month,0).getDate();const cells=[];for(let i=0;i<42;i++){const num=i-firstDay+1;let d,muted=false;if(num<1){d=new Date(year,month-1,prevDays+num);muted=true}else if(num>days){d=new Date(year,month+1,num-days);muted=true}else d=new Date(year,month,num);cells.push({d,muted});}
  const monthLabel=new Intl.DateTimeFormat(lang==='ar'?'ar-SA':'en-US',{month:'long',year:'numeric'}).format(cursor);const week=lang==='ar'?['الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت','الأحد']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return `<div class="mkt-calendar-card"><div class="mkt-calendar-nav"><button onclick="marketingCalendarCursor=new Date(${year},${month-1},1);renderModule()">‹</button><b>${escapeHtml(monthLabel)}</b><button onclick="marketingCalendarCursor=new Date(${year},${month+1},1);renderModule()">›</button></div><div class="mkt-calendar-week">${week.map(w=>`<span>${w}</span>`).join('')}</div><div class="mkt-calendar-grid">${cells.map(cell=>{const key=`${cell.d.getFullYear()}-${String(cell.d.getMonth()+1).padStart(2,'0')}-${String(cell.d.getDate()).padStart(2,'0')}`;const items=contentItems.filter(c=>c.publishAt&&marketingLocalDateKey(c.publishAt)===key);return `<div class="mkt-day ${cell.muted?'muted':''}"><div class="mkt-day-num">${cell.d.getDate()}</div>${items.slice(0,4).map(c=>`<button class="mkt-calendar-item ${c.stage}" onclick="openMarketingContentDetail('${c.id}')"><b>${escapeHtml(marketingPlatformSummary(c.platform))}</b><span>${escapeHtml(L(c,''))}</span></button>`).join('')}${items.length>4?`<div class="mkt-more">+${items.length-4}</div>`:''}</div>`}).join('')}</div></div>`;
}

function openRequestModal(){document.getElementById('addModalBody').innerHTML=`<div class="modal-head"><h3>${lang==='ar'?'طلب تسويق جديد':'New marketing request'}</h3><button class="modal-close" onclick="closeAddModal()"><svg style="width:18px;height:18px"><use href="#i-x"/></svg></button></div><form onsubmit="submitAddRequest(event)" class="mkt-form"><div class="field full"><label>${lang==='ar'?'عنوان الطلب':'Request title'}</label><input id="reqTitle" required></div><div class="field full"><label>${lang==='ar'?'الوصف والنتيجة المطلوبة':'Description / expected outcome'}</label><textarea id="reqDescription" rows="3"></textarea></div><div class="field"><label>${lang==='ar'?'الإدارة الطالبة':'Requesting department'}</label><input id="reqDept"></div><div class="field"><label>${lang==='ar'?'نوع الطلب':'Request type'}</label><select id="reqType">${['design','content','translation','print','media','production','campaign','event','other'].map(x=>`<option value="${x}">${marketingRequestTypeLabel(x)}</option>`).join('')}</select></div><div class="field"><label>${lang==='ar'?'الأولوية':'Priority'}</label><select id="reqPriority">${['low','medium','high','urgent'].map(x=>`<option value="${x}" ${x==='medium'?'selected':''}>${marketingPriorityLabel(x)}</option>`).join('')}</select></div><div class="field"><label>${lang==='ar'?'الموعد المطلوب':'Desired due date'}</label><input id="reqDue" type="date"></div><div class="field"><label>${lang==='ar'?'الجمهور المستهدف':'Target audience'}</label><input id="reqAudience"></div><div class="field"><label>${lang==='ar'?'القناة / المنصة':'Channel / platform'}</label><input id="reqChannel" placeholder="Instagram, X, Email..."></div><div class="field"><label>${lang==='ar'?'المشروع':'Project'}</label><select id="reqProject">${marketingProjectOptions()}</select></div><div class="field"><label>${lang==='ar'?'الميزانية':'Budget'}</label><select id="reqBudget">${marketingBudgetOptions()}</select></div><div class="field"><label>${lang==='ar'?'الفعالية':'Event'}</label><select id="reqEvent">${marketingEventOptions()}</select></div><div class="full mkt-form-actions"><button class="submit-btn" type="submit">${lang==='ar'?'إرسال للمراجعة':'Submit for review'}</button></div></form>`;document.getElementById('addModalBody').classList.add('marketing-modal');document.getElementById('addModalOverlay').classList.remove('hidden');}
async function submitAddRequest(e){e.preventDefault();const btn=e.submitter;if(btn){btn.disabled=true;btn.textContent=lang==='ar'?'جارٍ الإرسال...':'Submitting...';}const {data,error}=await sb.rpc('tasky_create_marketing_request',{p_workspace_id:currentWorkspaceId,p_title:document.getElementById('reqTitle').value.trim(),p_description:document.getElementById('reqDescription').value.trim()||null,p_department:document.getElementById('reqDept').value.trim()||null,p_request_type:document.getElementById('reqType').value,p_priority:document.getElementById('reqPriority').value,p_desired_due_date:document.getElementById('reqDue').value||null,p_target_audience:document.getElementById('reqAudience').value.trim()||null,p_channel:document.getElementById('reqChannel').value.trim()||null,p_project_id:document.getElementById('reqProject').value||null,p_budget_id:document.getElementById('reqBudget').value||null,p_event_id:document.getElementById('reqEvent').value||null});if(error){showTaskyDialog({title:lang==='ar'?'تعذّر إرسال الطلب':'Could not submit request',message:error.message,tone:'error'});if(btn)btn.disabled=false;return;}closeAddModal();await Promise.all([fetchMarketingData(),fetchNotifications()]);renderModule();taskyToast(lang==='ar'?`تم إرسال ${data?.ref||'الطلب'} للمراجعة`:'Marketing request submitted',{tone:'success'});}
function openMarketingRequestDetail(id){const r=marketingRequestById(id);if(!r)return;const requester=marketingMember(r.requestedBy),reviewer=marketingMember(r.reviewedBy);const budget=budgets.find(b=>String(b.id)===String(r.budgetId||'')),ev=eventById(r.eventId),project=projects.find(p=>String(p.id)===String(r.projectId||''));const canStatus=currentUserRole==='admin'||String(r.requestedBy)===String(currentUserId);document.getElementById('addModalBody').innerHTML=`<div class="modal-head"><div><span class="mkt-code">${escapeHtml(r.ref)}</span><h3 style="margin-top:4px">${escapeHtml(L(r,''))}</h3></div><button class="modal-close" onclick="closeAddModal()"><svg style="width:18px;height:18px"><use href="#i-x"/></svg></button></div><div class="mkt-detail-grid"><div><span>${lang==='ar'?'الحالة':'Status'}</span><b>${marketingStatusBadge(marketingRequestStatusLabel(r.status),marketingRequestStatusTone(r.status))}</b></div><div><span>${lang==='ar'?'الأولوية':'Priority'}</span><b>${escapeHtml(marketingPriorityLabel(r.priority))}</b></div><div><span>${lang==='ar'?'النوع':'Type'}</span><b>${escapeHtml(marketingRequestTypeLabel(r.type))}</b></div><div><span>${lang==='ar'?'مقدم الطلب':'Requester'}</span><b>${escapeHtml(requester?.fullName||'—')}</b></div><div><span>${lang==='ar'?'الموعد المطلوب':'Desired due'}</span><b>${escapeHtml(marketingDate(r.due))}</b></div><div><span>${lang==='ar'?'الإدارة':'Department'}</span><b>${escapeHtml(r.dept_ar||'—')}</b></div></div>${r.description?`<div class="mkt-detail-section"><h4>${lang==='ar'?'الوصف':'Description'}</h4><p>${escapeHtml(r.description)}</p></div>`:''}<div class="mkt-detail-grid compact"><div><span>${lang==='ar'?'الجمهور':'Audience'}</span><b>${escapeHtml(r.targetAudience||'—')}</b></div><div><span>${lang==='ar'?'القناة':'Channel'}</span><b>${escapeHtml(r.channel||'—')}</b></div><div><span>${lang==='ar'?'المشروع':'Project'}</span><b>${escapeHtml(project?.name||'—')}</b></div><div><span>${lang==='ar'?'الميزانية':'Budget'}</span><b>${escapeHtml(budget?L(budget,''):'—')}</b></div><div><span>${lang==='ar'?'الفعالية':'Event'}</span><b>${escapeHtml(ev?L(ev,''):'—')}</b></div><div><span>${lang==='ar'?'المراجع':'Reviewer'}</span><b>${escapeHtml(reviewer?.fullName||'—')}</b></div></div>${r.rejectionReason?`<div class="mkt-review-note danger">${escapeHtml(r.rejectionReason)}</div>`:''}<div class="mkt-detail-actions">${currentUserRole==='admin'&&r.status==='review'?`<button class="primary-btn" onclick="openMarketingRequestReviewModal('${r.id}','approved')">${lang==='ar'?'اعتماد الطلب':'Approve request'}</button><button class="chip-btn danger" onclick="openMarketingRequestReviewModal('${r.id}','rejected')">${lang==='ar'?'رفض':'Reject'}</button>`:''}${canStatus&&['approved','in_progress','done'].includes(r.status)?`<select onchange="updateRequestStatus('${r.id}',this.value)"><option value="${r.status}">${marketingRequestStatusLabel(r.status)}</option>${r.status==='approved'?`<option value="in_progress">${marketingRequestStatusLabel('in_progress')}</option>`:''}${r.status==='in_progress'?`<option value="done">${marketingRequestStatusLabel('done')}</option>`:''}${r.status==='done'?`<option value="closed">${marketingRequestStatusLabel('closed')}</option>`:''}</select>`:''}</div>`;document.getElementById('addModalBody').classList.add('marketing-modal');document.getElementById('addModalOverlay').classList.remove('hidden');}
function openMarketingRequestReviewModal(id,status){const r=marketingRequestById(id);if(!r)return;document.getElementById('addModalBody').innerHTML=`<div class="modal-head"><h3>${status==='approved'?(lang==='ar'?'اعتماد طلب التسويق':'Approve marketing request'):(lang==='ar'?'رفض طلب التسويق':'Reject marketing request')}</h3><button class="modal-close" onclick="closeAddModal()"><svg style="width:18px;height:18px"><use href="#i-x"/></svg></button></div><form onsubmit="submitMarketingRequestReview(event,'${id}','${status}')"><div class="field"><label>${lang==='ar'?'ملاحظة المراجعة':'Review note'}</label><textarea id="mktRequestReviewNote" rows="4" ${status==='rejected'?'required':''} placeholder="${status==='rejected'?(lang==='ar'?'اكتب سبب الرفض أو ما المطلوب تعديله':'Explain why the request is rejected or what needs changing'):(lang==='ar'?'ملاحظة اختيارية':'Optional note')}"></textarea></div><button class="submit-btn" type="submit">${status==='approved'?(lang==='ar'?'اعتماد الطلب':'Approve request'):(lang==='ar'?'رفض الطلب':'Reject request')}</button></form>`;document.getElementById('addModalOverlay').classList.remove('hidden');}
async function submitMarketingRequestReview(e,id,status){e.preventDefault();const note=document.getElementById('mktRequestReviewNote').value.trim()||null;const {error}=await sb.rpc('tasky_review_marketing_request',{p_request_id:id,p_status:status,p_note:note});if(error){showTaskyDialog({title:lang==='ar'?'تعذّر تحديث الطلب':'Could not review request',message:error.message,tone:'error'});return;}await Promise.all([fetchMarketingData(),fetchNotifications()]);openMarketingRequestDetail(id);if(activeNav==='requests')renderModule();taskyToast(status==='approved'?(lang==='ar'?'تم اعتماد الطلب':'Request approved'):(lang==='ar'?'تم رفض الطلب':'Request rejected'),{tone:'success'});}
async function reviewMarketingRequest(id,status){let note=null;if(status==='rejected'){const ok=await taskyConfirm(lang==='ar'?'سيتم رفض الطلب. يمكنك إضافة سبب الرفض في الخطوة التالية.':'Reject this request?',{title:lang==='ar'?'رفض طلب التسويق':'Reject marketing request',tone:'danger',confirmText:lang==='ar'?'رفض':'Reject'});if(!ok)return;note=lang==='ar'?'يحتاج إلى مراجعة المتطلبات':'Requirements need revision';}const {error}=await sb.rpc('tasky_review_marketing_request',{p_request_id:id,p_status:status,p_note:note});if(error){showTaskyDialog({title:lang==='ar'?'تعذّر تحديث الطلب':'Could not review request',message:error.message,tone:'error'});return;}await Promise.all([fetchMarketingData(),fetchNotifications()]);openMarketingRequestDetail(id);taskyToast(status==='approved'?(lang==='ar'?'تم اعتماد الطلب':'Request approved'):(lang==='ar'?'تم رفض الطلب':'Request rejected'),{tone:'success'});}
async function updateRequestStatus(id,status){const {error}=await sb.rpc('tasky_update_marketing_request_status',{p_request_id:id,p_status:status});if(error){showTaskyDialog({title:lang==='ar'?'تعذّر تحديث الحالة':'Could not update status',message:error.message,tone:'error'});return;}await fetchMarketingData();openMarketingRequestDetail(id);if(activeNav==='requests')renderModule();}

async function submitMarketingContent(e,id){
  e.preventDefault();
  const btn=e.submitter;
  if(btn){btn.disabled=true;btn.textContent=lang==='ar'?'جارٍ الحفظ...':'Saving...';}
  const platforms=[...document.querySelectorAll('[data-mkt-content-platform].selected')].map(x=>x.dataset.platform);
  if(!platforms.length){showTaskyDialog({title:lang==='ar'?'اختر منصة واحدة على الأقل':'Select at least one platform',message:lang==='ar'?'لا يمكن حفظ المحتوى بدون تحديد منصة النشر.':'Content cannot be saved without at least one publishing platform.',tone:'warning'});if(btn)btn.disabled=false;return;}
  const pending=[...(document.getElementById('mktContentFiles')?.files||[])];
  const payload={p_workspace_id:currentWorkspaceId,p_content_id:id||null,p_campaign_id:document.getElementById('mktContentCampaign').value||null,p_request_id:document.getElementById('mktContentRequest').value||null,p_project_id:document.getElementById('mktContentProject').value||null,p_title_ar:document.getElementById('mktContentAr').value.trim(),p_title_en:document.getElementById('mktContentEn').value.trim()||null,p_content_type:document.getElementById('mktContentType').value,p_platform:marketingPlatformsToValue(platforms),p_copy_text:document.getElementById('mktContentCopy').value.trim()||null,p_publish_at:document.getElementById('mktContentPublishAt').value?new Date(document.getElementById('mktContentPublishAt').value).toISOString():null,p_external_url:document.getElementById('mktContentUrl').value.trim()||null,p_owner_user_id:document.getElementById('mktContentOwner').value||currentUserId,p_reviewer_user_id:document.getElementById('mktContentReviewer').value||null};
  const {data,error}=await sb.rpc('tasky_save_marketing_content',payload);
  if(error){const extra=/invalid platform/i.test(error.message||'')?(lang==='ar'?' — شغّل تحديث SQL الخاص بتعدد المنصات أولًا.':' — Run the multi-platform SQL update first.'):'';showTaskyDialog({title:lang==='ar'?'تعذّر حفظ المحتوى':'Could not save content',message:(error.message||String(error))+extra,tone:'error'});if(btn)btn.disabled=false;return;}
  const savedId=data?.id||id;
  try{if(pending.length){if(btn)btn.textContent=lang==='ar'?'جارٍ رفع الملفات...':'Uploading files...';await uploadMarketingContentFiles(savedId,pending);}}
  catch(err){await fetchMarketingData();showTaskyDialog({title:lang==='ar'?'تم حفظ المحتوى لكن تعذّر رفع بعض الملفات':'Content saved, but some files could not be uploaded',message:String(err?.message||err),tone:'warning'});if(btn)btn.disabled=false;return;}
  closeAddModal();await fetchMarketingData();renderModule();taskyToast(pending.length?(lang==='ar'?`تم حفظ المحتوى ورفع ${pending.length} ملف`:`Content saved with ${pending.length} file${pending.length===1?'':'s'}`):(lang==='ar'?'تم حفظ المسودة':'Draft saved'),{tone:'success'});
}

function openMarketingScheduleModal(id){const c=marketingContentById(id);if(!c)return;document.getElementById('addModalBody').innerHTML=`<div class="modal-head"><h3>${lang==='ar'?'جدولة المحتوى':'Schedule content'}</h3><button class="modal-close" onclick="closeAddModal()"><svg style="width:18px;height:18px"><use href="#i-x"/></svg></button></div><form onsubmit="scheduleMarketingContent(event,'${id}')"><div class="field"><label>${lang==='ar'?'تاريخ ووقت النشر':'Publish date & time'}</label><input id="mktScheduleAt" type="datetime-local" required value="${marketingToDatetimeLocal(c.publishAt)}"></div><button class="submit-btn" type="submit">${lang==='ar'?'حفظ الجدولة':'Save schedule'}</button></form>`;document.getElementById('addModalOverlay').classList.remove('hidden');}
async function scheduleMarketingContent(e,id){e.preventDefault();const v=document.getElementById('mktScheduleAt').value;const {error}=await sb.rpc('tasky_schedule_marketing_content',{p_content_id:id,p_publish_at:new Date(v).toISOString()});if(error){showTaskyDialog({title:lang==='ar'?'تعذّرت الجدولة':'Could not schedule content',message:error.message,tone:'error'});return;}closeAddModal();await fetchMarketingData();renderModule();taskyToast(lang==='ar'?'تمت جدولة المحتوى':'Content scheduled',{tone:'success'});}
async function markMarketingContentPublished(id){const ok=await taskyConfirm(lang==='ar'?'تأكيد أن هذا المحتوى تم نشره؟':'Mark this content as published?',{title:lang==='ar'?'تأكيد النشر':'Confirm publish',confirmText:lang==='ar'?'تم النشر':'Published'});if(!ok)return;const c=marketingContentById(id);const {error}=await sb.rpc('tasky_mark_marketing_content_published',{p_content_id:id,p_external_url:c?.externalUrl||null});if(error){showTaskyDialog({title:lang==='ar'?'تعذّر تحديث المحتوى':'Could not update content',message:error.message,tone:'error'});return;}await fetchMarketingData();renderModule();taskyToast(lang==='ar'?'تم تسجيل المحتوى كمنشور':'Content marked published',{tone:'success'});}


/* ================= PUBLIC SUPPLIER RFQ PORTAL ================= */
let publicRfqPayload=null;
function publicRfqBrandMarkup(data){return data?.brand_logo_url?`<img src="${escapeHtml(data.brand_logo_url)}" alt="${escapeHtml(data.workspace_name||'')}">`:`<span class="tasky-brand">${getTaskyWordmarkMarkup('ar')}</span>`;}
function publicRfqMoney(n){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ر.س';}
async function showPublicVendorQuotePortal(token){
  document.getElementById('authScreen').style.display='none';document.querySelector('.app').style.display='none';
  let screen=document.getElementById('publicRfqScreen');if(!screen){screen=document.createElement('div');screen.id='publicRfqScreen';screen.className='public-rfq-screen';document.body.appendChild(screen);}screen.innerHTML=`<div class="public-rfq-shell"><div class="public-rfq-card"><div class="public-rfq-body" style="text-align:center;padding:50px 20px;color:#667267">${lang==='ar'?'جارٍ تحميل طلب عرض السعر...':'Loading request for quotation...'}</div></div></div>`;
  const {data,error}=await sb.rpc('tasky_public_get_rfq_invitation',{p_token:token});if(error||!data){screen.innerHTML=`<div class="public-rfq-shell"><div class="public-rfq-card"><div class="public-rfq-body" style="text-align:center;padding:46px 20px"><h2>${lang==='ar'?'الرابط غير متاح':'Link unavailable'}</h2><p style="color:#667267">${escapeHtml(error?.message||(lang==='ar'?'الرابط غير صحيح أو لم يعد متاحًا.':'The link is invalid or no longer available.'))}</p></div></div></div>`;return;}publicRfqPayload=data;renderPublicVendorQuotePortal(token,data);
}
function renderPublicVendorQuotePortal(token,data,notice=''){
  const screen=document.getElementById('publicRfqScreen');if(!screen)return;const quote=data.quote||{};const editable=!!data.is_editable;const items=Array.isArray(data.items)?data.items:[];const alert=notice?`<div class="public-rfq-alert success">${escapeHtml(notice)}</div>`:data.is_expired?`<div class="public-rfq-alert warning">${lang==='ar'?'انتهى موعد استقبال العروض. يمكنك مراجعة عرضك السابق فقط.':'The submission deadline has passed. Your previous quote is read-only.'}</div>`:data.rfq_status!=='open'?`<div class="public-rfq-alert warning">${lang==='ar'?'تم إغلاق طلب عرض السعر.':'This RFQ is closed.'}</div>`:data.invitation_status==='declined'?`<div class="public-rfq-alert warning">${lang==='ar'?'تم تسجيل اعتذاركم عن تقديم العرض.':'Your decline has been recorded.'}</div>`:'';
  const rows=items.map((x,i)=>`<div class="public-rfq-item"><div><b>${i+1}. ${escapeHtml(x.description)}</b></div><div class="qty">${lang==='ar'?'الكمية':'Qty'}<br><b>${Number(x.quantity||0)}</b></div><div class="public-rfq-field"><label>${lang==='ar'?'سعر الوحدة (ر.س)':'Unit price (SAR)'}</label><input class="publicRfqUnitPrice" data-item-id="${x.id}" data-qty="${Number(x.quantity||0)}" type="number" min="0" step="0.01" value="${Number(x.unit_price||0)||''}" ${editable?'':'disabled'} oninput="updatePublicRfqTotal()"></div></div>`).join('');
  screen.innerHTML=`<div class="public-rfq-shell"><div class="public-rfq-card"><div class="public-rfq-head"><div class="public-rfq-brand">${publicRfqBrandMarkup(data)}<div style="min-width:0"><div class="public-rfq-org">${escapeHtml(data.workspace_name||'')}</div><div class="public-rfq-ref">${escapeHtml(data.rfq_number||'')}</div></div></div></div><div class="public-rfq-body">${alert}<div style="font-size:12px;color:#647067;margin-bottom:4px">${lang==='ar'?`مرحبًا ${escapeHtml(data.vendor_contact_name||data.vendor_name||'')}`:`Hello ${escapeHtml(data.vendor_contact_name||data.vendor_name||'')}`}</div><h1 class="public-rfq-title">${escapeHtml(data.title||'')}</h1>${data.description?`<p class="public-rfq-desc">${escapeHtml(data.description)}</p>`:''}<div class="public-rfq-meta"><div>${lang==='ar'?'آخر موعد لتقديم العرض':'Quote deadline'}<b>${escapeHtml(data.response_deadline||'—')}</b></div><div>${lang==='ar'?'التسليم المطلوب':'Required delivery'}<b>${escapeHtml(data.delivery_date||'—')}</b></div><div>${lang==='ar'?'المورد':'Vendor'}<b>${escapeHtml(data.vendor_name||'—')}</b></div></div><form onsubmit="submitPublicVendorQuote(event,'${token}')"><div class="public-rfq-section"><h3>${lang==='ar'?'أسعار البنود':'Item pricing'}</h3><div class="public-rfq-items">${rows}</div></div><div class="public-rfq-section"><h3>${lang==='ar'?'تفاصيل العرض':'Quotation details'}</h3><div class="public-rfq-grid"><div class="public-rfq-field"><label>${lang==='ar'?'رقم عرض السعر':'Quotation number'}</label><input id="publicQuoteNumber" value="${escapeHtml(quote.quote_number||'')}" ${editable?'':'disabled'}></div><div class="public-rfq-field"><label>${lang==='ar'?'العرض صالح حتى':'Valid until'}</label><input id="publicQuoteValidUntil" type="date" value="${escapeHtml(quote.valid_until||'')}" ${editable?'':'disabled'}></div><div class="public-rfq-field"><label>${lang==='ar'?'تاريخ التسليم المقترح':'Promised delivery date'}</label><input id="publicQuoteDelivery" type="date" value="${escapeHtml(quote.promised_delivery_date||'')}" ${editable?'':'disabled'}></div><div class="public-rfq-field"><label>${lang==='ar'?'مدة التوريد بالأيام':'Lead time (days)'}</label><input id="publicQuoteLeadDays" type="number" min="0" step="1" value="${quote.lead_time_days??''}" ${editable?'':'disabled'}></div><div class="public-rfq-field"><label>${lang==='ar'?'الخصم (ر.س)':'Discount (SAR)'}</label><input id="publicQuoteDiscount" type="number" min="0" step="0.01" value="${Number(quote.discount_amount||0)}" ${editable?'':'disabled'} oninput="updatePublicRfqTotal()"></div><div class="public-rfq-field"><label>${lang==='ar'?'الشحن / التوصيل (ر.س)':'Shipping (SAR)'}</label><input id="publicQuoteShipping" type="number" min="0" step="0.01" value="${Number(quote.shipping_amount||0)}" ${editable?'':'disabled'} oninput="updatePublicRfqTotal()"></div><div class="public-rfq-field"><label>${lang==='ar'?'الضريبة %':'Tax %'}</label><input id="publicQuoteTax" type="number" min="0" max="100" step="0.01" value="${quote.tax_percent??15}" ${editable?'':'disabled'} oninput="updatePublicRfqTotal()"></div><div class="public-rfq-field"><label>${lang==='ar'?'شروط الدفع':'Payment terms'}</label><input id="publicQuoteTerms" value="${escapeHtml(quote.payment_terms||data.default_payment_terms||'')}" ${editable?'':'disabled'}></div><div class="public-rfq-field full"><label>${lang==='ar'?'ملاحظات العرض':'Quotation notes'}</label><textarea id="publicQuoteNotes" rows="3" ${editable?'':'disabled'}>${escapeHtml(quote.notes||'')}</textarea></div><div class="public-rfq-field full"><label>${lang==='ar'?'ملف عرض السعر PDF (اختياري، حتى 8MB)':'Quotation PDF (optional, max 8 MB)'}</label><div class="public-rfq-file">${quote.attachment_path?`<div style="margin-bottom:7px;color:#1D7040;font-weight:700">✓ ${lang==='ar'?'يوجد ملف PDF مرفوع حاليًا':'A PDF is already attached'}</div>`:''}<input id="publicQuoteFile" type="file" accept="application/pdf" ${editable?'':'disabled'}></div></div></div><div class="public-rfq-summary"><span>${lang==='ar'?'الإجمالي قبل الخصم':'Subtotal'}</span><b id="publicRfqSubtotal">${publicRfqMoney(quote.subtotal_amount||0)}</b><span>${lang==='ar'?'الضريبة':'Tax'}</span><b id="publicRfqTaxAmount">${publicRfqMoney(quote.tax_amount||0)}</b><span>${lang==='ar'?'الإجمالي النهائي':'Grand total'}</span><b class="total" id="publicRfqGrandTotal">${publicRfqMoney(quote.total_amount||0)}</b></div>${editable?`<button id="publicRfqSubmitBtn" class="public-rfq-submit" type="submit">${quote.id?(lang==='ar'?'تحديث وإعادة إرسال العرض':'Update & resubmit quote'):(lang==='ar'?'إرسال عرض السعر':'Submit quotation')}</button>${quote.id?'':`<button class="public-rfq-decline" type="button" onclick="declinePublicRfq('${token}')">${lang==='ar'?'لن نتمكن من تقديم عرض':'We cannot submit a quote'}</button>`}`:`${quote.id?`<div class="public-rfq-alert success" style="margin-top:16px">✓ ${lang==='ar'?'تم استلام عرضكم.':'Your quotation has been received.'}</div>`:''}`}</div></form></div></div></div>`;updatePublicRfqTotal();
}
function publicRfqCalc(){let subtotal=0;document.querySelectorAll('.publicRfqUnitPrice').forEach(el=>subtotal+=Number(el.dataset.qty||0)*Number(el.value||0));const discount=Math.max(0,Number(document.getElementById('publicQuoteDiscount')?.value||0));const shipping=Math.max(0,Number(document.getElementById('publicQuoteShipping')?.value||0));const taxPct=Math.max(0,Number(document.getElementById('publicQuoteTax')?.value||0));const base=Math.max(0,subtotal-discount+shipping);const tax=base*taxPct/100;return{subtotal,discount,shipping,taxPct,tax,total:base+tax};}
function updatePublicRfqTotal(){const x=publicRfqCalc();const a=document.getElementById('publicRfqSubtotal'),b=document.getElementById('publicRfqTaxAmount'),c=document.getElementById('publicRfqGrandTotal');if(a)a.textContent=publicRfqMoney(x.subtotal);if(b)b.textContent=publicRfqMoney(x.tax);if(c)c.textContent=publicRfqMoney(x.total);}
async function uploadPublicRfqPdf(token,file){if(!file)return null;if(file.type!=='application/pdf')throw new Error(lang==='ar'?'الملف يجب أن يكون PDF':'File must be PDF');if(file.size>8*1024*1024)throw new Error(lang==='ar'?'حجم PDF يجب ألا يتجاوز 8MB':'PDF must be 8 MB or smaller');const fd=new FormData();fd.append('token',token);fd.append('file',file,file.name);const res=await fetch(`${TASKY_SUPABASE_URL}/functions/v1/upload-rfq-quote`,{method:'POST',headers:{apikey:TASKY_SUPABASE_PUBLISHABLE_KEY},body:fd});const body=await res.json().catch(()=>({}));if(!res.ok||body?.error)throw new Error(body?.error||(lang==='ar'?'تعذر رفع الملف':'Upload failed'));return body.path;}
async function submitPublicVendorQuote(e,token){e.preventDefault();const btn=document.getElementById('publicRfqSubmitBtn');if(btn){btn.disabled=true;btn.textContent=lang==='ar'?'جارٍ إرسال العرض...':'Submitting...';}try{const items=[...document.querySelectorAll('.publicRfqUnitPrice')].map(el=>({rfq_item_id:el.dataset.itemId,unit_price:Number(el.value||0),note:null}));if(items.some(x=>x.unit_price<0))throw new Error(lang==='ar'?'تحقق من أسعار البنود':'Check item prices');const file=document.getElementById('publicQuoteFile')?.files?.[0]||null;let attachmentPath=publicRfqPayload?.quote?.attachment_path||null;if(file)attachmentPath=await uploadPublicRfqPdf(token,file);const {error}=await sb.rpc('tasky_public_submit_vendor_quote',{p_token:token,p_quote_number:document.getElementById('publicQuoteNumber').value.trim(),p_valid_until:document.getElementById('publicQuoteValidUntil').value||null,p_promised_delivery_date:document.getElementById('publicQuoteDelivery').value||null,p_lead_time_days:document.getElementById('publicQuoteLeadDays').value?Number(document.getElementById('publicQuoteLeadDays').value):null,p_payment_terms:document.getElementById('publicQuoteTerms').value.trim(),p_notes:document.getElementById('publicQuoteNotes').value.trim(),p_discount_amount:Number(document.getElementById('publicQuoteDiscount').value||0),p_shipping_amount:Number(document.getElementById('publicQuoteShipping').value||0),p_tax_percent:Number(document.getElementById('publicQuoteTax').value||0),p_attachment_path:attachmentPath,p_items:items});if(error)throw error;const fresh=await sb.rpc('tasky_public_get_rfq_invitation',{p_token:token});if(fresh.data){publicRfqPayload=fresh.data;renderPublicVendorQuotePortal(token,fresh.data,lang==='ar'?'تم استلام عرض السعر بنجاح. شكرًا لكم.':'Your quotation was submitted successfully. Thank you.');}}catch(err){showTaskyDialog({title:lang==='ar'?'تعذّر إرسال العرض':'Could not submit quote',message:String(err?.message||err),tone:'error'});if(btn){btn.disabled=false;btn.textContent=lang==='ar'?'إرسال عرض السعر':'Submit quotation';}}
}
async function declinePublicRfq(token){if(!(await taskyConfirm(lang==='ar'?'هل تريد تسجيل اعتذاركم عن تقديم عرض سعر لهذا الطلب؟':'Decline this request for quotation?',{title:lang==='ar'?'الاعتذار عن العرض':'Decline RFQ',tone:'danger',confirmText:lang==='ar'?'تأكيد الاعتذار':'Confirm decline'})))return;const {error}=await sb.rpc('tasky_public_decline_rfq_invitation',{p_token:token,p_reason:null});if(error){showTaskyDialog({title:lang==='ar'?'تعذّر حفظ الاعتذار':'Could not save decline',message:error.message,tone:'error'});return;}const fresh=await sb.rpc('tasky_public_get_rfq_invitation',{p_token:token});if(fresh.data){publicRfqPayload=fresh.data;renderPublicVendorQuotePortal(token,fresh.data,lang==='ar'?'تم تسجيل اعتذاركم.':'Your decline has been recorded.');}}

/* ================= PUBLIC EVENT INVITATION / RSVP ================= */
async function showPublicEventInvitation(token){
  document.getElementById('authScreen').style.display='none';
  document.querySelector('.app').style.display='none';
  let screen=document.getElementById('publicEventInviteScreen');
  if(!screen){screen=document.createElement('div');screen.id='publicEventInviteScreen';screen.className='public-event-invite-screen';document.body.appendChild(screen);}
  screen.innerHTML=`<div class="public-event-invite-card"><div class="public-event-invite-brand">${getTaskyWordmarkMarkup(lang)}</div><div style="padding:28px;color:#7A8079">${lang==='ar'?'جارٍ تحميل الدعوة...':'Loading invitation...'}</div></div>`;
  const {data,error}=await sb.rpc('tasky_get_event_invitation_public',{p_token:token});
  if(error||!data){screen.innerHTML=`<div class="public-event-invite-card"><div class="public-event-invite-brand">${getTaskyWordmarkMarkup(lang)}</div><h1>${lang==='ar'?'الدعوة غير متاحة':'Invitation unavailable'}</h1><p style="color:#7A8079">${escapeHtml(error?.message||(lang==='ar'?'الرابط غير صحيح أو انتهت صلاحية الدعوة.':'The invitation link is invalid or unavailable.'))}</p></div>`;return;}
  renderPublicEventInvitation(token,data);
}
function renderPublicEventInvitation(token,data){
  const screen=document.getElementById('publicEventInviteScreen'); if(!screen)return;
  const title=lang==='ar'?(data.title_ar||data.title_en):(data.title_en||data.title_ar);
  const status=eventInvitationStatusLabel(data.status);
  const date=data.start_at?formatEventDate(data.start_at):(lang==='ar'?'بدون موعد':'No date');
  screen.innerHTML=`<div class="public-event-invite-card"><div class="public-event-invite-brand">${getTaskyWordmarkMarkup(lang)}</div><div style="font-size:12px;color:#7A8079">${escapeHtml(data.workspace_name||'')}</div><h1>${escapeHtml(title||'')}</h1><div class="invite-name">${lang==='ar'?`مرحبًا ${escapeHtml(data.guest_name)}`:`Hello ${escapeHtml(data.guest_name)}`}</div><p style="font-size:13px;color:#4B534C;line-height:1.8;margin:5px 0 0">${escapeHtml(data.description|| (lang==='ar'?'يسعدنا حضورك لهذه الفعالية.':'We would be delighted to have you at this event.'))}</p><div class="public-event-invite-meta"><div><b>${lang==='ar'?'الموعد':'Date'}</b><br>${escapeHtml(date)}</div><div><b>${lang==='ar'?'عدد الأشخاص':'Party size'}</b><br>${Number(data.party_size||1)}</div>${data.location?`<div><b>${lang==='ar'?'الموقع':'Location'}</b><br>${escapeHtml(data.location)}</div>`:''}<div><b>${lang==='ar'?'حالة المشاركة':'RSVP'}</b><br>${escapeHtml(status)}</div></div>${data.google_maps_url?`<a href="${escapeHtml(data.google_maps_url)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#2A6C2E;font-weight:800;margin:2px 0 8px">${lang==='ar'?'فتح الموقع في Google Maps':'Open in Google Maps'} ↗</a>`:''}${data.checked_in_at?`<div style="background:#E7F0DD;color:#2A6C2E;border-radius:12px;padding:10px 12px;font-weight:800;margin:8px 0">✓ ${lang==='ar'?'تم تسجيل حضورك':'You are checked in'}</div>`:''}${data.status==='cancelled'?`<div style="background:#F7E4E2;color:#C0453D;border-radius:12px;padding:10px 12px;font-weight:800;margin-top:10px">${lang==='ar'?'تم إلغاء هذه الدعوة':'This invitation has been cancelled'}</div>`:`<div class="public-event-invite-actions"><button class="yes" onclick="publicEventRsvp('${token}','confirmed')">${lang==='ar'?'سأحضر':'Going'}</button><button class="maybe" onclick="publicEventRsvp('${token}','maybe')">${lang==='ar'?'ربما':'Maybe'}</button><button class="no" onclick="publicEventRsvp('${token}','declined')">${lang==='ar'?'أعتذر':'Decline'}</button></div>`}${data.contact_name||data.contact_phone||data.contact_email?`<div style="margin-top:18px;padding-top:14px;border-top:1px solid #E5E8E1;color:#7A8079;font-size:11px;line-height:1.7">${lang==='ar'?'للتواصل':'Contact'}: ${escapeHtml([data.contact_name,data.contact_phone,data.contact_email].filter(Boolean).join(' · '))}</div>`:''}</div>`;
}
async function publicEventRsvp(token,status){
  const {error}=await sb.rpc('tasky_rsvp_event_invitation',{p_token:token,p_status:status});
  if(error){showTaskyDialog({title:lang==='ar'?'تعذّر حفظ الرد':'Could not save RSVP',message:error.message,tone:'error'});return;}
  const fresh=await sb.rpc('tasky_get_event_invitation_public',{p_token:token});
  if(fresh.data)renderPublicEventInvitation(token,fresh.data);
  taskyToast(lang==='ar'?'تم حفظ ردك، شكرًا لك':'Your RSVP has been saved',{tone:'success'});
}

/* ================= MASTER RENDER ================= */
function renderAll(){
  renderHomeStats();
  if(activeView==='board') renderBoard();
  if(activeView==='list') renderList();
}

/* ================= INIT ================= */
// Auth invitation links can establish the session after the page starts loading.
// Re-check the app state when Supabase reports a signed-in session.
sb.auth.onAuthStateChange((event, session) => {
  const qs=new URLSearchParams(window.location.search);const publicInviteToken=qs.get('invite');const publicQuoteToken=qs.get('quote');
  if(!publicInviteToken && !publicQuoteToken && event === 'SIGNED_IN' && session){
    setTimeout(() => checkSession(), 0);
  }
});

initResponsiveSidebar();
applyChrome();
applyTheme();
renderNav();
renderViewTabs();
setActiveNav('tasks');
updateTopbarTitleBalance();
const taskyPublicParams=new URLSearchParams(window.location.search);
const taskyPublicQuoteToken=taskyPublicParams.get('quote');
const taskyPublicInviteToken=taskyPublicParams.get('invite');
if(taskyPublicQuoteToken) showPublicVendorQuotePortal(taskyPublicQuoteToken); else if(taskyPublicInviteToken) showPublicEventInvitation(taskyPublicInviteToken); else checkSession();
</script>
