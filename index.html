<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تاسكي — منصة إدارة الأعمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2A6C2E; --green-bright:#82AF21; --green-tint:#E7F0DD;
    --blue:#1F5C7A; --blue-tint:#DEEAF0; --blue-light:#4A8BAA; --blue-light-tint:#DCEAF3;
    --blue-deep:#123B52; --blue-deep-tint:#DCE7EE;
    --teal:#1F7A6C; --teal-tint:#DFF0EC;
    --violet:#5B4B8A; --violet-tint:#EBE7F3;
    --ink:#182018; --ink-soft:#4B534C; --muted:#7A8079;
    --paper:#F4F6F2; --card:#FFFFFF; --border:#E5E8E1;
    --danger:#C0453D; --danger-tint:#F7E4E2; --amber:#D9A441; --amber-tint:#F7ECD8;
  }
  body.dark{
    --paper:#171D18; --card:#212B23; --ink:#EAF1E6; --ink-soft:#C7D4C2; --muted:#8FA089; --border:#31402F;
    --green-tint:#1E3324; --blue-tint:#1C2E36; --blue-light-tint:#1C2C33; --blue-deep-tint:#182530;
    --teal-tint:#173028; --violet-tint:#2A2438; --danger-tint:#3A2220; --amber-tint:#332A16;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",sans-serif;transition:background .2s,color .2s;}
  html[dir="ltr"] body{font-family:"Inter",sans-serif;}
  h1,h2,h3,h4{font-family:"Almarai",sans-serif;margin:0;}
  html[dir="ltr"] h1,html[dir="ltr"] h2,html[dir="ltr"] h3,html[dir="ltr"] h4{font-family:"Inter",sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  .app{display:flex;height:100vh;overflow:hidden;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D6DBD1;border-radius:8px;}

  /* ---------------- SIDEBAR ---------------- */
  .sidebar{width:264px;flex:none;background:#12291A;color:#EAF1E6;display:flex;flex-direction:column;padding:20px 16px;gap:16px;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 4px;}
  .brand .name{font-weight:800;font-size:18px;color:#fff;}
  .workspace{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.06);border-radius:10px;padding:9px 12px;font-size:13px;color:#CBD9C8;cursor:pointer;}
  .new-task-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green-bright);color:#16210D;border:none;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;}
  .search-mini{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 12px;color:#9FB09B;font-size:13px;}
  .search-mini input{background:transparent;border:none;outline:none;color:#EAF1E6;font-size:13px;width:100%;}
  .search-mini input::placeholder{color:#7E9078;}
  nav.main-nav{display:flex;flex-direction:column;gap:2px;}
  .nav-group-label{font-size:10px;letter-spacing:.08em;color:#5A6E56;text-transform:uppercase;padding:10px 10px 2px;font-family:"IBM Plex Mono",monospace;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:14px;color:#CBD9C8;cursor:pointer;}
  .nav-item svg{width:18px;height:18px;flex:none;opacity:.85;}
  .nav-item .dot{width:7px;height:7px;border-radius:50%;margin-right:auto;flex:none;}
  html[dir="ltr"] .nav-item .dot{margin-right:0;margin-left:auto;}
  .nav-item.active{background:rgba(255,255,255,.1);color:#fff;font-weight:600;}
  .nav-item:not(.active):hover{background:rgba(255,255,255,.05);}
  .nav-item.locked{color:#7E9078;}
  .nav-item.locked:hover{background:rgba(255,255,255,.04);}
  .role-toggle{display:flex;background:rgba(255,255,255,.06);border-radius:9px;padding:3px;gap:2px;}
  .role-toggle button{flex:1;border:none;background:transparent;color:#9FB09B;font-size:11px;font-weight:700;padding:6px 4px;border-radius:7px;}
  .role-toggle button.active{background:rgba(255,255,255,.14);color:#fff;}
  .nav-label{font-size:11px;letter-spacing:.08em;color:#6E8168;text-transform:uppercase;padding:4px 10px 0;font-family:"IBM Plex Mono",monospace;}
  .projects-list{display:flex;flex-direction:column;gap:1px;}
  .projects-inline-wrap{margin:3px 0 8px;padding:7px 6px 6px;border-radius:10px;background:rgba(255,255,255,.035);}
  .projects-inline-head{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 5px;font-size:10px;letter-spacing:.08em;color:#6E8168;text-transform:uppercase;font-family:"IBM Plex Mono",monospace;}
  .projects-inline-plus{width:24px;height:24px;border:0;background:rgba(255,255,255,.06);color:#AFC0AA;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0;}
  .projects-inline-plus:hover{background:rgba(255,255,255,.11);color:#fff;}
  .projects-inline-plus svg{width:13px;height:13px;}
  .projects-inline-list{max-height:190px;overflow-y:auto;padding-inline-end:2px;}
  .projects-empty{font-size:11.5px;color:#71836D;padding:6px 10px;}
  .create-project-item{color:#9FB09B !important;border:1px dashed rgba(255,255,255,.14);margin-top:4px;}
  .create-project-item:hover{color:#fff !important;border-color:rgba(255,255,255,.22);}
  .project-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:#C3D2C0;cursor:pointer;}
  .project-item:hover{background:rgba(255,255,255,.05);}
  .project-item .dot{width:8px;height:8px;border-radius:3px;flex:none;}
  .project-item.active{background:rgba(255,255,255,.1);color:#fff;}
  .sidebar-bottom{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid rgba(255,255,255,.08);}
  .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:none;}
  .sidebar-bottom .user-info{display:flex;flex-direction:column;line-height:1.25;}
  .sidebar-bottom .user-info b{font-size:13px;color:#fff;}
  .sidebar-bottom .user-info span{font-size:11.5px;color:#8FA089;}
  .sidebar-bottom svg{margin-right:auto;width:17px;height:17px;color:#8FA089;}
  html[dir="ltr"] .sidebar-bottom svg{margin-right:0;margin-left:auto;}

  /* ---------------- MAIN ---------------- */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:var(--card);flex:none;}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .breadcrumb b{color:var(--ink);font-size:15px;font-family:"Almarai",sans-serif;font-weight:700;}
  html[dir="ltr"] .breadcrumb b{font-family:"Inter",sans-serif;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;}
  .icon-btn svg{width:17px;height:17px;color:var(--ink-soft);}
  .icon-btn .badge{position:absolute;top:-4px;left:-4px;background:var(--danger);color:#fff;font-size:9px;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .lang-btn{display:flex;align-items:center;gap:6px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);padding:0 12px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:8px 14px;width:260px;}
  .search-box svg{width:16px;height:16px;color:var(--muted);}
  .search-box input{border:none;background:transparent;outline:none;font-size:13.5px;width:100%;color:var(--ink);}
  .primary-btn{display:flex;align-items:center;gap:6px;background:var(--green);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;}
  .primary-btn svg{width:15px;height:15px;}
  .content{flex:1;overflow-y:auto;padding:24px 28px 40px;display:flex;flex-direction:column;gap:22px;}

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:17px 18px;}
  .stat-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .stat-card .icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .stat-card .icon svg{width:16px;height:16px;color:#fff;}
  .stat-card .label{font-size:12.5px;color:var(--muted);}
  .stat-card .value{font-family:"Almarai",sans-serif;font-weight:800;font-size:23px;margin-top:4px;}
  html[dir="ltr"] .stat-card .value{font-family:"Inter",sans-serif;}
  .stat-card .trend{font-size:11.5px;font-family:"IBM Plex Mono",monospace;display:block;margin-top:6px;}

  .ai-banner{display:flex;align-items:center;gap:14px;background:var(--violet-tint);border:1px solid #D8CDEB;border-radius:14px;padding:14px 18px;}
  .ai-banner .icon{width:34px;height:34px;border-radius:10px;background:var(--violet);display:flex;align-items:center;justify-content:center;flex:none;}
  .ai-banner .icon svg{width:17px;height:17px;color:#fff;}
  .ai-banner p{margin:0;font-size:13.5px;color:var(--ink);}
  .ai-banner .link{margin-right:auto;font-size:13px;font-weight:700;color:var(--violet);white-space:nowrap;flex:none;background:none;border:none;}
  html[dir="ltr"] .ai-banner .link{margin-right:0;margin-left:auto;}

  .board-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .view-tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:3px;}
  .view-tab{padding:7px 14px;border-radius:8px;font-size:13px;color:var(--muted);border:none;background:transparent;font-weight:600;}
  .view-tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .board-actions{display:flex;align-items:center;gap:10px;position:relative;flex-wrap:wrap;}
  .chip-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:9px;padding:7px 12px;font-size:12.5px;color:var(--ink-soft);}
  .chip-btn svg{width:14px;height:14px;}
  .chip-btn.on{background:var(--danger-tint);color:var(--danger);}
  .avatar-stack{display:flex;}
  .avatar-stack .avatar{width:28px;height:28px;font-size:11px;margin-right:-8px;border:2px solid var(--card);}
  html[dir="ltr"] .avatar-stack .avatar{margin-right:0;margin-left:-8px;}

  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start;}
  .column{display:flex;flex-direction:column;gap:12px;min-width:0;border-radius:14px;padding:6px;transition:background .12s;}
  .column.drag-over{background:rgba(42,108,46,.06);outline:2px dashed var(--green-bright);}
  .column-head{display:flex;align-items:center;gap:8px;padding:2px 4px;}
  .column-head .dot{width:8px;height:8px;border-radius:50%;}
  .column-head h4{font-size:13.5px;}
  .column-head .count{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace;margin-right:auto;}
  html[dir="ltr"] .column-head .count{margin-right:0;margin-left:auto;}

  .task-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 14px;display:flex;flex-direction:column;gap:10px;cursor:grab;transition:box-shadow .15s, transform .1s;}
  .task-card:hover{box-shadow:0 4px 14px rgba(20,30,20,.08);transform:translateY(-1px);}
  .task-card.done{opacity:.72;}
  .task-card .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;}
  .task-title{font-size:13.5px;font-weight:600;line-height:1.5;color:var(--ink);}
  .task-title.done{text-decoration:line-through;}
  .task-title:hover{text-decoration:underline;}
  .task-meta{display:flex;align-items:center;justify-content:space-between;}
  .task-meta .left{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;}
  .task-meta .left span{display:flex;align-items:center;gap:4px;}
  .task-meta svg{width:13px;height:13px;}
  .task-meta .due{font-family:"IBM Plex Mono",monospace;}
  .task-meta .due.urgent{color:var(--danger);font-weight:600;}
  .progress-bar{height:5px;background:var(--paper);border-radius:4px;overflow:hidden;}
  .progress-bar span{display:block;height:100%;background:var(--green-bright);}
  .add-card{display:flex;align-items:center;gap:6px;justify-content:center;padding:10px;border-radius:12px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;}
  .add-card svg{width:14px;height:14px;}
  .complete-btn{font-size:11.5px;color:var(--green);background:none;border:none;text-align:inherit;font-weight:600;padding:0;}

  .list-row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--border);cursor:pointer;}
  .list-row:last-child{border-bottom:none;}
  .list-row:hover{background:var(--paper);}
  .list-row .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .list-row .title{flex:1;font-size:13.5px;font-weight:600;}
  .list-row .col-label{font-size:12px;color:var(--muted);width:90px;text-align:start;}

  .empty-view{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:50px;text-align:center;color:var(--muted);}
  .empty-view svg{width:30px;height:30px;color:var(--blue-light);margin-bottom:10px;}
  .empty-view b{display:block;font-family:"Almarai";font-weight:700;color:var(--ink);margin-bottom:4px;}

  .hidden{display:none !important;}

  /* ---------------- MODULE-SPECIFIC ---------------- */
  .section-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .inv-search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:8px 14px;width:240px;}
  .inv-search svg{width:16px;height:16px;color:var(--muted);}
  .inv-search input{border:none;background:transparent;outline:none;font-size:13.5px;width:100%;color:var(--ink);}

  table{width:100%;border-collapse:collapse;}
  th{text-align:start;font-size:11.5px;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em;}
  td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .qty-control{display:flex;align-items:center;gap:8px;}
  .qty-control button{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--paper);font-size:14px;line-height:1;color:var(--ink-soft);}
  .status-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;}

  .event-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .event-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;}
  .event-date-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-family:"IBM Plex Mono",monospace;color:var(--blue-light);background:var(--blue-light-tint);padding:4px 10px;border-radius:20px;width:fit-content;}
  .event-card h4{font-size:14.5px;line-height:1.5;}
  .event-meta-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}

  .budget-row{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-bottom:1px solid var(--border);}
  .budget-row:last-child{border-bottom:none;}
  .budget-row-top{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;}
  .budget-numbers{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);}
  .budget-bar{height:8px;background:var(--paper);border-radius:5px;overflow:hidden;}
  .budget-bar span{display:block;height:100%;border-radius:5px;}
  .add-expense-btn{font-size:11.5px;color:var(--blue-deep);background:var(--blue-deep-tint);border:none;padding:4px 10px;border-radius:20px;font-weight:600;}

  .campaign-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .campaign-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;}
  .impact-badge{font-size:11.5px;font-weight:700;color:var(--green);background:var(--green-tint);padding:4px 10px;border-radius:20px;width:fit-content;}
  .apply-btn{background:var(--violet);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;}
  .apply-btn.applied{background:var(--green-tint);color:var(--green);}
  .chart-bars{display:flex;align-items:flex-end;gap:14px;height:120px;padding:0 6px;}
  .chart-bars .bar-col{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;justify-content:flex-end;height:100%;}
  .chart-bars .bar{width:100%;border-radius:6px 6px 0 0;background:var(--violet);}
  .chart-bars .bar-label{font-size:11px;color:var(--muted);}

  .content-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .content-actions button{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:var(--paper);color:var(--ink-soft);}
  .content-actions button.primary{background:var(--green);color:#fff;border-color:var(--green);}
  .content-actions button.danger{background:var(--danger-tint);color:var(--danger);border-color:transparent;}

  /* analytics */
  .line-chart-wrap{width:100%;overflow:hidden;}
  .donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .donut{width:140px;height:140px;border-radius:50%;flex:none;}
  .donut-legend{display:flex;flex-direction:column;gap:8px;}
  .donut-legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
  .donut-legend-item .sw{width:10px;height:10px;border-radius:3px;flex:none;}
  .live-note{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px dashed var(--border);border-radius:12px;padding:12px 16px;font-size:12.5px;color:var(--muted);}

  /* integrations */
  .int-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .int-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;}
  .int-card-top{display:flex;align-items:center;gap:12px;}
  .int-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex:none;}
  .int-card h4{font-size:14.5px;}
  .int-card p{font-size:12px;color:var(--muted);margin:0;flex:1;}
  .int-status{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;}
  .int-status .dot{width:7px;height:7px;border-radius:50%;}
  .int-card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
  .security-banner{display:flex;gap:12px;background:var(--blue-tint);border:1px solid var(--blue-light);border-radius:14px;padding:14px 18px;font-size:12.5px;color:var(--ink);line-height:1.7;}
  .security-banner svg{flex:none;width:20px;height:20px;color:var(--blue-deep);margin-top:2px;}

  /* team & billing */
  .role-pill{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .bplan-toggle{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--border);border-radius:24px;padding:4px;margin-bottom:26px;}
  .bplan-toggle button{border:none;background:transparent;padding:8px 16px;border-radius:20px;font-size:12.5px;font-weight:700;color:var(--muted);}
  .bplan-toggle button.active{background:var(--green);color:#fff;}
  .bplan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .bplan-card{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:24px;display:flex;flex-direction:column;position:relative;}
  .bplan-card.current{border-color:var(--green);}
  .bplan-badge-current{position:absolute;top:-12px;inset-inline-start:20px;background:var(--green);color:#fff;font-size:10.5px;font-weight:700;padding:4px 11px;border-radius:20px;}
  .bplan-name{font-size:15px;font-weight:800;font-family:"Almarai";margin-bottom:4px;}
  .bplan-desc{font-size:12px;color:var(--muted);margin-bottom:16px;min-height:32px;}
  .bplan-price{font-size:26px;font-weight:800;font-family:"Almarai";margin-bottom:2px;}
  .bplan-price .unit{font-size:12px;font-weight:500;color:var(--muted);}
  .bplan-features{display:flex;flex-direction:column;gap:9px;margin:16px 0 20px;flex:1;}
  .bplan-features li{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink-soft);list-style:none;}
  .bplan-features svg{width:14px;height:14px;color:var(--green);flex:none;margin-top:2px;}
  .lock-circle{width:46px;height:46px;border-radius:14px;background:var(--amber-tint);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}

  /* ---------------- MODALS / DROPDOWNS ---------------- */
  .overlay{position:fixed;inset:0;background:rgba(20,30,20,.32);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--card);border-radius:16px;padding:24px;width:380px;max-width:90vw;box-shadow:0 24px 60px rgba(20,30,20,.25);max-height:86vh;overflow-y:auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .modal-head h3{font-size:17px;}
  .modal-close{background:none;border:none;color:var(--ink);}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .field input, .field select{border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13.5px;outline:none;color:var(--ink);background:var(--paper);}
  .submit-btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .detail-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);margin-bottom:10px;}
  .detail-row b{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:6px;}

  .dropdown{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 28px rgba(20,30,20,.14);padding:6px;z-index:20;min-width:160px;}
  .dropdown button{display:block;width:100%;text-align:inherit;padding:7px 10px;border-radius:6px;border:none;background:none;font-size:13px;color:var(--ink);}
  .dropdown button:hover{background:var(--paper);}
  .notif-item{padding:10px;border-radius:8px;}
  .notif-item .txt{font-size:13px;}
  .notif-item .time{font-size:11px;color:var(--muted);margin-top:2px;}

  .theme-panel{padding:14px;width:220px;}
  .theme-panel .section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-family:"IBM Plex Mono",monospace;}
  .swatch-row{display:flex;gap:10px;margin-bottom:16px;}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;}
  .swatch.active{border-color:var(--ink);}
  .mode-toggle{display:flex;background:var(--paper);border:1px solid var(--border);border-radius:9px;padding:3px;}
  .mode-toggle button{flex:1;padding:7px 0;border:none;background:transparent;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;}
  .mode-toggle button.active{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);}

  input[type=range]{accent-color:var(--blue-deep);width:100%;margin-top:8px;}


  /* ---------------- TASKY TYPOGRAPHY & SIDEBAR POLISH (V7) ---------------- */
  :root{
    --font-ar-body:"IBM Plex Sans Arabic",sans-serif;
    --font-ar-display:"Almarai",sans-serif;
    --font-en-ui:"Inter",sans-serif;
  }

  /* Compact primary action in the sidebar */
  .sidebar .new-task-btn{
    align-self:flex-start;
    width:auto;
    min-width:126px;
    min-height:38px;
    padding:7px 13px;
    gap:7px;
    border-radius:9px;
    font-size:13px;
    font-weight:700;
    line-height:1.35;
    box-shadow:none;
  }
  .sidebar .new-task-btn svg{width:14px;height:14px;flex:none;}

  /* Arabic hierarchy mirrors the cleaner Billing / Plans typography */
  html[dir="rtl"] body,
  html[dir="rtl"] button,
  html[dir="rtl"] input,
  html[dir="rtl"] select,
  html[dir="rtl"] textarea,
  html[dir="rtl"] table{
    font-family:var(--font-ar-body);
  }

  html[dir="rtl"] h1,
  html[dir="rtl"] h2,
  html[dir="rtl"] h3,
  html[dir="rtl"] h4,
  html[dir="rtl"] .brand .name,
  html[dir="rtl"] .breadcrumb b,
  html[dir="rtl"] .stat-card .value,
  html[dir="rtl"] .bplan-name,
  html[dir="rtl"] .bplan-price,
  html[dir="rtl"] .modal-head h3,
  html[dir="rtl"] .empty-view b{
    font-family:var(--font-ar-display) !important;
    letter-spacing:0;
  }

  /* Remove the technical mono look from normal product UI text */
  html[dir="rtl"] .nav-group-label,
  html[dir="rtl"] .nav-label,
  html[dir="rtl"] .projects-inline-head,
  html[dir="rtl"] .theme-panel .section-label,
  html[dir="rtl"] .stat-card .trend,
  html[dir="rtl"] .column-head .count,
  html[dir="rtl"] .task-meta .due,
  html[dir="rtl"] .event-date-badge,
  html[dir="rtl"] .budget-numbers,
  html[dir="rtl"] [style*="IBM Plex Mono"]{
    font-family:var(--font-ar-body) !important;
    letter-spacing:0;
  }

  html[dir="rtl"] .nav-group-label,
  html[dir="rtl"] .nav-label,
  html[dir="rtl"] .projects-inline-head,
  html[dir="rtl"] .theme-panel .section-label{
    text-transform:none;
    letter-spacing:0;
    font-weight:500;
  }

  /* Consistent weights across the application */
  html[dir="rtl"] .nav-item,
  html[dir="rtl"] .project-item,
  html[dir="rtl"] .task-title,
  html[dir="rtl"] td,
  html[dir="rtl"] .field,
  html[dir="rtl"] .bplan-features li{font-weight:400;}

  html[dir="rtl"] .nav-item.active,
  html[dir="rtl"] .primary-btn,
  html[dir="rtl"] .submit-btn,
  html[dir="rtl"] .new-task-btn,
  html[dir="rtl"] .view-tab.active,
  html[dir="rtl"] .chip-btn.on{font-weight:700;}

  /* Keep English consistently in Inter, including metadata that used Mono */
  html[dir="ltr"] body,
  html[dir="ltr"] button,
  html[dir="ltr"] input,
  html[dir="ltr"] select,
  html[dir="ltr"] textarea,
  html[dir="ltr"] table,
  html[dir="ltr"] .nav-group-label,
  html[dir="ltr"] .nav-label,
  html[dir="ltr"] .projects-inline-head,
  html[dir="ltr"] .theme-panel .section-label,
  html[dir="ltr"] .stat-card .trend,
  html[dir="ltr"] .column-head .count,
  html[dir="ltr"] .task-meta .due,
  html[dir="ltr"] .event-date-badge,
  html[dir="ltr"] .budget-numbers,
  html[dir="ltr"] [style*="IBM Plex Mono"]{
    font-family:var(--font-en-ui) !important;
  }

  /* ---------------- LOCKED TOPBAR GEOMETRY (V9) ---------------- */
  /*
     The breadcrumb gets a fixed slot and may only truncate — never wrap.
     The action controls keep fixed heights/widths. The search field is the
     only control allowed to shrink, so navigating between modules cannot
     change the header geometry.
  */
  .topbar{
    height:68px;
    min-height:68px;
    max-height:68px;
    padding:0 16px;
    gap:10px;
    overflow:hidden;
  }

  .breadcrumb{
    flex:0 0 155px;
    width:155px;
    min-width:155px;
    max-width:155px;
    height:40px;
    display:grid;
    grid-template-columns:auto auto minmax(0,1fr);
    align-items:center;
    gap:7px;
    overflow:hidden;
    white-space:nowrap;
  }
  .breadcrumb > span{
    min-width:0;
    white-space:nowrap;
    flex:none;
  }
  .breadcrumb b{
    display:block;
    min-width:0;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap !important;
    line-height:1.35;
  }

  .topbar-right{
    flex:1 1 auto;
    min-width:0;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    flex-wrap:nowrap !important;
    gap:8px;
    overflow:visible;
  }

  .topbar .search-box{
    flex:1 1 220px;
    width:auto;
    min-width:180px;
    max-width:240px;
    height:40px;
    min-height:40px;
    max-height:40px;
    padding:0 12px;
    flex-wrap:nowrap;
  }
  .topbar .search-box input{
    min-width:0;
    white-space:nowrap;
  }

  .topbar .icon-btn{
    flex:0 0 38px;
    width:38px;
    min-width:38px;
    max-width:38px;
    height:40px;
    min-height:40px;
    max-height:40px;
  }

  .topbar .lang-btn{
    flex:0 0 44px;
    width:44px;
    min-width:44px;
    max-width:44px;
    height:40px;
    min-height:40px;
    max-height:40px;
    padding:0;
    justify-content:center;
    white-space:nowrap;
  }

  .topbar .primary-btn{
    flex:0 0 116px;
    width:116px;
    min-width:116px;
    max-width:116px;
    height:40px;
    min-height:40px;
    max-height:40px;
    padding:0 11px;
    justify-content:center;
    flex-wrap:nowrap !important;
    white-space:nowrap !important;
    line-height:1;
    overflow:hidden;
  }
  .topbar .primary-btn svg{flex:0 0 15px;}
  .topbar .primary-btn span{
    display:block;
    min-width:0;
    white-space:nowrap !important;
    overflow:hidden;
    text-overflow:clip;
  }

  /* Sidebar task action keeps one invariant footprint as well. */
  .sidebar .new-task-btn{
    width:100%;
    height:40px;
    min-height:40px;
    max-height:40px;
    padding:0 12px;
    flex-wrap:nowrap !important;
    white-space:nowrap !important;
  }
  .sidebar .new-task-btn span{white-space:nowrap !important;}

  /* At narrower main-content widths, only the search/breadcrumb slots contract. */
  @media(max-width:900px){
    .breadcrumb{
      flex-basis:135px;
      width:135px;
      min-width:135px;
      max-width:135px;
    }
    .topbar .search-box{
      min-width:160px;
      max-width:200px;
      flex-basis:190px;
    }
  }

  @media(max-width:760px){
    .topbar{padding-inline:12px;gap:8px;}
    .breadcrumb{
      flex-basis:115px;
      width:115px;
      min-width:115px;
      max-width:115px;
      gap:5px;
    }
    .topbar .search-box{
      min-width:145px;
      max-width:180px;
      flex-basis:170px;
    }
    .topbar .primary-btn{
      flex-basis:110px;
      width:110px;
      min-width:110px;
      max-width:110px;
    }
  }

  @media(max-width:650px){
    .breadcrumb{
      flex-basis:88px;
      width:88px;
      min-width:88px;
      max-width:88px;
      grid-template-columns:minmax(0,1fr);
    }
    .breadcrumb > span{display:none;}
    .topbar .search-box{
      min-width:130px;
      max-width:155px;
      flex-basis:145px;
    }
    .topbar .primary-btn{
      flex-basis:104px;
      width:104px;
      min-width:104px;
      max-width:104px;
      font-size:12.5px;
      padding-inline:8px;
    }
  }

  @media(max-width:1100px){
    .event-grid{grid-template-columns:repeat(2,1fr);}
    .campaign-grid{grid-template-columns:1fr;}
  }
</style>

<div id="authScreen" style="position:fixed;inset:0;background:var(--paper);z-index:200;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans Arabic',sans-serif;">
  <div style="width:360px;max-width:90vw;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;text-align:center;">
    <h2 style="font-family:'Almarai';font-size:20px;margin-bottom:6px;">تاسكي</h2>

    <div id="authError" style="display:none;background:var(--danger-tint);color:var(--danger);font-size:12.5px;padding:10px;border-radius:8px;margin-bottom:14px;text-align:right;"></div>
    <div id="signupOnlyFields" style="display:none;">

      <input id="authCompany" placeholder="اسم شركتك أو فريقك" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;margin-bottom:10px;font-size:14px;box-sizing:border-box;">
    </div>
    <input id="authEmail" type="email" placeholder="البريد الإلكتروني" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;margin-bottom:10px;font-size:14px;box-sizing:border-box;">
    <input id="authPassword" type="password" placeholder="كلمة المرور" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;margin-bottom:16px;font-size:14px;box-sizing:border-box;">

    </div>
  </div>
</div>

<!-- Invite acceptance: invited users set their password after opening the email link -->
<div id="inviteSetupScreen" style="position:fixed;inset:0;background:rgba(18,41,26,.88);z-index:260;display:none;align-items:center;justify-content:center;font-family:'IBM Plex Sans Arabic',sans-serif;">
  <div style="width:380px;max-width:90vw;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.22);">
    <div style="width:48px;height:48px;border-radius:14px;background:var(--green-tint);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:24px;font-weight:800;">✓</div>
    <h2 style="font-family:'Almarai';font-size:19px;margin-bottom:7px;">مرحبًا بك في تاسكي</h2>

    <div id="inviteSetupError" style="display:none;background:var(--danger-tint);color:var(--danger);font-size:12.5px;padding:10px;border-radius:8px;margin-bottom:12px;text-align:right;"></div>

    <button id="inviteSetupBtn" onclick="finishInviteSetup()" style="width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;">تفعيل الحساب والدخول</button>
  </div>
</div>

<script>
// Tasky V6 — strict invite setup + database-enforced UI roles
const sb = window.supabase.createClient('https://ghzgmrnqididkmocuzrf.supabase.co', 'sb_publishable_Buo2ZaOvpcmeiot45B4g-w_C6lYza6A');

let authMode = 'signin';
let currentWorkspaceId = null;
let currentWorkspaceName = null;
let currentUserId = null;
let projects = [];
let activeProjectId = null;

async function loadWorkspaceAndData(authoritativeUser = null){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return false;

  const user = authoritativeUser || session.user;
  if(!user) return false;

  // Never activate invitations here. An invited user must finish password setup first.
  // Also prefer the workspace carried by the invite metadata when it exists.
  const preferredWorkspaceId = user.user_metadata?.tasky_workspace_id || null;

  let membershipQuery = sb
    .from('workspace_members')
    .select('workspace_id, role, status, workspaces(name)')
    .eq('user_id', user.id)
    .eq('status', 'active');

  if(preferredWorkspaceId){
    membershipQuery = membershipQuery.eq('workspace_id', preferredWorkspaceId);
  }

  let { data: member, error } = await membershipQuery
    .limit(1)
    .maybeSingle();

  // Fallback for normal users who may later belong to multiple workspaces and
  // whose old invite metadata no longer points to a current workspace.
  if(!member && preferredWorkspaceId && !error){
    const fallback = await sb
      .from('workspace_members')
      .select('workspace_id, role, status, workspaces(name)')
      .eq('user_id', user.id)
      .eq('status', 'active')
      .limit(1)
      .maybeSingle();
    member = fallback.data;
    error = fallback.error;
  }

  if(error || !member){
    console.error('تعذّر إيجاد عضوية نشطة لهذا الحساب', error);
    currentUserId = null;
    currentWorkspaceId = null;
    currentWorkspaceName = null;
    currentUserRole = null;
    renderRoleToggle();
    renderNav();
    return false;
  }

  currentUserId = user.id;
  currentWorkspaceId = member.workspace_id;
  currentUserRole = member.role === 'admin' ? 'admin' : 'member';
  currentWorkspaceName = member.workspaces ? member.workspaces.name : null;

  const wsLabel = document.getElementById('workspaceLabel');
  if(wsLabel && currentWorkspaceName) wsLabel.textContent = currentWorkspaceName;

  await fetchProjects();
  await fetchTeamMembers();
  await fetchTasks();
  applyCurrentUserProfile();
  renderTeamAvatarStack();
  renderRoleToggle();
  renderNav();
  renderAll();
  return true;
}

async function fetchProjects(){
  if(!currentWorkspaceId) return;
  const { data, error } = await sb
    .from('projects')
    .select('id, workspace_id, name, description, status, position, created_by, created_at, updated_at')
    .eq('workspace_id', currentWorkspaceId)
    .eq('status', 'active')
    .order('position', { ascending: true })
    .order('created_at', { ascending: true });
  if(error){ console.error('تعذّر تحميل المشاريع', error); projects = []; activeProjectId = null; return; }
  projects = data || [];
  if(!projects.some(p => p.id === activeProjectId)) activeProjectId = projects[0]?.id || null;
}

async function fetchTasks(){
  if(!currentWorkspaceId) return;
  const { data, error } = await sb
    .from('tasks')
    .select('*')
    .eq('workspace_id', currentWorkspaceId)
    .order('created_at', { ascending: true });
  if(error){ console.error('تعذّر تحميل المهام', error); return; }
  tasks = data.map(row => {
    const member = teamMembers.find(m => m.userId && m.userId === row.assignee_id);
    return {
      id: row.id,
      projectId: row.project_id,
      col: row.col,
      tag: row.tag,
      ar: row.title_ar,
      en: row.title_en,
      due_ar: row.due_ar || row.due_date || null,
      due_en: row.due_en || row.due_date || null,
      overdue: row.overdue,
      assigneeId: row.assignee_id || null,
      assignee: member?.initials || row.assignee_initials || '؟',
      assigneeName: member?.fullName || row.assignee_initials || (lang==='ar' ? 'غير مسندة' : 'Unassigned'),
      assigneeColor: member?.color || row.assignee_color || 'var(--blue)',
      comments: row.comments_count || 0,
      subtasks: (row.subtasks_done != null && row.subtasks_total != null) ? [row.subtasks_done, row.subtasks_total] : null,
    };
  });
}

function toggleAuthMode(){
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  document.getElementById('signupOnlyFields').style.display = authMode==='signup' ? 'block' : 'none';
  document.getElementById('authSubmitBtn').textContent = authMode==='signup' ? 'إنشاء الحساب' : 'تسجيل الدخول';
  document.getElementById('authToggleText').textContent = authMode==='signup' ? 'عندك حساب؟' : 'ما عندك حساب؟';
  document.getElementById('authToggleBtn').textContent = authMode==='signup' ? 'تسجيل الدخول' : 'إنشاء حساب جديد';
  document.getElementById('authError').style.display='none';
}
async function createWorkspaceForNewUser(userId, companyName, email){
  const slug = companyName.trim().toLowerCase().replace(/\s+/g,'-') + '-' + Date.now().toString(36);
  const { data: ws, error: wsError } = await sb.from('workspaces').insert({ name: companyName, slug, plan_id: 'free' }).select().single();
  if(wsError){ console.error(wsError); return; }
  await sb.from('workspace_members').insert({ workspace_id: ws.id, user_id: userId, role: 'admin', status: 'active', joined_at: new Date().toISOString(), invited_email: email });
  const { error: projectError } = await sb.from('projects').insert({ workspace_id: ws.id, name: 'المهام العامة', position: 0 });
  if(projectError) console.warn('تعذّر إنشاء المشروع الافتراضي', projectError);
}
async function claimPendingInvite(userId, email){
  // V5: secure SECURITY DEFINER RPC verifies auth.uid() + authenticated email server-side.
  // userId/email parameters are kept only so older call sites do not need special handling.
  const { data, error } = await sb.rpc('accept_my_pending_invites');
  if(error){
    console.warn('تعذّر قبول الدعوة تلقائيًا', error);
    return false;
  }
  return Number(data || 0) > 0;
}

function inviteLinkMarkerPresent(){
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const search = new URLSearchParams(window.location.search);
  return hash.get('type') === 'invite' || search.get('type') === 'invite';
}

async function getAuthoritativeInviteState(session){
  const { data: { user }, error } = await sb.auth.getUser();
  const resolvedUser = (!error && user) ? user : session?.user || null;
  const meta = resolvedUser?.user_metadata || {};
  return {
    user: resolvedUser,
    invited: meta.tasky_invited === true || inviteLinkMarkerPresent(),
    workspaceId: meta.tasky_workspace_id || null
  };
}

function showInviteSetup(show){
  const overlay = document.getElementById('inviteSetupScreen');
  if(overlay) overlay.style.display = show ? 'flex' : 'none';
}

async function hasActiveMembershipForInvite(user){
  if(!user) return false;
  const workspaceId = user.user_metadata?.tasky_workspace_id || null;
  let q = sb
    .from('workspace_members')
    .select('id')
    .eq('user_id', user.id)
    .eq('status', 'active');
  if(workspaceId) q = q.eq('workspace_id', workspaceId);
  const { data, error } = await q.limit(1).maybeSingle();
  return !error && !!data;
}

async function finishInviteSetup(){
  const password = document.getElementById('inviteNewPassword').value;
  const confirmPassword = document.getElementById('inviteConfirmPassword').value;
  const errBox = document.getElementById('inviteSetupError');
  const btn = document.getElementById('inviteSetupBtn');
  errBox.style.display = 'none';

  if(password.length < 8){
    errBox.textContent = 'كلمة المرور لازم تكون 8 أحرف على الأقل.';
    errBox.style.display = 'block';
    return;
  }
  if(password !== confirmPassword){
    errBox.textContent = 'كلمتا المرور غير متطابقتين.';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جاري التفعيل...';

  // Step 1: set the password while the account is still marked as invited.
  const { error: passwordError } = await sb.auth.updateUser({ password });
  if(passwordError){
    errBox.textContent = passwordError.message || 'تعذّر حفظ كلمة المرور.';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'تفعيل الحساب والدخول';
    return;
  }

  // Step 2: only after a password exists, activate the pending workspace membership.
  const claimed = await claimPendingInvite();
  const { data: { user: verifiedUser } } = await sb.auth.getUser();
  const alreadyActive = await hasActiveMembershipForInvite(verifiedUser);

  if(!claimed && !alreadyActive){
    errBox.textContent = 'تم حفظ كلمة المرور، لكن تعذّر تفعيل عضوية الفريق. أعد فتح رابط الدعوة أو تواصل مع مسؤول مساحة العمل.';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'إعادة محاولة التفعيل';
    return;
  }

  // Step 3: clear the invite flag only after membership activation succeeds.
  const currentMeta = verifiedUser?.user_metadata || {};
  const { error: metadataError } = await sb.auth.updateUser({
    data: {
      ...currentMeta,
      tasky_invited: false,
      tasky_invite_completed_at: new Date().toISOString()
    }
  });

  if(metadataError){
    console.warn('تم التفعيل لكن تعذّر تحديث علامة الدعوة', metadataError);
  }

  // Remove invite tokens/type markers from the address bar after Supabase has persisted the session.
  try{
    window.history.replaceState({}, document.title, window.location.pathname);
  }catch(_){}

  document.getElementById('inviteNewPassword').value = '';
  document.getElementById('inviteConfirmPassword').value = '';
  showInviteSetup(false);
  btn.disabled = false;
  btn.textContent = 'تفعيل الحساب والدخول';
  await checkSession();
}

async function handleAuthSubmit(){
  const email = document.getElementById('authEmail').value.trim().toLowerCase();
  const password = document.getElementById('authPassword').value;
  const errBox = document.getElementById('authError');
  errBox.style.display = 'none';
  if(!email || !password){ errBox.textContent = 'عبّي البريد وكلمة المرور'; errBox.style.display='block'; return; }
  if(authMode === 'signup'){
    const fullName = document.getElementById('authFullName').value.trim();
    const company = document.getElementById('authCompany').value.trim();
    if(!fullName){ errBox.textContent = 'اكتب اسمك الكامل'; errBox.style.display='block'; return; }
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
    if(error){ errBox.textContent = error.message; errBox.style.display='block'; return; }
    if(data.user){
      const claimed = await claimPendingInvite(data.user.id, email);
      if(!claimed){
        if(!company){ errBox.textContent = 'اكتب اسم شركتك أو فريقك (ما فيه دعوة معلّقة لهذا البريد)'; errBox.style.display='block'; return; }
        await createWorkspaceForNewUser(data.user.id, company, email);
      }
    }
    alert('تم إنشاء الحساب! تحقق من بريدك لو طلب منك تفعيل الحساب.');
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ errBox.textContent = error.message; errBox.style.display='block'; return; }
  }
  checkSession();
}
async function signOutUser(){
  await sb.auth.signOut();
  currentWorkspaceId = null;
  currentUserId = null;
  currentUserRole = null;
  projects = [];
  activeProjectId = null;
  tasks = [];
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  const fullNameInput = document.getElementById('authFullName');
  if(fullNameInput) fullNameInput.value = '';
  checkSession();
}

async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  const appEl = document.querySelector('.app');
  const authScreen = document.getElementById('authScreen');

  if(!session || !session.user){
    currentUserId = null;
    currentWorkspaceId = null;
    currentWorkspaceName = null;
    currentUserRole = null;
    authScreen.style.display = 'flex';
    appEl.style.display = 'none';
    showInviteSetup(false);
    renderRoleToggle();
    renderNav();
    return;
  }

  // Do not expose the application until invite setup and membership resolution are complete.
  authScreen.style.display = 'none';
  appEl.style.display = 'none';

  const inviteState = await getAuthoritativeInviteState(session);
  if(inviteState.invited){
    showInviteSetup(true);
    return;
  }

  showInviteSetup(false);
  const loaded = await loadWorkspaceAndData(inviteState.user);
  if(loaded){
    appEl.style.display = 'flex';
    return;
  }

  // A valid Auth session without an active Tasky membership must never fall back to admin UI.
  await sb.auth.signOut();
  authScreen.style.display = 'flex';
  appEl.style.display = 'none';
  const errBox = document.getElementById('authError');
  if(errBox){
    errBox.textContent = 'هذا الحساب لا يملك عضوية نشطة في مساحة عمل تاسكي.';
    errBox.style.display = 'block';
  }
}

let teamMembers = []; // تُعبّى فعليًا من قاعدة البيانات + profiles
const MEMBER_COLORS = ['var(--blue)','var(--teal)','var(--violet)','var(--blue-light)','var(--amber)','var(--green)'];

function initialsFromName(name, email){
  const clean = (name || '').trim();
  if(clean){
    const parts = clean.split(/\s+/).filter(Boolean);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length-1].charAt(0)).toUpperCase();
  }
  return (email || '؟؟').slice(0,2).toUpperCase();
}

async function fetchTeamMembers(){
  if(!currentWorkspaceId) return;
  const { data, error } = await sb
    .from('workspace_members')
    .select('id, user_id, role, status, invited_name, invited_email, invited_by, invited_at, joined_at')
    .eq('workspace_id', currentWorkspaceId)
    .order('invited_at', { ascending: true });
  if(error){ console.error('تعذّر تحميل أعضاء الفريق', error); return; }

  const memberships = data || [];
  const userIds = [...new Set(
    memberships.flatMap(r => [r.user_id, r.invited_by]).filter(Boolean)
  )];
  let profilesById = {};

  if(userIds.length){
    const { data: profileRows, error: profileError } = await sb
      .from('profiles')
      .select('id, full_name, job_title, avatar_url')
      .in('id', userIds);
    if(profileError) console.error('تعذّر تحميل ملفات أعضاء الفريق', profileError);
    profilesById = Object.fromEntries((profileRows || []).map(p => [p.id, p]));
  }

  teamMembers = memberships.map((row, i) => {
    const email = row.invited_email || '—';
    const profile = row.user_id ? profilesById[row.user_id] : null;
    const fullName = profile?.full_name || row.invited_name || email;
    const inviter = row.invited_by ? profilesById[row.invited_by] : null;
    return {
      id: row.id,
      userId: row.user_id || null,
      email,
      fullName,
      invitedName: row.invited_name || null,
      invitedBy: row.invited_by || null,
      invitedByName: inviter?.full_name || null,
      invitedAt: row.invited_at || null,
      joinedAt: row.joined_at || null,
      jobTitle: profile?.job_title || null,
      avatarUrl: profile?.avatar_url || null,
      role: row.role,
      status: row.status,
      color: MEMBER_COLORS[i % MEMBER_COLORS.length],
      initials: initialsFromName(fullName, email)
    };
  });
}

function applyCurrentUserProfile(){
  const me = teamMembers.find(m => m.userId === currentUserId);
  if(!me) return;
  const nameEl = document.getElementById('userName');
  const roleEl = document.getElementById('userRole');
  const avatarEl = document.querySelector('.sidebar-bottom .avatar');
  if(nameEl) nameEl.textContent = me.fullName || me.email;
  if(roleEl) roleEl.textContent = me.jobTitle || (me.role === 'admin' ? t('role_admin') : t('role_member'));
  if(avatarEl){ avatarEl.textContent = me.initials; avatarEl.style.background = me.color; }
}

function renderTeamAvatarStack(){
  const stack = document.getElementById('teamAvatarStack');
  if(!stack) return;
  const active = teamMembers.filter(m => m.status==='active').slice(0,4);
  stack.innerHTML = active.map(m => avatarHtml(m.initials, m.color, 28)).join('');
}

function assignableMembers(){
  return teamMembers.filter(m => m.status === 'active' && m.userId);
}

function avatarHtml(initials,color,size){

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

function visibleTasks(){
  let list = tasks.filter(x =>
    (!activeProjectId || x.projectId === activeProjectId) &&
    (!query || (lang==='en'?x.en:x.ar).toLowerCase().includes(query.toLowerCase())) &&
    (!filterTag || x.tag === filterTag)
  );
  if (urgentFirst) list = [...list].sort((a,b) => (b.overdue?1:0) - (a.overdue?1:0));
  return list;
}

/* ================= THEME ================= */
function applyTheme(){
  const th = THEMES[themeName];
  document.documentElement.style.setProperty('--green', th.primary);
  document.documentElement.style.setProperty('--green-bright', th.bright);
  document.body.classList.toggle('dark', darkMode);
}
function setTheme(name){ themeName = name; applyTheme(); renderThemePanel(); }
function setMode(dark){ darkMode = dark; applyTheme(); renderThemePanel(); }
function toggleThemePanel(){
  const dd = document.getElementById('themeDropdown');
  renderThemePanel();
  dd.classList.toggle('hidden');
}
function renderThemePanel(){
  const dd = document.getElementById('themeDropdown');
  dd.innerHTML = `
    <div class="section-label">${t('themeAccent')}</div>
    <div class="swatch-row">
      ${Object.entries(THEMES).map(([id,th]) => `<div class="swatch ${themeName===id?'active':''}" style="background:${th.primary}" onclick="setTheme('${id}')" title="${lang==='ar'?th.label_ar:th.label_en}"></div>`).join('')}
    </div>
    <div class="section-label">${t('themeMode')}</div>
    <div class="mode-toggle">
      <button class="${!darkMode?'active':''}" onclick="setMode(false)"><svg style="width:14px;height:14px"><use href="#i-sun"/></svg>${t('modeLight')}</button>
      <button class="${darkMode?'active':''}" onclick="setMode(true)"><svg style="width:14px;height:14px"><use href="#i-moon"/></svg>${t('modeDark')}</button>

}

/* ================= SIDEBAR NAV ================= */
function renderNav(){
  const nav = document.getElementById('mainNav');
  let lastGroup = null;
  const visibleItems = NAV_ITEMS.filter(item => !item.adminOnly || currentUserRole === 'admin');

  const projectColors = ['var(--blue)','var(--teal)','var(--green)','var(--blue-deep)','var(--violet)','var(--amber)'];
  const projectRows = projects.map((p, i) => `
    <a class="project-item ${activeProjectId===p.id?'active':''}" onclick="setActiveProject('${p.id}')">
      <span class="dot" style="background:${projectColors[i % projectColors.length]}"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(p.name)}</span>
    </a>`).join('');

  const addProjectLabel = lang==='ar' ? 'مشروع جديد' : 'New project';
  const noProjectsLabel = lang==='ar' ? 'لا توجد مشاريع بعد' : 'No projects yet';
  const projectsBlock = `
    <div class="projects-inline-wrap">
      <div class="projects-inline-head">
        <span>${t('projectsLabel')}</span>
        <button type="button" class="projects-inline-plus" onclick="openProjectModal()" title="${addProjectLabel}">
          <svg><use href="#i-plus"/></svg>
        </button>
      </div>
      <div class="projects-list projects-inline-list">
        ${projectRows || `<div class="projects-empty">${noProjectsLabel}</div>`}
        <a class="project-item create-project-item" onclick="openProjectModal()">
          <svg style="width:15px;height:15px;flex:none"><use href="#i-plus"/></svg>${addProjectLabel}
        </a>
      </div>
    </div>`;

  nav.innerHTML = visibleItems.map(item => {
    let groupHeader = '';
    if(item.group && item.group !== lastGroup){ groupHeader = `<div class="nav-group-label">${t(item.group)}</div>`; }
    lastGroup = item.group || lastGroup;
    const gated = !!item.group && !item.adminOnly;
    const locked = gated && !planAllows(currentPlan, item.id);
    const navItem = `${groupHeader}
      <a class="nav-item ${activeNav===item.id?'active':''} ${locked?'locked':''}" onclick="${locked?`openUpgradeModal('${item.id}')`:`setActiveNav('${item.id}')`}">
        <svg><use href="#${item.icon}"/></svg>${t(item.key)}
        ${locked ? `<svg style="width:13px;height:13px;margin-inline-start:auto;opacity:.7"><use href="#i-lock"/></svg>` : (item.dot?`<span class="dot" style="background:${item.dot}"></span>`:'')}
      </a>`;
    return item.id === 'tasks' ? navItem + projectsBlock : navItem;
  }).join('');
}

/* ================= PROJECT SWITCHING ================= */
function setActiveProject(id){
  if(!projects.some(p => p.id === id)) return;
  activeProjectId = id;
  activeNav = 'tasks';
  document.getElementById('taskArea').classList.remove('hidden');
  document.getElementById('moduleArea').classList.add('hidden');
  document.getElementById('tasksOnly').classList.remove('hidden');
  document.getElementById('breadcrumbLabel').textContent = currentProject()?.name || t('nav_tasks');
  renderNav();
  renderAll();
}

/* ================= NAV / VIEW SWITCHING ================= */
function setActiveNav(id){
  const item = NAV_ITEMS.find(n=>n.id===id);
  if(item && item.adminOnly && currentUserRole !== 'admin'){ setActiveNav('tasks'); return; }
  if(item && item.group && !item.adminOnly && !planAllows(currentPlan, id)){ openUpgradeModal(id); return; }
  activeNav = id;
  renderNav();
  const isTaskish = (id==='tasks' || id==='home');
  document.getElementById('taskArea').classList.toggle('hidden', !isTaskish);
  document.getElementById('moduleArea').classList.toggle('hidden', isTaskish);
  document.getElementById('tasksOnly').classList.toggle('hidden', id!=='tasks');
  document.getElementById('breadcrumbLabel').textContent = id==='tasks' ? (currentProject()?.name || t('nav_tasks')) : t((NAV_ITEMS.find(n=>n.id===id)||{}).key || 'nav_home');
  if(!isTaskish) renderModule();
  renderAll();
}
function setActiveView(id){
  activeView = id;
  renderViewTabs();
  ['board','list','calendar','timeline'].forEach(v => document.getElementById(v+'View').classList.toggle('hidden', v!==id));
  renderAll();
}

  else if(activeNav==='comms') area.innerHTML = commsTemplate();

  else if(activeNav==='media') area.innerHTML = mediaTemplate();
  else if(activeNav==='assets') area.innerHTML = assetsTemplate();
  else if(activeNav==='reports') area.innerHTML = reportsTemplate();
  else if(activeNav==='analytics') area.innerHTML = analyticsTemplate();
  else if(activeNav==='integrations') area.innerHTML = integrationsTemplate();

/* ================= INVENTORY MODULE ================= */
function inventoryTemplate(){
  const totalItems = inventory.length;
  const lowStock = inventory.filter(i=>i.qty<=i.min).length;
  const totalValue = inventory.reduce((s,i)=>s+i.qty*i.price,0);
  const rows = inventory.filter(i=>!invQuery || L(i,'').toLowerCase().includes(invQuery.toLowerCase())).map(i => {
    const low = i.qty <= i.min;
    return `
      <tr>
        <td><b>${L(i,'')}</b><div style="font-size:11.5px;color:var(--muted)">${lang==='en'?i.branch_en:i.branch_ar}</div></td>
        <td>${lang==='en'?i.cat_en:i.cat_ar}</td>
        <td>
          <div class="qty-control">
            <button onclick="adjustQty(${i.id},-10)">−</button>
            <span style="min-width:44px;text-align:center;font-family:'IBM Plex Mono',monospace">${i.qty}</span>
            <button onclick="adjustQty(${i.id},10)">+</button>
            <span style="color:var(--muted);font-size:11.5px">${lang==='en'?i.unit_en:i.unit_ar}</span>
          </div>
        </td>
        <td><span class="status-pill" style="background:${low?'var(--danger-tint)':'var(--green-tint)'};color:${low?'var(--danger)':'var(--green)'}">${low?t('invLowPill'):t('invAvailable')}</span></td>
        <td style="font-family:'IBM Plex Mono',monospace">${fmtMoney(i.qty*i.price)}</td>
        <td>${low?`<button class="chip-btn" style="padding:6px 10px;font-size:11.5px" onclick="requestSupply(${i.id})">${t('invRequest')}</button>`:'—'}</td>
      </tr>`;
  }).join('');

  return `
    <div class="stats-row">
      <div class="stat-card"><div class="top"><span class="label">${t('invTotalItems')}</span><div class="icon" style="background:var(--teal)"><svg><use href="#i-box"/></svg></div></div><div class="value">${totalItems}</div><span class="trend" style="color:var(--muted)">${t('invAcrossBranches')}</span></div>
      <div class="stat-card"><div class="top"><span class="label">${t('invLow')}</span><div class="icon" style="background:var(--danger)"><svg><use href="#i-flag"/></svg></div></div><div class="value">${lowStock}</div><span class="trend" style="color:var(--danger)">${t('invLowTrend')}</span></div>
      <div class="stat-card"><div class="top"><span class="label">${t('invValue')}</span><div class="icon" style="background:var(--blue-deep)"><svg><use href="#i-wallet"/></svg></div></div><div class="value" style="font-size:18px">${fmtMoney(totalValue)}</div><span class="trend" style="color:var(--muted)">${t('invValueTrend')}</span></div>
      <div class="stat-card"><div class="top"><span class="label">${t('invBranches')}</span><div class="icon" style="background:var(--green)"><svg><use href="#i-map"/></svg></div></div><div class="value">4</div><span class="trend" style="color:var(--muted)">${t('invBranchesTrend')}</span></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h3 style="font-size:15px">${t('invAllItems')}</h3>
      <div class="inv-search"><svg><use href="#i-search"/></svg><input placeholder="${t('invSearchPh')}" oninput="onInvSearch(this.value)" value="${invQuery}"></div>
    </div>
    <div class="section-card">
      <table>
        <thead><tr><th>${t('invColItem')}</th><th>${t('invColCat')}</th><th>${t('invColQty')}</th><th>${t('invColStatus')}</th><th>${t('invColValue')}</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">${t('invNoResults')}</td></tr>`}</tbody>
      </table>
    </div>`;
}
function onInvSearch(v){ invQuery = v; renderModule(); }
function adjustQty(id,delta){ inventory = inventory.map(i => i.id===id ? {...i, qty: Math.max(0, i.qty+delta)} : i); renderModule(); }
function requestSupply(id){ const item = inventory.find(i=>i.id===id); alert(t('invRequestSent')(L(item,''))); }

/* ================= CONTENT / APPROVALS MODULE ================= */
function contentTemplate(){

      <div class="stat-card"><div class="top"><span class="label">${t('ctReview')}</span><div class="icon" style="background:var(--amber)"><svg><use href="#i-flag"/></svg></div></div><div class="value">${review}</div><span class="trend" style="color:var(--amber)">${t('ctReviewTrend')}</span></div>
      <div class="stat-card"><div class="top"><span class="label">${t('ctPublished')}</span><div class="icon" style="background:var(--green)"><svg><use href="#i-check"/></svg></div></div><div class="value">${published}</div><span class="trend" style="color:var(--green)">${t('ctPublishedTrend')}</span></div>
      <div class="stat-card"><div class="top"><span class="label">${t('ctAvgTime')}</span><div class="icon" style="background:var(--blue)"><svg><use href="#i-calendar"/></svg></div></div><div class="value" style="font-size:18px">${t('ctAvgTimeVal')}</div><span class="trend" style="color:var(--muted)">${t('ctAvgTimeTrend')}</span></div>
    </div>
    <div class="board">
      ${CONTENT_STAGES.map(stage => {
        const items = contentItems.filter(c=>c.stage===stage.id);
        return `
        <div class="column">
          <div class="column-head"><span class="dot" style="background:${stage.dot}"></span><h4>${t(stage.key)}</h4><span class="count">${items.length}</span></div>
          ${items.map(c => `
            <div class="task-card">
              <span class="tag" style="background:var(--paper);color:var(--muted)">${lang==='en'?c.type_en:c.type_ar}</span>
              <div class="task-title">${L(c,'')}</div>
              <div class="task-meta"><div class="left"><span>${lang==='en'?c.author_en:c.author_ar}</span></div></div>
              <div class="content-actions">${contentActionButtons(c)}</div>

        </div>`;
      }).join('')}

}
function contentActionButtons(c){
  if(c.stage==='draft') return `<button class="primary" onclick="moveContent(${c.id},'review')">${t('ctSubmit')}</button>`;

  if(c.stage==='approved') return `<button class="primary" onclick="moveContent(${c.id},'published')">${t('ctPublish')}</button>`;
  return `<span style="font-size:11.5px;color:var(--green);font-weight:700">${t('ctPublishedTag')}</span>`;

function exportDataset(key){
  const dataset = REPORT_DATASETS.find(d=>d.key===key);
  const rows = dataset.get();
  if(!rows.length){ alert('—'); return; }
  const headers = Object.keys(rows[0]);
  const csvLines = [headers.join(',')].concat(rows.map(r => headers.map(h => {
    let v = r[h]; if(v===null||v===undefined) v='';
    v = String(v).replace(/"/g,'""');
    return /[",\n]/.test(v) ? `"${v}"` : v;
  }).join(',')));
  const csv = "\uFEFF" + csvLines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `tasky-${key}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= ANALYTICS & KPIs MODULE ================= */
function buildSparkline(values, w, h, color){
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max - min) || 1;
  const step = w / (values.length - 1);
  const pts = values.map((v,i) => `${(i*step).toFixed(1)},${(h - ((v-min)/range)*h*0.85 - h*0.05).toFixed(1)}`);
  const linePath = 'M' + pts.join(' L');
  const areaPath = linePath + ` L${w},${h} L0,${h} Z`;
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
      <defs><linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${areaPath}" fill="url(#sparkFill)" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${values.map((v,i)=>`<circle cx="${(i*step).toFixed(1)}" cy="${(h - ((v-min)/range)*h*0.85 - h*0.05).toFixed(1)}" r="3" fill="${color}"/>`).join('')}
    </svg>`;
}
function buildDonut(){
  let acc = 0;
  const stops = TRAFFIC_SOURCES.map(s => {
    const start = acc, end = acc + s.value;
    acc = end;
    return `${s.color} ${start}% ${end}%`;
  }).join(', ');
  return `background:conic-gradient(${stops});`;
}

async function changeRole(id, role){

}
async function removeMember(id){
  if(currentUserRole !== 'admin') return;
  const m = teamMembers.find(x=>x.id===id);
  const label = m?.fullName || m?.email || '';
  const prompt = m?.status==='invited'
    ? (lang==='ar' ? `إلغاء دعوة ${label}؟` : `Cancel ${label}'s invite?`)
    : t('teamRemoveConfirm')(label);
  if(!confirm(prompt)) return;
  const { error } = await sb.from('workspace_members').delete().eq('id', id);
  if(error){ console.error(error); alert(lang==='ar'?'تعذّر تنفيذ العملية':'Could not complete the action'); return; }
  teamMembers = teamMembers.filter(x=>x.id!==id);
  renderModule();

  if(currentUserRole !== 'admin') return;
  const plan = PLANS[currentPlan];
  const reservedSeats = teamMembers.filter(m=>m.status==='active' || m.status==='invited').length;

  document.getElementById('addModalBody').innerHTML = `
    <div class="modal-head"><h3>${t('modalInvite')}</h3><button class="modal-close" onclick="closeAddModal()"><svg style="width:18px;height:18px"><use href="#i-x"/></svg></button></div>
    <form onsubmit="submitInvite(event)">
      <div class="field"><label>${t('fieldInviteName')}</label><input id="inviteName" required placeholder="${t('fieldInviteNamePh')}"></div>
      <div class="field"><label>${t('fieldInviteEmail')}</label><input id="inviteEmail" type="email" required placeholder="${t('fieldInviteEmailPh')}"></div>

      <p style="font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:-6px;">${lang==='ar' ? 'سيتم إرسال رابط دعوة حقيقي إلى البريد. بعد فتح الرابط يختار العضو كلمة مرور ثم تُفعّل عضويته تلقائيًا.' : 'A real invitation link will be emailed. After opening it, the member sets a password and the membership activates automatically.'}</p>
      ${window.location.protocol==='file:' ? `<div style="font-size:11.5px;background:var(--amber-tint);color:#7A5B16;border-radius:8px;padding:9px 10px;line-height:1.6;margin-bottom:12px;">${lang==='ar'?'أنت فاتح تاسكي كملف محلي. للاختبار الكامل شغّل V5 عبر localhost واضبط Redirect URL في Supabase.':'You are opening Tasky as a local file. For the full test, serve V5 on localhost and add that Redirect URL in Supabase.'}</div>` : ''}
      <button type="submit" class="submit-btn"><svg style="width:15px;height:15px"><use href="#i-user-plus"/></svg> ${t('submitInvite')}</button>
    </form>`;
  document.getElementById('addModalOverlay').classList.remove('hidden');
}
async function submitInvite(e){
  e.preventDefault();
  if(currentUserRole !== 'admin') return;
  const name = document.getElementById('inviteName').value.trim();
  const email = document.getElementById('inviteEmail').value.trim().toLowerCase();
  const role = document.getElementById('inviteRole').value;
  if(!name || !email) return;

  const duplicate = teamMembers.some(m => (m.email || '').toLowerCase() === email);
  if(duplicate){
    alert(lang==='ar' ? 'هذا البريد موجود في الفريق أو لديه دعوة معلّقة بالفعل.' : 'This email is already on the team or has a pending invite.');
    return;
  }

  const btn = e.submitter || document.querySelector('#addModalBody .submit-btn');
  if(btn){ btn.disabled = true; btn.textContent = lang==='ar' ? 'جاري إرسال الدعوة...' : 'Sending invite...'; }

  const redirectTo = /^https?:$/.test(window.location.protocol)
    ? `${window.location.origin}${window.location.pathname}`
    : null;

  const { data, error } = await sb.functions.invoke('invite-member', {
    body: {
      workspaceId: currentWorkspaceId,
      name,
      email,
      role,
      redirectTo
    }
  });

  if(error || !data?.ok){
    console.error('تعذّر إرسال الدعوة', error, data);
    const code = data?.error;
    let message = lang==='ar' ? 'تعذّر إرسال الدعوة. راجع إعداد Edge Function وحاول مرة ثانية.' : 'Could not send the invitation. Check the Edge Function and try again.';
    if(code === 'SEAT_LIMIT_REACHED') message = t('seatsLimitReached');
    if(code === 'ALREADY_INVITED_OR_MEMBER') message = lang==='ar' ? 'هذا البريد عضو أو لديه دعوة معلّقة بالفعل.' : 'This email is already a member or has a pending invite.';
    if(code === 'AUTH_INVITE_FAILED' && data?.detail) message = `${message}
${data.detail}`;
    alert(message);
    if(btn){ btn.disabled = false; btn.textContent = t('submitInvite'); }
    return;
  }

  closeAddModal();
  await fetchTeamMembers();
  renderModule();
  alert(lang==='ar'
    ? `تم إرسال الدعوة إلى ${email} ✅`
    : `Invitation sent to ${email} ✅`);
}

    </div>
    <h3 style="font-size:18px;margin:10px 0 16px;${x.col==='done'?'text-decoration:line-through':''}">${taskTitle(x)}</h3>
    <div class="detail-row"><span>${t('detailAssignee')}</span><b>${avatarHtml(x.assignee,x.assigneeColor,20)}${escapeHtml(x.assigneeName || x.assignee)}</b></div>
    <div class="detail-row"><span>${t('detailStatus')}</span><b>${t(col.key)}</b></div>
    ${taskDue(x)?`<div class="detail-row"><span>${t('detailDate')}</span><b style="color:${x.overdue?'var(--danger)':'var(--ink)'}">${taskDue(x)}</b></div>`:''}
    ${x.subtasks?`<div class="detail-row"><span>${t('detailSubtasks')}</span><b>${x.subtasks[0]} / ${x.subtasks[1]}</b></div>`:''}
    <div style="margin-top:12px;">
      ${x.col!=='done'
        ? `<button class="submit-btn" onclick="moveTask('${x.id}','done'); closeDetailModal();"><svg style="width:16px;height:16px"><use href="#i-check"/></svg> ${t('detailMarkComplete')}</button>`
        : `<div style="text-align:center;color:var(--green);font-weight:600;font-size:13.5px;">${t('detailDoneMsg')}</div>`}
    </div>`;
  document.getElementById('detailModalOverlay').classList.remove('hidden');
}
function closeDetailModal(){ document.getElementById('detailModalOverlay').classList.add('hidden'); }

/* ================= AI MODAL ================= */
function openAiModal(){
  document.getElementById('aiModalBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div style="width:32px;height:32px;border-radius:9px;background:var(--violet);display:flex;align-items:center;justify-content:center;"><svg style="width:16px;height:16px;color:#fff"><use href="#i-spark"/></svg></div>
      <h3 style="font-size:16px;">${t('aiModalTitle')}</h3>
      <button class="modal-close" style="margin-inline-start:auto" onclick="closeAiModal()"><svg style="width:18px;height:18px"><use href="#i-x"/></svg></button>
    </div>
    <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.8;margin-bottom:12px;">${t('aiModalBody')}</p>
    <div style="background:var(--violet-tint);border-radius:10px;padding:12px;font-size:13px;">${t('aiRecommend')}</div>`;
  document.getElementById('aiModalOverlay').classList.remove('hidden');
}
function closeAiModal(){ document.getElementById('aiModalOverlay').classList.add('hidden'); }

/* ================= MASTER RENDER ================= */
function renderAll(){
  renderHomeStats();
  if(activeView==='board') renderBoard();
  if(activeView==='list') renderList();
}

/* ================= INIT ================= */
// Auth invitation links can establish the session after the page starts loading.
// Re-check the app state when Supabase reports a signed-in session.
sb.auth.onAuthStateChange((event, session) => {
  if(event === 'SIGNED_IN' && session){
    setTimeout(() => checkSession(), 0);
  }
});

applyChrome();
applyTheme();
renderNav();
renderViewTabs();
setActiveNav('tasks');
checkSession();
</script>
</body>
</html>
